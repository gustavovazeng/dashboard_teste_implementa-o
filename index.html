// ── Derived metrics ───────────────────────────────────────────────────────
// channel: "total" (tudo) | "trafego" (platform_name=Meta) | "organico" (sem UTM)
// Investimento só existe pro tráfego pago (é a única fonte de custo na Base
// Meta) — em "organico" o investimento é sempre 0; em "total" soma-se todo o
// gasto (blended) contra o total de leads (tráfego + orgânico).
function leadsForChannel(rows,channel){
  if(!channel||channel==="total")return rows;
  return rows.filter(l=>l.channel===channel);
}
// temp: "todos" | "quente" | "morno" | "frio" — comparado com a temperatura
// extraída do NOME DA CAMPANHA (ver campaignTemperature), tanto nos leads
// quanto nas linhas da Base Meta — isso permite filtrar investimento também,
// já que cada campanha do Meta Ads já nasce com a temperatura no nome.
function leadsForTemp(rows,temp){
  if(!temp||temp==="todos")return rows;
  const map={quente:"Quente",morno:"Morno",frio:"Frio"};
  return rows.filter(l=>l.temperatureName===map[temp]);
}
function sumMetaRows(rows){
  return rows.reduce((a,r)=>({spend:a.spend+r.spend,clicks:a.clicks+r.clicks,impressions:a.impressions+r.impressions,actionLeads:a.actionLeads+r.actionLeads}),
    {spend:0,clicks:0,impressions:0,actionLeads:0});
}
// start/end = null → sem limite naquele lado (mesma convenção de leadsInRange)
function metaRowsFiltered(start,end,temp){
  let rows=S.metaRows.filter(r=>(start===null||r.date>=start)&&(end===null||r.date<=end));
  if(temp&&temp!=="todos"){
    const map={quente:"Quente",morno:"Morno",frio:"Frio"};
    rows=rows.filter(r=>r.temperatureName===map[temp]);
  }
  return rows;
}
function getDaily(start,end,channel="total",temp="todos"){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.leadsByDate)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const m=sumMetaRows(metaRowsFiltered(date,date,temp));
    const dayLeadsAll=S.leadsRows.filter(l=>l.date===date);
    const leads=leadsForTemp(leadsForChannel(dayLeadsAll,channel),temp).length;
    // GAP usa leads TOTAIS (sem dedup) — o gerenciador do Meta (actionLeads)
    // também não deduplica por contato, então comparar contra a contagem já
    // deduplicada infla o GAP artificialmente. O gráfico de volume continua
    // mostrando "leads" (deduplicado) normalmente — só o GAP muda a base.
    const dayLeadsAllRaw=S.leadsRowsRaw.filter(l=>l.date===date);
    const leadsTotal=leadsForTemp(leadsForChannel(dayLeadsAllRaw,channel),temp).length;
    const spend=channel==="organico"?0:m.spend;
    const actionLeads=m.actionLeads||0;
    // GAP % = diferença entre o que o gerenciador (Meta) reportou e os leads
    // totais da planilha (sem dedup), relativa aos leads totais. Positivo =
    // Meta reportou mais leads do que realmente caíram na planilha
    // (duplicidade/atraso etc).
    const gapPct=leadsTotal>0?((actionLeads-leadsTotal)/leadsTotal)*100:null;
    return{date,label:fDate(date),spend,leads,actionLeads,gapPct,
      cpl:leads>0?spend/leads:0};
  });
}
// Séries diárias de qualidade (faixa/quiz/temperatura), % sempre sobre
// quem respondeu naquele dia especificamente (dias com poucos respondentes
// podem oscilar bastante — é esperado).
function getDailyQuality(start,end,channel="total",temp="todos"){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.leadsByDate)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const q=qualityMetrics(date,date,channel,temp);
    return{date,label:fDate(date),...q};
  });
}
function getTotals(daily){
  return daily.reduce((a,d)=>({spend:a.spend+d.spend,leads:a.leads+d.leads}),{spend:0,leads:0});
}
// Investimento/leads/custo-lead da aba Principal, considerando os filtros de
// canal e temperatura. OBS: investimento/CPC/CTR/CPM só reagem ao canal — a
// Base Meta não segmenta gasto por temperatura de público, então filtrar por
// temperatura só restringe a contagem de leads/qualidade, não o investimento.
function principalTotals(start,end,channel,temp="todos"){
  // Gasto/cliques/impressões filtrados pela temperatura da campanha (nome da
  // campanha já indica quente/morno/frio) — não é mais um "blended" único.
  const m=sumMetaRows(metaRowsFiltered(start,end,temp));
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),channel),temp);
  const leads=rows.length;
  const spend=channel==="organico"?0:m.spend;
  const cpl=(spend>0&&leads>0)?spend/leads:null;
  return{spend,leads,cpl,clicks:m.clicks,impressions:m.impressions,actionLeads:m.actionLeads};
}
// % de faixa/quiz/temperatura — sempre sobre quem respondeu (não-resposta não
// entra no denominador), exceto a própria taxa de resposta do quiz, cujo
// denominador é o total de leads do canal/período.
function qualityMetrics(start,end,channel,temp="todos"){
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),channel),temp);
  const total=rows.length;
  const quizRows=rows.filter(l=>l.quizOk);
  const quizPct=total>0?(quizRows.length/total)*100:null;
  // null (vira "—" na tela) quando ninguém respondeu OU quando a tabela de
  // pontos ainda não foi preenchida — sem isso a divisão daria 0%, e um zero
  // pintado de vermelho parece resultado ruim em vez de "ainda não calculado".
  const faixaPct=f=>(quizRows.length>0&&SCORE_TABELA_PRONTA)?(quizRows.filter(l=>l.faixa===f).length/quizRows.length)*100:null;
  const faixaPcts=Object.fromEntries(FAIXA_LETTERS.map(l=>[FAIXA_FIELD_KEY[l],faixaPct(l)]));
  // Tx quente / Tx frio: % das leads do período cuja CAMPANHA é de público
  // quente / frio (ver campaignTemperature). Denominador = todas as leads do
  // recorte, respondendo o quiz ou não.
  const t=tempPcts(rows);
  return{total,quizRespondidoN:quizRows.length,quizPct,...faixaPcts,...t};
}
// Percentuais por temperatura de campanha, reaproveitados pela aba Principal
// e pelo Resumo diário (mesma conta nos dois lugares).
function tempPcts(rows){
  const n=rows.length;
  const cnt=t=>rows.filter(l=>l.temperatureName===t).length;
  const q=cnt("Quente"), m=cnt("Morno"), f=cnt("Frio");
  return{
    quenteN:q, mornoN:m, frioN:f,
    quentePct:n>0?(q/n)*100:null,
    frioPct:n>0?(f/n)*100:null,
    quenteMornoPct:n>0?((q+m)/n)*100:null,
    quenteMornoN:q+m,
  };
}
function fPctOrDash(v){ return v==null?"—":fPct(v); }
// Pacote de métricas usado no Resumo diário: sempre "total" (tráfego+orgânico),
// pois o resumo consolidado do lançamento não segmenta por canal.
function resumoMetrics(s,e){
  const per=periodTotals(s,e);
  // TODAS as métricas de qualidade do Resumo diário são calculadas SÓ sobre
  // leads de TRÁFEGO (faixas, % quente/frio/quente+morno, tx de resposta da
  // pesquisa). Orgânico fica de fora do numerador e do denominador —
  // antes o canal era "total" e as faixas não batiam com a aba de Captação
  // filtrada por tráfego. As linhas "Cadastros no AC Orgânico/Total"
  // continuam existindo, mas são só contagem informativa.
  const qm=qualityMetrics(s,e,"trafego");
  const rowsAll=leadsInRange(s,e);
  const rows=leadsForChannel(rowsAll,"trafego");
  const leadsTrafego=rows.length;
  const leadsOrganico=leadsForChannel(rowsAll,"organico").length;
  // Tx conv Pg cadastro: leads de tráfego ÷ sessões da página de captura
  // (Base GA4, só FBAds — exclusão da página de pesquisa/quiz pendente).
  // SEM fallback aqui (diferente de trafficMetrics/Métricas de Tráfego): o
  // Resumo diário usa só dado real do GA4 — fica "—" quando não há sessão
  // no período, em vez de aproximar por cliques.
  const ga4=ga4Metrics(s,e,"todos");
  const txConvPg=ga4.sessions>0?(leadsTrafego/ga4.sessions)*100:null;
  // Connect Rate: sessões (GA4) ÷ cliques no link (Meta Ads).
  const connectRate=(per.clicks>0&&ga4.sessions>0)?(ga4.sessions/per.clicks)*100:null;
  // Custo por cadastro AC Tráfego: todo o gasto é pago (tráfego), então o
  // custo/lead "oficial" da meta é sobre os cadastros de tráfego — não o
  // blended (que dilui com orgânico, hoje sempre 0 leads).
  const cpl=leadsTrafego>0?per.spend/leadsTrafego:null;
  return{...per,...qm,leadsTrafego,leadsOrganico,cpl,txConvPg,connectRate};
}
// s,e = null → todo o período (all-time)
function periodTotals(s,e){
  const dates=new Set([...Object.keys(S.leadsByDate),...Object.keys(S.meta)]);
  let leads=0,spend=0,clicks=0,impressions=0,actionLeads=0;
  for(const d of dates){
    if(s!==null&&d<s)continue;
    if(e!==null&&d>e)continue;
    leads+=S.leadsByDate[d]||0;
    const m=S.meta[d];
    if(m){ spend+=m.spend||0; clicks+=m.clicks||0; impressions+=m.impressions||0; actionLeads+=m.actionLeads||0; }
  }
  return{leads,spend,clicks,impressions,actionLeads,
    cpl:leads>0?spend/leads:0,
    cpc:clicks>0?spend/clicks:0,
    ctr:impressions>0?(clicks/impressions)*100:0,
    cpm:impressions>0?(spend/impressions)*1000:0};
}
// start/end = null → sem limite naquele lado (usado pelo "Total - Consolidado")
function leadsInRange(start,end){
  return S.leadsRows.filter(l=>(start===null||l.date>=start)&&(end===null||l.date<=end));
}
// Mesma coisa que leadsInRange, mas sobre a lista SEM dedup — só usado pra
// mostrar "leads totais" (toda submissão, mesmo repetida) ao lado do número
// de leads únicas na aba Principal (ver kpiCard "Leads captados").
function leadsInRangeRaw(start,end){
  return S.leadsRowsRaw.filter(l=>(start===null||l.date>=start)&&(end===null||l.date<=end));
}
// ── Campanhas / Anúncios: agregação com cross-filtering ───────────────────
function getMetaRowsInRange(start,end){
  return S.metaRows.filter(r=>r.date>=start&&r.date<=end);
}
function getLeadsRowsForCamp(start,end,campName){
  return S.leadsRows.filter(l=>l.date>=start&&l.date<=end&&l.campName===campName);
}
// Mesma coisa, mas na base SEM dedup — usada só pro GAP: o gerenciador do
// Meta (actionLeads) não deduplica por contato, então comparar contra a
// contagem já deduplicada infla o GAP artificialmente. Mesmo critério do
// GAP diário da aba Principal (ver getDaily).
function getLeadsRawForCamp(start,end,campName){
  return S.leadsRowsRaw.filter(l=>l.date>=start&&l.date<=end&&l.campName===campName);
}
function getLeadsRowsForAd(start,end,adName,campFilter){
  return S.leadsRows.filter(l=>{
    if(l.date<start||l.date>end)return false;
    if(l.adName!==adName)return false;
    if(campFilter&&campFilter.size>0&&!campFilter.has(l.campName))return false;
    return true;
  });
}
// % faixa (sobre quem respondeu o quiz) + % resposta da pesquisa (sobre todos
// os leads daquela campanha/anúncio) — mesma convenção usada na aba Principal.
function qualityFromLeadsArray(leadsArr){
  const total=leadsArr.length;
  const quizRows=leadsArr.filter(l=>l.quizOk);
  const quizPct=total>0?(quizRows.length/total)*100:null;
  // null (vira "—" na tela) quando ninguém respondeu OU quando a tabela de
  // pontos ainda não foi preenchida — sem isso a divisão daria 0%, e um zero
  // pintado de vermelho parece resultado ruim em vez de "ainda não calculado".
  const faixaPct=f=>(quizRows.length>0&&SCORE_TABELA_PRONTA)?(quizRows.filter(l=>l.faixa===f).length/quizRows.length)*100:null;
  const faixaPcts=Object.fromEntries(FAIXA_LETTERS.map(l=>[FAIXA_FIELD_KEY[l],faixaPct(l)]));
  return{quizPct,...faixaPcts};
}
// Célula do GAP na tabela de campanhas: verde até 10%, amarelo de 10% a 20%,
// vermelho acima de 20% — quanto MENOR o GAP, melhor (gerenciador e planilha
// batendo). Negativo (planilha com mais leads que o gerenciador) é tratado
// pelo módulo: o que importa é a distância de zero. O title do <td> mostra a
// conta por trás (gerenciador × planilha sem dedup).
function gapTd(gapPct,actionLeads,leadsRaw){
  if(gapPct==null)return `<td class="mono" style="text-align:right;color:var(--hint)">—</td>`;
  const abs=Math.abs(gapPct);
  const cor=abs<=10?"#34d399":abs<=20?"#fbbf24":"#f87171";
  const sinal=gapPct>0?"+":"";
  return `<td class="mono" style="text-align:right;color:${cor}" title="gerenciador: ${actionLeads} · planilha (sem dedup): ${leadsRaw}">${sinal}${fPct(gapPct)}</td>`;
}
function getCampRows(start,end){
  // As linhas vêm da Base Meta, então "Tráfego sem UTM" já não apareceria
  // aqui; o filtro é uma trava explícita, caso um dia a tabela passe a ser
  // montada a partir das leads.
  const rows=getMetaRowsInRange(start,end).filter(r=>r.campName!==SEM_UTM_LABEL);
  const byCamp={};
  for(const r of rows){
    const cn=r.campName||"(sem campanha)";
    if(!byCamp[cn])byCamp[cn]={campName:cn,spend:0,clicks:0,impressions:0,actionLeads:0};
    byCamp[cn].spend+=r.spend;byCamp[cn].clicks+=r.clicks;byCamp[cn].impressions+=r.impressions;byCamp[cn].actionLeads+=r.actionLeads;
  }
  return Object.values(byCamp).map(c=>{
    const leadsArr=getLeadsRowsForCamp(start,end,c.campName);
    const leads=leadsArr.length;
    const q=qualityFromLeadsArray(leadsArr);
    // GAP % = (leads do gerenciador − leads reais sem dedup) ÷ leads reais.
    // Positivo = o Meta reportou mais do que caiu na planilha. null quando
    // não há lead real no período (divisão por zero).
    const leadsRaw=getLeadsRawForCamp(start,end,c.campName).length;
    const gapPct=leadsRaw>0?((c.actionLeads-leadsRaw)/leadsRaw)*100:null;
    return {...c,leads,leadsRaw,gapPct,...q,
      cpc:c.clicks>0?c.spend/c.clicks:0, ctr:c.impressions>0?(c.clicks/c.impressions)*100:0,
      cpm:c.impressions>0?(c.spend/c.impressions)*1000:0, cpl:leads>0?c.spend/leads:0};
  });
}
function getAdRows(start,end,selectedCamps){
  const hasSel=selectedCamps&&selectedCamps.size>0;
  let rows=getMetaRowsInRange(start,end);
  if(hasSel)rows=rows.filter(r=>selectedCamps.has(r.campName));
  const byAd={};
  for(const r of rows){
    const an=r.adName||"(sem anúncio)";
    if(!byAd[an])byAd[an]={adName:an,spend:0,clicks:0,impressions:0,actionLeads:0,igUrl:"",camps:new Set()};
    byAd[an].spend+=r.spend;byAd[an].clicks+=r.clicks;byAd[an].impressions+=r.impressions;byAd[an].actionLeads+=r.actionLeads;
    if(!byAd[an].igUrl&&r.igUrl)byAd[an].igUrl=r.igUrl;
    if(r.campName)byAd[an].camps.add(r.campName);
  }
  return Object.values(byAd).map(a=>{
    const leadsArr=getLeadsRowsForAd(start,end,a.adName,hasSel?selectedCamps:null);
    const leads=leadsArr.length;
    const q=qualityFromLeadsArray(leadsArr);
    return {...a,leads,...q,campNames:[...a.camps].join(", "),
      cpc:a.clicks>0?a.spend/a.clicks:0, ctr:a.impressions>0?(a.clicks/a.impressions)*100:0,
      cpm:a.impressions>0?(a.spend/a.impressions)*1000:0, cpl:leads>0?a.spend/leads:0};
  });
}

function applyQuickCurrent(k){
  const t=todayISO();
  const map={hoje:()=>({s:t,e:t}),ontem:()=>{const y=yesterdayISO();return{s:y,e:y}},
    "7d":()=>({s:nDaysAgoISO(6),e:t}),"30d":()=>({s:nDaysAgoISO(29),e:t}),mes:()=>({s:firstOfMonthISO(),e:t})};

// ── Canvas / Chart helpers ────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  cssW=Math.max(cssW,50);cssH=Math.max(cssH,50);
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);
  return ctx;
}
function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    ctx.lineTo(xP(n-1),yP(0));ctx.lineTo(xP(0),yP(0));ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,ctx.canvas.height/DPR);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}
function drawDualInvCpl(id,data,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:58,b:28,l:64};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.cpl||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,META_CPL,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v)/(lMax))*cH;
  const yPR=v=>P.t+cH-((v)/(rMax))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fUSDShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  const mY=yPR(META_CPL);
  ctx.strokeStyle=CHART_CPL+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=CHART_CPL;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
  ctx.fillText("Meta $"+META_CPL,P.l+cW+4,mY-3);
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPL,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Mesmo gráfico dual do drawDualInvCpl (Investimento × métrica no eixo
// direito), mas genérico: aceita qual campo do "data" usar no eixo direito e
// qual meta comparar — usado no Carrinho (Investimento × Custo/ficha com
// preço, meta R$40) sem precisar de outra cópia inteira da função.
function drawDualInvMetric(id,data,cssW,cssH,metricKey,metaVal){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:58,b:28,l:64};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d[metricKey]||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,metaVal||0,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v)/(lMax))*cH;
  const yPR=v=>P.t+cH-((v)/(rMax))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fUSDShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  if(metaVal!=null){
    const mY=yPR(metaVal);
    ctx.strokeStyle=CHART_CPL+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=CHART_CPL;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta $"+metaVal,P.l+cW+4,mY-3);
  }
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPL,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
function drawBars(ctx,xP,yP,yZero,vals,color,barW){
  vals.forEach((v,i)=>{
    const x=xP(i)-barW/2, y=Math.min(yP(v),yZero), h=Math.abs(yP(v)-yZero);
    ctx.fillStyle=color+"cc";
    ctx.fillRect(x,y,barW,Math.max(h,v>0?1:0));
  });
}
function drawBarSingle(id,data,key,color,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:40};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,color,barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){
      ctx.fillStyle="#e8edf6";ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;
      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Barras de % do investimento por dia (valor de cada dia ÷ total do período) —
// mesmo esqueleto do drawBarSingle, mas rotulando cada barra em % em vez de

function drawBarPercent(id,data,key,totalVal,color,cssW,cssH){

  const yP=v=>P.t+cH-(v/maxV)*cH;

    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText((maxV-(i/4)*maxV).toFixed(0)+"%",P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,pctVals,color,barW);
  const step=n>60?7:n>30?3:n>14?2:1;

  });

}
// Barras (leads/dia, eixo esq.) + linha opcional de GAP% (gerenciador × planilha, eixo dir.)
function drawBarWithGap(id,data,barKey,gapKey,barColor,gapColor,cssW,cssH,showGap){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:showGap?50:12,b:28,l:40};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[barKey]||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,barColor,barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){
      ctx.fillStyle="#e8edf6";ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;
      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  if(showGap){
    const gapVals=data.map(d=>d[gapKey]==null?0:d[gapKey]);
    const rMin=Math.min(0,...gapVals)*1.15;
    const rMax=Math.max(...gapVals,1)*1.15;
    const span=(rMax-rMin)||1;
    const yPR=v=>P.t+cH-((v-rMin)/span)*cH;
    for(let i=0;i<=4;i++){
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=gapColor;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
      ctx.fillText((rMax-(i/4)*span).toFixed(0)+"%",P.l+cW+4,y+3);
    }
    if(rMin<0){
      const zY=yPR(0);
      ctx.strokeStyle="rgba(255,255,255,.15)";ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(P.l,zY);ctx.lineTo(P.l+cW,zY);ctx.stroke();ctx.setLineDash([]);
    }
    drawLineArea(ctx,xP,yPR,gapVals,gapColor,false);
  }
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Múltiplas linhas de % (0-100) — usado nas séries diárias de qualidade
// (Faixa A/B/C/D, % resposta da pesquisa). Pontos nulos (sem resposta no dia) quebram
// a linha em vez de cair pra zero.
// showLabels=true escreve o valor (%) de cada ponto em cima da linha — usado
// no gráfico "% Faixa por dia" pra bater o olho sem precisar passar o mouse.
// Cada série pode opcionalmente trazer `meta` (número 0-100), que desenha uma
// linha tracejada horizontal na cor da série (mesmo padrão do drawMetricLine).
function drawMultiLine(id,data,series,cssW,cssH,showLabels=false){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:36};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,Math.min(100,v))/100)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText((100-(i/4)*100).toFixed(0)+"%",P.l-4,y+3);
  }
  series.forEach(s=>{
    if(s.meta==null)return;
    const mY=yP(s.meta);
    ctx.strokeStyle=s.color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
  });
  series.forEach(s=>{
    const vals=data.map(d=>d[s.key]);
    ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.setLineDash([]);
    let started=false;
    vals.forEach((v,i)=>{
      if(v==null){started=false;return;}
      if(!started){ctx.moveTo(xP(i),yP(v));started=true;}
      else ctx.lineTo(xP(i),yP(v));
    });
    ctx.stroke();
    vals.forEach((v,i)=>{
      if(v==null)return;
      ctx.beginPath();ctx.fillStyle=s.color;ctx.arc(xP(i),yP(v),2.5,0,7);ctx.fill();
    });
    if(showLabels){
      ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
      vals.forEach((v,i)=>{
        if(v==null)return;
        const y=yP(v),hasRoom=y-P.t>13;
        ctx.fillStyle=s.color;
        ctx.fillText(v.toFixed(0)+"%",xP(i),y+(hasRoom?-6:13));
      });
    }
  });
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      const _v=d[l.key];
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${_v==null?"—":(l.fmt||fUSD)(+_v)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

function chkBox(checked){

  </div>`;
}
function adResumoBlock(a){
  const lines=[];
  lines.push(`Nome do ad ⤵️`);
  lines.push(a.adName);
  lines.push(``);
  if(a.igUrl)lines.push(a.igUrl);
  lines.push(`Investimento:\t${fUSD(a.spend)}`);
  lines.push(`Leads:\t${a.leads}`);
  lines.push(`Custo/lead:\t${a.leads>0?fUSD(a.cpl):"—"}`);
  lines.push(``);
  lines.push(`Tx Faixa A:\t${fPctOrDash(a.faixaA)}`);
  lines.push(`Tx Faixa B:\t${fPctOrDash(a.faixaB)}`);
  lines.push(`Tx Faixa C:\t${fPctOrDash(a.faixaC)}`);
  lines.push(`Tx Faixa D:\t${fPctOrDash(a.faixaD)}`);
  lines.push(`% resposta da pesquisa:\t${fPctOrDash(a.quizPct)}`);

  lines.push(`CPC:\t${fUSD(a.cpc)}`);

  // Custo/lead) — metaKey é a chave em METAS_RESUMO (faixaA/faixaB/...).
  function faixaTd(val,metaKey){
    const meta=METAS_RESUMO[metaKey];
    const color=(val!=null&&meta)?statusColor(val,meta.val,meta.higher):"var(--muted)";
    return `<td class="mono" style="text-align:right;color:${color}">${fPctOrDash(val)}</td>`;

  const campRowsAll=getCampRows(start,end);

  const {col:cCol,dir:cDir}=S.cSort;
  // Ordenação: null vai SEMPRE pro fim, independente da direção. Sem isso o
  // "??0" antigo fazia campanha sem dado (GAP/faixa nulos) aparecer como se
  // fosse zero — ou seja, uma campanha sem nenhuma lead subia pro topo do
  // GAP como se estivesse perfeitamente casada com o gerenciador.
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol],bv=b[cCol];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    if(typeof av==="string")return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;

  const adRowsAll=getAdRows(start,end,S.selectedCamps);

    return dir==="asc"?av-bv:bv-av;

      ${kpiCard("Custo/lead",totCpl>0?fUSD(totCpl):"—",`meta ${fUSD(META_CPL)}`,totCpl>0?statusColor(totCpl,META_CPL,false):"var(--text-strong)",false,totCpl,META_CPL,false)}

// ── Render: Leads (Qualidade) ──────────────────────────────────────────────
function distinctCount(rows,key){
  const c={};
  for(const r of rows){ const v=r[key]||"(não informado)"; c[v]=(c[v]||0)+1; }
  return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}
function setLeadsChannel(c){ S.leadsChannel=c; renderLeads(); }
function setLeadsTemp(t){ S.leadsTemp=t; renderLeads(); }
function leadsChannelToggle(){
  const CH=[["total","Total"],["trafego","Tráfego"],["organico","Orgânico"]];
  return `<div class="presets">${CH.map(([k,lbl])=>
    `<button class="btn-pre${S.leadsChannel===k?" on":""}" onclick="MDI.setLeadsChannel('${k}')">${lbl}</button>`).join("")}</div>`;
}
function leadsTempToggle(){
  const TP=[["todos","Todos"],["quente","Quente"],["morno","Morno"],["frio","Frio"]];
  return `<div class="presets">${TP.map(([k,lbl])=>
    `<button class="btn-pre${S.leadsTemp===k?" on":""}" onclick="MDI.setLeadsTemp('${k}')">${lbl}</button>`).join("")}</div>`;
}
function renderLeads(){
  const el=document.getElementById("page-leads");if(!el)return;
  const start=S.startDate,end=S.endDate;
  const per=getCurrentPeriod();
  const ch=S.leadsChannel, temp=S.leadsTemp;
  const chLabel={total:"Total",trafego:"Tráfego",organico:"Orgânico"}[ch];
  const tempLabel={todos:"Todos",quente:"Quente",morno:"Morno",frio:"Frio"}[temp];
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),ch),temp);
  const quizRows=rows.filter(l=>l.quizOk);
  const total=rows.length;
  const quizPct=total>0?(quizRows.length/total)*100:0;

  const faixaOrder=FAIXA_LETTERS;
  const faixaColors=CHART_FAIXA;
  const faixaCounts=faixaOrder.map(f=>({f,n:quizRows.filter(l=>l.faixa===f).length}));

  const origemCounts=distinctCount(rows,"utmSource").slice(0,10);
  const maxOrigem=origemCounts.length?origemCounts[0][1]:1;

  // tip = enunciado completo da pergunta, mostrado no hover — os títulos das
  // 3 tabelas da pesquisa são encurtados pra caber no cabeçalho do bloco.
  function demoBlock(title,key,tip){
    const counts=distinctCount(quizRows,key).slice(0,10);

// Retorna null se a data estiver fora do período planejado (ex.: antes do

function planForDate(dateISO){
  return PLANO_DIARIO.find(p=>p.date===dateISO)||null;
}

// só pro "% de atingimento" do bloco Total-Consolidado do Resumo diário.

  return{
    investimento:PLANO_DIARIO.reduce((a,p)=>a+p.investimento,0),
    leads:PLANO_DIARIO.reduce((a,p)=>a+p.leads,0),
  };
}

// Seção isolada de resumo de etapa dentro do Resumo diário — cada uma com
// seu próprio botão "Copiar resumo" (independente do da Captação e dos das
// outras etapas), pra poder ir em cada etapa e enviar o resumo separado, na
// hora que quiser.
// Painel de pré-visualização: mostra EXATAMENTE o texto que o botão
// "Copiar resumo" coloca na área de transferência. Mesmo componente do
// Resumo consolidado da Captação — card com borda, sticky no topo, dentro
// da coluna da direita do grid "1fr 420px".
function resumoPreviewBox(text){
  return `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;position:sticky;top:70px">
    <pre style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.8;margin:0;user-select:all">${String(text||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
  </div>`;
}
function stageResumoSection(title,subtitle,bodyHtml,scopeKey,previewText){
  return `<div style="margin-top:28px;padding-top:22px;border-top:1px solid var(--border)">
    <div class="hdr" style="margin-bottom:14px">
      <div>
        <div class="hdr-title" style="font-size:16px">${title}</div>
        <div class="hdr-sub">${subtitle}</div>
      </div>
      <button onclick="MDI.copyStageResumo('${scopeKey}',this)" class="btn-copy-resumo" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif">
        📋 Copiar resumo
      </button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start">
      <div>${bodyHtml}</div>
      ${previewText?resumoPreviewBox(previewText):"<div></div>"}
    </div>
  </div>`;
}
function setManualSpendHoje(v){
  const n=parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",",".")); // aceita "$ 1.234,56" e "1234.56"
  S.manualSpendHoje=(isNaN(n)||n<=0)?null:n;
  renderResumo();
}
function clearManualSpendHoje(){S.manualSpendHoje=null;renderResumo();}
function copyResumo(){
  const el=document.getElementById("page-resumo");
  const text=el?._resumoText||"";if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    document.querySelectorAll(".btn-copy-resumo").forEach(b=>{
      const orig=b.innerHTML;b.innerHTML="✓ Copiado!";b.style.color="#4ade80";
      setTimeout(()=>{b.innerHTML=orig;b.style.color="";},1800);
    });
  }).catch(()=>alert("Não foi possível copiar. Selecione o texto manualmente."));
}

// ── Render: Métricas do Tráfego (placeholder — conteúdo a definir) ─────────
// Métricas de tráfego (CPC/CTR/CPM/Tx Pág→Cadastro/Connect Rate), filtráveis
// só por temperatura (extraída do nome da campanha) — não tem filtro de canal
// porque é tudo tráfego pago (a única fonte de investimento na Base Meta).
function trafficMetrics(start,end,temp){
  const m=sumMetaRows(metaRowsFiltered(start,end,temp));
  const leadsRowsT=leadsForTemp(leadsInRange(start,end),temp);
  const leads=leadsRowsT.length;
  const leadsTrafego=leadsForChannel(leadsRowsT,"trafego").length;
  const cpl=leads>0?m.spend/leads:null;
  const cpc=m.clicks>0?m.spend/m.clicks:null;
  const ctr=m.impressions>0?(m.clicks/m.impressions)*100:null;
  const cpm=m.impressions>0?(m.spend/m.impressions)*1000:null;
  const ga4=ga4Metrics(start,end,temp);
  // Tx Pág → Cadastro: leads de tráfego ÷ sessões da página de captura (Base
  // GA4, só FBAds — exclusão da página de pesquisa/quiz pendente). Cai de volta pra aproximação
  // leads/cliques quando não há dado de GA4 no período (ex.: antes da Base
  // GA4 existir) — txConvPgAprox sinaliza quando é essa aproximação, pra UI
  // avisar que não é o dado real do GA4 (diferente do Resumo diário, que não
  // tem esse fallback).
  const txConvPgAprox=ga4.sessions===0&&m.clicks>0;
  const txConvPg=ga4.sessions>0?(leadsTrafego/ga4.sessions)*100:(m.clicks>0?(leads/m.clicks)*100:null);
  // Connect Rate: sessões da página de captura (GA4) ÷ cliques no link (Meta
  // Ads) — mede quantos de quem clicou no anúncio realmente carregou a
  // página. Só existe quando há dado de GA4 no período.
  const connectRate=(m.clicks>0&&ga4.sessions>0)?(ga4.sessions/m.clicks)*100:null;
  return{spend:m.spend,leads,cpl,cpc,ctr,cpm,txConvPg,txConvPgAprox,connectRate};
}
function getDailyTraffic(start,end,temp){
  const dates=new Set(Object.keys(S.meta));
  return Array.from(dates).sort().filter(d=>d>=start&&d<=end).map(date=>({date,label:fDate(date),...trafficMetrics(date,date,temp)}));
}

// Linha única de uma métrica ao longo do tempo, com escala dinâmica (baseada
// no próprio dado + na meta) e linha tracejada de meta — mesmo padrão visual
// do gráfico dual de Investimento×Custo/lead da aba Principal.
function drawMetricLine(id,data,key,color,metaVal,cssW,cssH,fmt){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:56,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]);
  const validVals=vals.filter(v=>v!=null);
  const maxRaw=Math.max(...validVals,metaVal||0,0.01);
  const max=maxRaw*1.2;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,v)/max)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(max-(i/4)*max),P.l-5,y+3);
  }
  if(metaVal!=null){
    const mY=yP(metaVal);
    ctx.strokeStyle=color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=color;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta "+fmt(metaVal),P.l+cW+4,mY-3);
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  let started=false;
  vals.forEach((v,i)=>{
    if(v==null){started=false;return;}
    if(!started){ctx.moveTo(xP(i),yP(v));started=true;}
    else ctx.lineTo(xP(i),yP(v));
  });
  ctx.stroke();
  vals.forEach((v,i)=>{
    if(v==null)return;
    ctx.beginPath();ctx.fillStyle=color;ctx.arc(xP(i),yP(v),2.5,0,7);ctx.fill();
  });
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Mesma métrica em BARRAS em vez de linha — usado quando o período é curto
// demais (ex.: 1-2 dias, caso das Aulas) e uma linha não mostra nada de
// útil. Mesma grade dinâmica e linha tracejada de meta do drawMetricLine,
// mas com rótulo formatado (fmt) em cima de cada barra em vez do rótulo
// inteiro arredondado do drawBarSingle.
function drawMetricBar(id,data,key,color,metaVal,cssW,cssH,fmt){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:56,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]);
  const validVals=vals.filter(v=>v!=null);
  const maxRaw=Math.max(...validVals,metaVal||0,0.01);
  const max=maxRaw*1.25;
  const n=data.length;
  const barW=Math.max(10,Math.min(60,(cW/Math.max(n,1))*0.45));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,v)/max)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(max-(i/4)*max),P.l-5,y+3);
  }
  if(metaVal!=null){
    const mY=yP(metaVal);
    ctx.strokeStyle=color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=color;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta "+fmt(metaVal),P.l+cW+4,mY-3);
  }
  vals.forEach((v,i)=>{
    if(v==null)return;
    const x=xP(i)-barW/2,y=yP(v),h=Math.max(P.t+cH-y,1);
    ctx.fillStyle=color+"cc";
    ctx.fillRect(x,y,barW,h);
  });
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v==null)return;
    ctx.fillStyle="#e8edf6";ctx.font="bold 10px 'DM Mono',monospace";
    ctx.fillText(fmt(v),xP(i),yP(v)-4);
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>ctx.fillText(d.label,xP(i),P.t+cH+18));
}

// ── Carrinho: Principal (KPIs + gráficos) ───────────────────────────────────
// Investimento/cliques vêm da MESMA Base Meta - captação, filtrada por
// campanha (via campaignStage==="Carrinho") — o Carrinho não tem uma sheet de
// mídia própria, suas campanhas só se identificam pelo nome, igual às outras
// etapas. Fichas vêm das 3 sheets processadas em processCarrinhoFichas().
function carrinhoMetaRowsInRange(start,end){
  return carrinhoMetaRows().filter(r=>r.date>=start&&r.date<=end);
}
function carrinhoFichasInRange(fichas,start,end){
  return fichas.filter(f=>f.date>=start&&f.date<=end);
}
// Só fichas de TRÁFEGO entram aqui (com e sem preço). As orgânicas/disparo
// ficam restritas à sub-aba "Fichas" — não entram em custo por ficha, nem no
// Principal, nem no Resumo, porque não há investimento associado a elas e
// isso distorceria o custo pra baixo.
function carrinhoMetrics(start,end){
  const metaRows=carrinhoMetaRowsInRange(start,end);
  const spend=metaRows.reduce((a,r)=>a+r.spend,0);
  const clicks=metaRows.reduce((a,r)=>a+r.clicks,0);
  const impressions=metaRows.reduce((a,r)=>a+(r.impressions||0),0);
  const fichas=carrinhoFichasInRange(S.carrinhoFichaOrigem,start,end).filter(f=>f.tipo==="traf");
  const fichasTotal=fichas.length;
  const fichasComPreco=fichas.filter(f=>f.comPreco).length;
  return{spend,clicks,impressions,fichasTotal,fichasComPreco,
    custoFicha:fichasTotal>0?spend/fichasTotal:null,
    custoFichaComPreco:fichasComPreco>0?spend/fichasComPreco:null,
    cpc:clicks>0?spend/clicks:null,
    ctr:impressions>0?(clicks/impressions)*100:null,
    cpm:impressions>0?(spend/impressions)*1000:null,
    // Tx conversão formulário = fichas de tráfego ÷ cliques no link.
    txConvForm:clicks>0?(fichasTotal/clicks)*100:null};
}
function getCarrinhoDaily(start,end){
  const metaByDate={};
  for(const r of carrinhoMetaRows()){
    if(r.date<start||r.date>end)continue;
    if(!metaByDate[r.date])metaByDate[r.date]={spend:0,clicks:0};
    metaByDate[r.date].spend+=r.spend;metaByDate[r.date].clicks+=r.clicks;
  }
  // tipo "traf" = ficha com UTM de anúncio; qualquer outro (org/disparo)
  // entra em orgânico, mesmo critério das tabelas de origem/canal.
  // fichas/fichasComPreco = só TRÁFEGO (as que entram em custo por ficha).
  // fichasOrg existe só pro gráfico "Fichas por dia (orgânico)" do Principal:
  // volume informativo, fora de qualquer custo e fora do Resumo.
  const fichasByDate={},fichasComPrecoByDate={},fichasOrgByDate={};
  for(const f of S.carrinhoFichaOrigem){
    if(f.date<start||f.date>end)continue;
    if(f.tipo!=="traf"){ fichasOrgByDate[f.date]=(fichasOrgByDate[f.date]||0)+1; continue; }
    fichasByDate[f.date]=(fichasByDate[f.date]||0)+1;
    if(f.comPreco)fichasComPrecoByDate[f.date]=(fichasComPrecoByDate[f.date]||0)+1;
  }
  const dates=new Set([...Object.keys(metaByDate),...Object.keys(fichasByDate),...Object.keys(fichasOrgByDate)]);
  return[...dates].sort().map(d=>{
    const m=metaByDate[d]||{spend:0,clicks:0};
    const fichas=fichasByDate[d]||0, fichasComPreco=fichasComPrecoByDate[d]||0;
    return{date:d,label:fDate(d),spend:m.spend,clicks:m.clicks,fichas,fichasComPreco,
      fichasOrg:fichasOrgByDate[d]||0,
      custoFichaComPreco:fichasComPreco>0?m.spend/fichasComPreco:null};
  });
}

// ── Carrinho: Fichas (Origem / Canal) ───────────────────────────────────────
function carrinhoPassQual(tipo,qual){ return !qual||qual==="todas"||tipo===qual; }
// FBAds = tráfego pago reconhecido pela UTM (mesmo critério já usado na Base
// leads da Captação); qualquer outro utm_source vira sua própria origem —
// sem de-para inventado, já que o vocabulário desta base pode não ser igual
// ao de outro projeto.
function carrinhoNormOrigem(o){
  if(o&&o.includes("FBAds"))return "Tráfego";
  return o||"(não informado)";
}
function carrinhoCanalKey(origem,canal){
  if(origem&&origem.includes("FBAds"))return "Tráfego";
  return canal||"(não informado)";
}
function getCarrinhoOrigemRows(fichas,start,end,qual,vendas=[]){
  const byOrigem={};
  for(const f of fichas){
    if(f.date<start||f.date>end)continue;
    if(!carrinhoPassQual(f.tipo,qual))continue;
    const o=carrinhoNormOrigem(f.origem);
    if(!byOrigem[o])byOrigem[o]={origem:o,fichas:0,comPreco:0,vendas:0};
    byOrigem[o].fichas++;
    if(f.comPreco)byOrigem[o].comPreco++;
  }
  for(const v of vendas){
    if(v.date<start||v.date>end)continue;
    if(!carrinhoPassQual(v.tipo,qual))continue;
    const o=carrinhoNormOrigem(v.origem);
    if(!byOrigem[o])byOrigem[o]={origem:o,fichas:0,comPreco:0,vendas:0};
    byOrigem[o].vendas++;
  }
  const total=Object.values(byOrigem).reduce((a,o)=>a+o.fichas,0);
  return Object.values(byOrigem).map(o=>({...o,
    pctComPreco:o.fichas>0?(o.comPreco/o.fichas)*100:0,
    conv:o.fichas>0?(o.vendas/o.fichas)*100:0,
    repres:total>0?(o.fichas/total)*100:0}));
}
function getCarrinhoCanalRows(fichas,start,end,qual,vendas=[]){
  const byCanal={};
  for(const f of fichas){
    if(f.date<start||f.date>end)continue;
    if(!carrinhoPassQual(f.tipo,qual))continue;
    const c=carrinhoCanalKey(f.origem,f.canal);
    if(!byCanal[c])byCanal[c]={canal:c,fichas:0,comPreco:0,vendas:0};
    byCanal[c].fichas++;
    if(f.comPreco)byCanal[c].comPreco++;
  }
  for(const v of vendas){
    if(v.date<start||v.date>end)continue;
    if(!carrinhoPassQual(v.tipo,qual))continue;
    const c=carrinhoCanalKey(v.origem,v.canal);
    if(!byCanal[c])byCanal[c]={canal:c,fichas:0,comPreco:0,vendas:0};
    byCanal[c].vendas++;
  }
  const total=Object.values(byCanal).reduce((a,c)=>a+c.fichas,0);
  return Object.values(byCanal).map(c=>({...c,
    pctComPreco:c.fichas>0?(c.comPreco/c.fichas)*100:0,
    conv:c.fichas>0?(c.vendas/c.fichas)*100:0,
    repres:total>0?(c.fichas/total)*100:0}));
}

// ── Carrinho: Vendas ─────────────────────────────────────────────────────────
// "Base vendas" não tem valor da venda (Nome/Email/Whatsapp1/Data Correta/UTM
// Source) — por isso não dá pra calcular faturamento/ROAS aqui, só volume e
// conversão de ficha em venda. Cada venda é casada com a ficha (tráfego ou
// orgânico) mais antiga da pessoa, batendo por telefone OU e-mail.
function getCarrinhoVendaOrigemRows(start,end){
  const by={};
  for(const v of S.carrinhoVendaOrigem){
    if(v.date<start||v.date>end)continue;
    const o=carrinhoNormOrigem(v.origem);
    by[o]=(by[o]||0)+1;
  }
  return Object.entries(by).map(([origem,vendas])=>({origem,vendas})).sort((a,b)=>b.vendas-a.vendas);
}
function getCarrinhoVendasDaily(start,end){
  return Object.keys(S.carrinhoVendasPorDia).filter(d=>d>=start&&d<=end).sort()
    .map(d=>({date:d,label:fDate(d),vendas:S.carrinhoVendasPorDia[d]}));
}
// Investimento TOTAL de tráfego do lançamento inteiro: captação, lives da
// captação, aquecimento, lembrete, aulas e carrinho. É a base do ROAS do
// carrinho — a venda no fim do funil é fruto de tudo que foi gasto antes,
// não só da verba do próprio carrinho.
// O filtro na Base Meta - captação evita contar o Carrinho DUAS vezes: se
// alguma campanha de carrinho ainda estiver naquela aba, ela é descartada
// aqui e o valor vem de carrinhoMetaRows(), que é a fonte oficial da etapa.
function investimentoTotalLancamento(){
  const soma=arr=>(arr||[]).reduce((a,r)=>a+(r.spend||0),0);
  return soma((S.metaRows||[]).filter(r=>campaignStage(r.campName)!=="Carrinho"))
        +soma(S.livesCaptacaoRows)
        +soma(carrinhoMetaRows())
        +soma(S.aquecimentoRows)
        +soma(S.lembreteRows)
        +soma(S.aulasRows);
}
function renderCarrinhoVendas(){
  const el=document.getElementById("page-carrinho-vendas");if(!el)return;
  const per=getCurrentPeriod();
  const start=S.startDate,end=S.endDate;
  const fichasNoPeriodo=carrinhoFichasInRange(S.carrinhoFichaOrigem,start,end).length;
  const vendasNoPeriodo=Object.entries(S.carrinhoVendasPorDia).filter(([d])=>d>=start&&d<=end).reduce((a,[,n])=>a+n,0);
  const vendasCasadas=S.carrinhoVendaOrigem.filter(v=>v.date>=start&&v.date<=end).length;
  const conv=fichasNoPeriodo>0?(vendasNoPeriodo/fichasNoPeriodo)*100:0;
  // Faturamento e ROAS são SEMPRE do lançamento inteiro — ignoram o filtro
  // de datas do cabeçalho, igual ao investimento total que vai no
  // denominador. Assim os dois lados da conta falam do mesmo período e o
  // ROAS não fica subestimado por um filtro curto.
  const vendasPer=S.carrinhoVendaOrigem;
  const faturamento=vendasPer.reduce((a,v)=>a+(v.valor||0),0);
  const ticket=vendasPer.length>0?faturamento/vendasPer.length:null;
  const invTotal=investimentoTotalLancamento();
  const roas=invTotal>0?faturamento/invTotal:null;
  const daily=getCarrinhoVendasDaily(start,end);
  const origemRows=getCarrinhoVendaOrigemRows(start,end);

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">

    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <div style="font-size:10px;color:var(--hint);margin-bottom:14px">Faturamento e ROAS consideram o LANÇAMENTO INTEIRO, sem o filtro de datas do cabeçalho (os demais cartões respeitam o período). ROAS = faturamento ÷ investimento de tráfego do lançamento INTEIRO (captação + lives + aquecimento + lembrete + aulas + carrinho), não só a verba do carrinho.</div>

    <div class="g4" style="margin-bottom:13px">
      ${kpiCard("Faturamento total",fUSD(faturamento),`${vendasPer.length.toLocaleString("pt-BR")} venda(s) · lançamento inteiro`,"#34d399")}
      ${kpiCard("Ticket médio",ticket!=null?fUSD(ticket):"—","lançamento inteiro","var(--text-strong)")}

      ${kpiCard("ROAS",roas!=null?roas.toFixed(2).replace(".",","):"—",roas!=null?`${fUSD(faturamento)} ÷ ${fUSD(invTotal)}`:"sem investimento no período",roas!=null?(roas>=1?"#34d399":"#f87171"):"var(--text-strong)")}

// ── Carrinho: Campanhas/Anúncios ────────────────────────────────────────────
// Agregação por CAMPANHA (Carrinho) — mesma base de anúncios, só que somada
// por campName. Fichas/vendas são casadas por campName (cada ficha/venda de
// tráfego já carrega o campName do anúncio que a originou).
function getCarrinhoCampRows(start,end){
  const rows=carrinhoMetaRowsInRange(start,end);
  const byCamp={};
  for(const r of rows){
    const key=r.campName||"(sem campanha)";
    if(!byCamp[key])byCamp[key]={campName:key,spend:0,clicks:0,impressions:0};
    const c=byCamp[key];
    c.spend+=r.spend;c.clicks+=r.clicks;c.impressions+=r.impressions;
  }
  const fichasByCamp={},fichasComPrecoByCamp={};
  for(const f of S.carrinhoFichaAttrib){
    if(f.date<start||f.date>end)continue;
    const cn=f.campName||"(sem campanha)";
    fichasByCamp[cn]=(fichasByCamp[cn]||0)+1;
    if(f.comPreco)fichasComPrecoByCamp[cn]=(fichasComPrecoByCamp[cn]||0)+1;
  }
  const vendasByCamp={};
  for(const v of S.carrinhoVendaAttrib){
    if(v.date<start||v.date>end)continue;
    const cn=v.campName||"(sem campanha)";
    vendasByCamp[cn]=(vendasByCamp[cn]||0)+1;
  }
  return Object.values(byCamp).map(c=>{
    const fichas=fichasByCamp[c.campName]||0, fichasComPreco=fichasComPrecoByCamp[c.campName]||0;
    const vendas=vendasByCamp[c.campName]||0;
    return{...c,
      cpc:c.clicks>0?c.spend/c.clicks:null,
      ctr:c.impressions>0?(c.clicks/c.impressions)*100:0,
      fichas,fichasComPreco,vendas,
      convFichaVenda:fichas>0?(vendas/fichas)*100:0,
      custoFichaComPreco:fichasComPreco>0?c.spend/fichasComPreco:null};
  });
}
// selectedCamps (Set opcional) → mesmo esquema de cross-filtering da Captação:
// se houver campanhas selecionadas, os anúncios são restritos a elas antes de
// agregar por adName.
function carrinhoAdRows(start,end,selectedCamps){
  const hasSel=selectedCamps&&selectedCamps.size>0;
  let rows=carrinhoMetaRowsInRange(start,end);
  if(hasSel)rows=rows.filter(r=>selectedCamps.has(r.campName||"(sem campanha)"));
  const byAd={};
  for(const r of rows){
    const key=r.adName||"(sem nome)";
    if(!byAd[key])byAd[key]={adName:key,campName:r.campName,igUrl:r.igUrl||"",spend:0,clicks:0,impressions:0};
    const a=byAd[key];
    a.spend+=r.spend;a.clicks+=r.clicks;a.impressions+=r.impressions;
    if(!a.igUrl&&r.igUrl)a.igUrl=r.igUrl;
  }
  const fichasByAd={},fichasComPrecoByAd={};
  for(const f of S.carrinhoFichaAttrib){
    if(f.date<start||f.date>end)continue;
    fichasByAd[f.adName]=(fichasByAd[f.adName]||0)+1;
    if(f.comPreco)fichasComPrecoByAd[f.adName]=(fichasComPrecoByAd[f.adName]||0)+1;
  }
  const vendasByAd={};
  for(const v of S.carrinhoVendaAttrib){
    if(v.date<start||v.date>end)continue;
    vendasByAd[v.adName]=(vendasByAd[v.adName]||0)+1;
  }
  return Object.values(byAd).map(a=>{
    const fichas=fichasByAd[a.adName]||0, fichasComPreco=fichasComPrecoByAd[a.adName]||0;
    const vendas=vendasByAd[a.adName]||0;
    return{...a,
      cpc:a.clicks>0?a.spend/a.clicks:null,
      ctr:a.impressions>0?(a.clicks/a.impressions)*100:0,
      fichas,fichasComPreco,vendas,
      convFichaVenda:fichas>0?(vendas/fichas)*100:0,
      custoFichaComPreco:fichasComPreco>0?a.spend/fichasComPreco:null};
  });
}

// Texto copiável do resumo do anúncio — mesmo espírito do adResumoBlock() da
// Captação, mas com os campos que existem no Carrinho (fichas com preço,
// custo/ficha com preço vs meta, vendas/conversão) em vez de faixa/quiz.
function carrinhoAdResumoBlock(a){
  const lines=[];
  lines.push(`Nome do ad ⤵️`);
  lines.push(a.adName);
  lines.push(``);
  if(a.igUrl)lines.push(a.igUrl);
  lines.push(`Investimento:\t${fUSD(a.spend)}`);
  lines.push(`Cliques:\t${a.clicks.toLocaleString("pt-BR")}`);
  lines.push(`CPC:\t${a.cpc!=null?fUSD(a.cpc):"—"}`);
  lines.push(``);
  lines.push(`Fichas:\t${a.fichas}`);
  lines.push(`Fichas com preço:\t${a.fichasComPreco}`);
  lines.push(`Custo/ficha com preço:\t${a.custoFichaComPreco!=null?fUSD(a.custoFichaComPreco):"—"} (meta ${fUSD(META_CARRINHO_CUSTO_FICHA_COM_PRECO)})`);
  lines.push(``);
  lines.push(`Vendas:\t${a.vendas}`);
  lines.push(`Conversão ficha→venda:\t${fPct(a.convFichaVenda)}`);
  lines.push(`__________________________`);
  return lines.join("\n");
}
function copyCarrinhoAdResumo(){
  const el=document.getElementById("page-carrinho-anuncios");
  const text=el?._carrinhoAdResumoText||"";if(!text)return;

// Linha label/valor/meta+emoji — mesmo padrão visual do Resumo diário.
function stageRow(lbl,val,metaStr,emoji){
  return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
    <span style="color:var(--muted);font-size:12px">${lbl}</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-strong)">${val}</span>
    <span style="font-size:14px;min-width:90px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaStr||""}</span></span>
  </div>`;
}
// Linha de input manual (Alcance ou Likes) — mesmo padrão do campo de
// investimento manual do Resumo diário, com id próprio pra restaurar o foco
// depois do re-render (senão o cursor pula pro início a cada tecla digitada).
function stageManualRow(inputId,lbl,value,setterCall,metaStr,emoji){
  return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
    <span style="color:var(--muted);font-size:12px">${lbl}</span>
    <input id="${inputId}" value="${value||''}" placeholder="inserir manualmente" inputmode="numeric"
      oninput="${setterCall}"
      onkeydown="if(event.key==='Enter')this.blur()"
      style="font-family:'JetBrains Mono',monospace;font-size:13px;color:${value?'#fbbf24':'var(--text-strong)'};background:transparent;border:none;border-bottom:1px solid ${value?'rgba(251,191,36,.4)':'rgba(255,255,255,.15)'};outline:none;padding:2px 0;width:100%"/>
    <span style="font-size:14px;min-width:90px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaStr||""}</span></span>
  </div>`;
}
function restoreStageFocus(fid){
  if(!fid)return;
  requestAnimationFrame(()=>{
    const s=document.getElementById(fid);
    if(s){s.focus();const l=s.value.length;s.setSelectionRange(l,l);}
  });
}
// Tabela de likes × benchmark (fator X × leads ao vivo) — usada no Lembrete
// (checkpoint diário das 12:00) e em cada Aula (checkpoint de hora em hora).
// rows: [{label, likes, fatorX, meta}]. Vem da planilha "Contagem likes";
// sem registro ainda pra aquele checkpoint = linha some (não mostra zero).
function likesBenchmarkTableHtml(rows,colLabel){
  if(!rows.length)return `<div style="font-size:11px;color:var(--hint);padding:4px 0 8px">Sem registros ainda na aba "Contagem likes" pra esse checkpoint.</div>`;
  return `<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px">
    <thead><tr style="color:var(--hint)">
      <th style="text-align:left;padding:4px 8px 4px 0;font-weight:600">${colLabel}</th>
      <th style="text-align:right;padding:4px 8px;font-weight:600">Likes</th>
      <th style="text-align:right;padding:4px 8px;font-weight:600">Meta (fator X × leads)</th>
      <th style="text-align:right;padding:4px 0;font-weight:600">Farol</th>
    </tr></thead>
    <tbody>
      ${rows.map(r=>`<tr style="border-top:1px solid rgba(255,255,255,.04)">
        <td style="padding:4px 8px 4px 0;color:var(--text)">${r.label}</td>
        <td class="mono" style="text-align:right;padding:4px 8px;color:var(--text-strong)">${r.likes.toLocaleString("pt-BR")}</td>
        <td class="mono" style="text-align:right;padding:4px 8px;color:var(--muted)">${r.meta!=null?Math.round(r.meta).toLocaleString("pt-BR"):"—"}${r.fatorX!=null?` <span style="color:var(--hint)">(${String(r.fatorX).replace(".",",")}%)</span>`:""}</td>
        <td style="text-align:right;padding:4px 0">${r.meta!=null?metaEmojiGlobal(r.likes,r.meta,true):"⚪"}</td>
      </tr>`).join("")}
    </tbody>
  </table>`;
}
function likesBenchmarkTableText(rows,colLabel){
  if(!rows.length)return `${colLabel}: sem registros ainda na aba "Contagem likes".`;
  return rows.map(r=>`${r.label}:\t${r.likes.toLocaleString("pt-BR")}\t${r.meta!=null?metaEmojiGlobal(r.likes,r.meta,true):"⚪"} (🎯 fator X ${r.fatorX!=null?String(r.fatorX).replace(".",","):"—"}% × leads: ${r.meta!=null?Math.round(r.meta).toLocaleString("pt-BR"):"—"})`).join("\n");
}

// Soma do planejamento de uma etapa até hoje (inclusive) — usado nos
// resumos pra mostrar "(planej até hoje: R$ x)" ao lado do realizado.
function planoAcumAteHoje(plano){
  if(!plano||!plano.length)return null;
  const hoje=todayISO();
  return plano.filter(x=>x.date<=hoje).reduce((a,x)=>a+x.investimento,0);
}

// Copia o resumo de UMA etapa por vez (independente do botão da Captação e
// dos outros dois) — o feedback "✓ Copiado!" aparece só no botão clicado.
// ── Resumo do Carrinho (aba Resumo diário) ───────────────────────────────
// Três blocos, igual ao Resumo consolidado da Captação: Total (lançamento
// inteiro), Ontem e Hoje. Só fichas de TRÁFEGO entram nos custos — orgânico
// fica restrito à sub-aba Fichas.
// Metas: custo/ficha COM PREÇO tem meta (META_CARRINHO_CUSTO_FICHA_COM_PRECO);
// custo/ficha TOTAL fica sem meta, por decisão do usuário.
function carrinhoBloco(s,e){ return carrinhoMetrics(s===null?"0000-01-01":s, e===null?"9999-12-31":e); }
function carrinhoResumoHtml(){
  const hoje=todayISO(), ontem=yesterdayISO();
  const blocos=[["📶 Total - Consolidado",carrinhoBloco(null,null),""],
                ["⬅️ Ontem",carrinhoBloco(ontem,ontem),fDateBR(ontem)],
                ["⬇️ Hoje",carrinhoBloco(hoje,hoje),fDateBR(hoje)]];
  return blocos.map(([t,m,d])=>stageResumoCard(`${t}${d?" — "+d:""}`,
      stageRow("Investimento",fUSD(m.spend),"","")+
      stageRow("Fichas com preço",m.fichasComPreco.toLocaleString("pt-BR"),"","")+
      stageRow("Custo/ficha com preço",m.custoFichaComPreco!=null?fUSD(m.custoFichaComPreco):"--",`Meta: ${fUSD(META_CARRINHO_CUSTO_FICHA_COM_PRECO)}`,metaEmojiGlobal(m.custoFichaComPreco,META_CARRINHO_CUSTO_FICHA_COM_PRECO,false))+
      stageRow("Fichas totais",m.fichasTotal.toLocaleString("pt-BR"),"","")+
      stageRow("Custo/ficha total",m.custoFicha!=null?fUSD(m.custoFicha):"--","sem meta definida","")+
      stageRow("CPC",m.cpc!=null?fUSD(m.cpc):fUSD(0),"","")+
      stageRow("CTR",m.ctr!=null?fPct(m.ctr):fPct(0),"","")+
      stageRow("CPM",m.cpm!=null?fUSD(m.cpm):fUSD(0),"","")+

// ── Análise completa por etapa (Aquecimento/Lembrete/Aula01/02/03) ─────────
// KPIs + gráfico "Acumulado por dia" (toggle CPC/Tx75%/Cptx75%) + gráfico "%
// do investimento por dia" + tabela de anúncios sortável/buscável — mesmo
// padrão de completude da referência ("oro_jul26 | Mini Debriefing"), com
// nossos dados reais de cada etapa.
function stageMetricCfg(metas){
  metas=metas||{};
  return {
    cpc:   {key:"cpc",   label:"CPC",             color:CHART_GAP, meta:metas.cpc?metas.cpc.val:null,       fmt:fUSD},
    tx75:  {key:"tx75",  label:"Tx 75%",          color:CHART_LEAD,meta:metas.tx75?metas.tx75.val:null,      fmt:v=>fPct(v)},
    cptx75:{key:"cptx75",label:"Custo por Tx 75%",color:CHART_INV, meta:metas.cptx75?metas.cptx75.val:null, fmt:fUSD},
  };
}
// Agrega as linhas de anúncio de uma etapa por DIA (pro gráfico de tendência
// e pro gráfico de % de investimento).
function stageDailyAgg(rows){
  const byDate={};
  for(const r of rows){
    if(!byDate[r.date])byDate[r.date]={date:r.date,spend:0,clicks:0,impressions:0,video75:0,view3s:0};
    const d=byDate[r.date];
    d.spend+=r.spend;d.clicks+=r.clicks;d.impressions+=r.impressions;d.video75+=r.video75;d.view3s+=(r.view3s||0);
  }
  return Object.keys(byDate).sort().map(k=>{
    const d=byDate[k];
    return{...d,label:fDate(d.date),
      cpc:d.clicks>0?d.spend/d.clicks:null,
      tx75:d.impressions>0?(d.video75/d.impressions)*100:null,
      cptx75:d.video75>0?d.spend/d.video75:null};
  });
}
// Agrega as linhas de anúncio de uma etapa por ANÚNCIO (pro Anúncio/Investido/
// Cliques/CPC/Impressões/75% Assistido/Views 3s/Tx75%/Cptx75%/Ver da tabela).
function stageAdAgg(rows){
  const byAd={};
  for(const r of rows){
    const key=r.adName||"(sem nome)";
    if(!byAd[key])byAd[key]={adName:key,igUrl:r.igUrl||"",spend:0,clicks:0,impressions:0,video75:0,view3s:0};
    const a=byAd[key];
    a.spend+=r.spend;a.clicks+=r.clicks;a.impressions+=r.impressions;a.video75+=r.video75;a.view3s+=(r.view3s||0);
    if(!a.igUrl&&r.igUrl)a.igUrl=r.igUrl;
  }
  return Object.values(byAd).map(a=>({...a,
    cpc:a.clicks>0?a.spend/a.clicks:null,
    tx75:a.impressions>0?(a.video75/a.impressions)*100:null,
    cptx75:a.video75>0?a.spend/a.video75:null}));
}
function setStageChartMetric(scope,metric){S.stageChartMetric[scope]=metric;render();}
function setStageAdSearch(scope,v){S.stageAdSearch[scope]=v;render();}
function sortStageAds(scope,col){
  const s=S.stageAdSort[scope];
  if(s.col===col)s.dir=s.dir==="asc"?"desc":"asc";else{s.col=col;s.dir="desc";}
  render();
}
// KPI card com input embutido (pro Alcance manual) — mesmo visual do kpiCard,
// mas o valor é um campo editável em vez de texto estático.
function kpiCardManual(lbl,inputId,value,setterCall,sub){
  return `<div class="kc">
    <div class="kc-lbl">${lbl}</div>
    <input id="${inputId}" value="${value||""}" placeholder="inserir" inputmode="numeric"
      oninput="${setterCall}"
      onkeydown="if(event.key==='Enter')this.blur()"
      style="width:100%;background:transparent;border:none;border-bottom:1px solid ${value?"rgba(251,191,36,.4)":"rgba(255,255,255,.15)"};outline:none;padding:2px 0;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;letter-spacing:-.02em;color:${value?"#fbbf24":"var(--text-strong)"}"/>
    ${sub?`<div class="kc-sub">${sub}</div>`:""}
  </div>`;
}
// HTML completo da análise de uma etapa (usado direto nas abas Aquecimento/
// Lembrete, e 3x dentro da aba Aulas — uma vez por aula). "scope" identifica
// o estado independente (toggle de gráfico, busca e ordenação da tabela) e
// os ids dos canvases; "alcanceKey" é a chave em S.manualAlcance.
function stageAnalysisHtml(scope,rows,metas,alcanceKey){
  metas=metas||{};
  const m=stageMetrics(rows);
  const alcance=S.manualAlcance[alcanceKey];
  const freq=alcance>0?m.impressions/alcance:null;
  const cfg=stageMetricCfg(metas);
  const chartMetric=S.stageChartMetric[scope]||"cpc";
  const mc=cfg[chartMetric]||cfg.cpc;

  const adsAll=stageAdAgg(rows);
  const q=(S.stageAdSearch[scope]||"").trim().toLowerCase();
  const adsF=q?adsAll.filter(a=>a.adName.toLowerCase().includes(q)):adsAll;
  const {col,dir}=S.stageAdSort[scope];
  const adsSorted=[...adsF].sort((a,b)=>{
    const av=a[col],bv=b[col];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });
  function thS(colKey,lbl){
    const active=col===colKey;
    const arrow=active?(dir==="asc"?" ↑":" ↓"):" ↕";
    return `<th onclick="MDI.sortStageAds('${scope}','${colKey}')" style="text-align:right;cursor:pointer">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};margin-left:3px">${arrow}</span></th>`;
  }
  const trendCid="c-trend-"+scope, pctCid="c-pct-"+scope, trendTid="t-trend-"+scope;

  return `
    <div class="g4" style="margin-bottom:13px">
      ${kpiCard("Investido total",fUSD(m.spend),"","var(--text-strong)")}
      ${kpiCard("Cliques",m.clicks.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("CPC",m.cpc!=null?fUSD(m.cpc):"—",metas.cpc?`Meta: ${fUSD(metas.cpc.val)}`:"sem meta",metas.cpc&&m.cpc!=null?statusColor(m.cpc,metas.cpc.val,metas.cpc.higher):"var(--text-strong)",false,m.cpc,metas.cpc?metas.cpc.val:null,metas.cpc?metas.cpc.higher:null)}
      ${kpiCardManual("Alcance (manual 🔧)",`manual-alcance-${scope}`,alcance,`MDI.setManualAlcance('${alcanceKey}',this.value)`,"API não fornece este dado")}
    </div>
    <div class="g3" style="margin-bottom:20px">
      ${kpiCard("Frequência",freq!=null?freq.toFixed(2).replace(".",","):"—",metas.frequencia?`Meta: ${metas.frequencia.val}`:"sem meta","var(--text-strong)",false,freq,metas.frequencia?metas.frequencia.val:null,metas.frequencia?metas.frequencia.higher:null)}
      ${kpiCard("Tx 75%",m.tx75!=null?fPct(m.tx75):"—",metas.tx75?`Meta: ${metas.tx75.val}%`:"sem meta","var(--text-strong)",false,m.tx75,metas.tx75?metas.tx75.val:null,metas.tx75?metas.tx75.higher:null)}
      ${kpiCard("Custo por Tx 75%",m.cptx75!=null?fUSD(m.cptx75):"—",metas.cptx75?`Meta: ${fUSD(metas.cptx75.val)}`:"sem meta","var(--text-strong)",false,m.cptx75,metas.cptx75?metas.cptx75.val:null,metas.cptx75?metas.cptx75.higher:null)}
    </div>

    <div class="cc" style="position:relative;margin-bottom:14px">
      <div class="ch">
        <span class="ct">Acumulado por dia</span>
        <div class="presets">
          ${["cpc","tx75","cptx75"].map(k=>`<button class="btn-pre${chartMetric===k?" on":""}" onclick="MDI.setStageChartMetric('${scope}','${k}')">${cfg[k].label}</button>`).join("")}
        </div>
      </div>
      <div style="position:relative"><canvas id="${trendCid}"></canvas><div class="tip" id="${trendTid}"></div></div>
    </div>

    <div class="cc" style="position:relative;margin-bottom:20px">
      <div class="ch"><span class="ct">% do investimento por dia</span></div>
      <div style="position:relative"><canvas id="${pctCid}"></canvas></div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin-bottom:0;margin-top:0">Anúncios</div>
      <span style="font-size:10px;color:var(--hint)">${adsSorted.length} anúncio(s)</span>
    </div>
    <div style="position:relative;margin-bottom:10px">
      <input oninput="MDI.setStageAdSearch('${scope}',this.value)" value="${S.stageAdSearch[scope]||""}" placeholder="Buscar anúncio…" style="width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box"/>
    </div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:6px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th onclick="MDI.sortStageAds('${scope}','adName')" style="cursor:pointer">Anúncio</th>
          ${thS("spend","Investido")}
          ${thS("clicks","Cliques")}
          ${thS("cpc","CPC")}
          ${thS("impressions","Impressões")}
          ${thS("video75","75% Assistido")}
          ${thS("view3s","Views 3s")}
          ${thS("tx75","Tx75%")}
          ${thS("cptx75","Cptx75%")}
          <th>Ver</th>
        </tr></thead>
        <tbody>
          ${adsSorted.length===0?`<tr><td colspan="10" style="text-align:center;color:var(--hint);padding:20px">Sem dados de anúncios no período</td></tr>`:
          adsSorted.map(a=>`<tr>
            <td>${a.adName}</td>
            <td class="mono" style="text-align:right">${fUSD(a.spend)}</td>
            <td class="mono" style="text-align:right">${a.clicks.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.cpc!=null?fUSD(a.cpc):"—"}</td>
            <td class="mono" style="text-align:right">${a.impressions.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.video75.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.view3s.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.tx75!=null?fPct(a.tx75):"—"}</td>
            <td class="mono" style="text-align:right">${a.cptx75!=null?fUSD(a.cptx75):"—"}</td>
            <td>${a.igUrl?`<a href="${a.igUrl}" target="_blank" rel="noopener" style="color:#60a5fa">Ver ↗</a>`:"—"}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      </div>
    </div>`;
}
// Desenha os 2 gráficos de uma etapa depois que o HTML de stageAnalysisHtml
// já está no DOM (precisa dos canvases existirem pra medir largura).
// "chartStyle" controla o gráfico "Acumulado por dia": "line" (padrão, pra
// etapas com vários dias de histórico) ou "bar" (pra etapas que rodam num
// período muito curto — ex.: Aulas, 1 dia cada — onde uma linha não mostra
// nada de útil).
function mountStageCharts(scope,rows,metas,chartStyle){
  const daily=stageDailyAgg(rows);
  const totalSpend=rows.reduce((a,r)=>a+r.spend,0);
  const cfg=stageMetricCfg(metas);
  const mc=cfg[S.stageChartMetric[scope]||"cpc"]||cfg.cpc;
  const trendCid="c-trend-"+scope, pctCid="c-pct-"+scope, trendTid="t-trend-"+scope;
  const box1=document.getElementById(trendCid)?.parentElement;
  if(box1){
    if(chartStyle==="bar")drawMetricBar(trendCid,daily,mc.key,mc.color,mc.meta,box1.clientWidth,200,mc.fmt);
    else drawMetricLine(trendCid,daily,mc.key,mc.color,mc.meta,box1.clientWidth,200,mc.fmt);
  }
  setupTip(trendCid,trendTid,daily,[{name:mc.label,color:mc.color,key:mc.key,fmt:mc.fmt}],52,12);
  const box2=document.getElementById(pctCid)?.parentElement;
  if(box2)drawBarPercent(pctCid,daily,"spend",totalSpend,CHART_INV,box2.clientWidth,180);
}

// Resumo por etapa (Captação, Aquecimento, Lembrete, Aulas, Carrinho) +
// detalhe diário completo da Captação (única etapa com meta de leads também).
// Emoji apontando pra linha de hoje nas tabelas de Planejado/Realizado — sutil,
// sem badge/borda, só o 👈 ao lado da data.
function hojeBadge(isToday){
  return isToday?` 👈`:"";
}
// Menor e maior data entre TODAS as etapas do plano (Captação ∪ Aquecimento ∪
// Lembrete ∪ Aulas ∪ Grupo VIP ∪ Carrinho) — usado pra avisar quando "hoje" cai antes do
// lançamento começar ou depois dele acabar (não tem linha "HOJE" pra mostrar
// nesses casos, então o aviso substitui o apontador).
function planoDateRange(){
  const allDates=[...PLANO_DIARIO,...PLANO_AQUECIMENTO,...PLANO_LEMBRETE,...PLANO_AULAS,...PLANO_GRUPO_VIP,...PLANO_CARRINHO].map(p=>p.date);
  if(!allDates.length)return null;
  return{min:allDates.reduce((a,d)=>d<a?d:a),max:allDates.reduce((a,d)=>d>a?d:a)};
}
function renderPlanoReal(){
  const el=document.getElementById("page-planoreal");if(!el)return;
  const today=todayISO();
  const plano=PLANO_DIARIO;
  const range=planoDateRange();
  const diffDays=(a,b)=>Math.round((Date.parse(a+"T00:00:00Z")-Date.parse(b+"T00:00:00Z"))/86400000);
  let hojeNotice=null;
  if(range){
    if(today<range.min)hojeNotice=`📅 Faltam ${diffDays(range.min,today)} dia(s) pro início do plano (${fDateBR(range.min)}) — nenhuma linha "HOJE" ainda.`;
    else if(today>range.max)hojeNotice=`📅 Plano encerrado há ${diffDays(today,range.max)} dia(s) (terminou em ${fDateBR(range.max)}) — sem linha "HOJE" pra mostrar.`;
  }

  const rows=plano.map(p=>{
    const isFuture=p.date>today;
    const investReal=isFuture?null:stageSpendForDate("Captação",p.date);
    const leadsReal=isFuture?null:(S.leadsByDate[p.date]||0);
    return{...p,isFuture,isToday:p.date===today,investReal,leadsReal};
  });

  // assim uma campanha de Captação rodando na mesma data não conta como

            <td class="mono" style="text-align:right;font-weight:700">${fUSD(stageRealTotal)}</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>`;
  }

  el.innerHTML=`

        <div class="hdr-sub">lançamento completo · atualizado em: ${S.updated||"—"}</div>

// Fecha o dropdown do seletor de funil ao clicar fora dele.
// IMPORTANTE: usa e.composedPath() em vez de e.target.closest(...). O clique
// no próprio botão do seletor dispara render(), que reconstrói o HTML de
// dentro de #funil-wrap (inclusive o botão clicado) ANTES desse clique
// terminar de borbulhar até aqui — nesse ponto e.target já está desconectado
// do DOM e e.target.closest(...) sempre retorna null, fechando o dropdown na
// mesma hora que ele abre. composedPath() é calculado no início do disparo
// do evento (antes da re-renderização), então continua válido mesmo depois
// do DOM mudar por baixo.
document.addEventListener("click",(e)=>{
  if(!S.funilDropdownOpen)return;
  const wrap=document.getElementById("funil-wrap");
  const path=typeof e.composedPath==="function"?e.composedPath():[];
  if(wrap&&path.includes(wrap))return;
  S.funilDropdownOpen=false;
  renderHeader();
});

  const ac=document.querySelector(".app-content");

// ── Date helpers (GMT-6 México) ─────────────────────────────────────────────
function nowSP(){ return new Date(Date.now()-3*60*60*1000); }
function toISODate(d){ return d.toISOString().split("T")[0]; }
function todayISO(){ return toISODate(nowSP()); }
function yesterdayISO(){ const d=nowSP();d.setDate(d.getDate()-1);return toISODate(d); }
function nDaysAgoISO(n){ const d=nowSP();d.setDate(d.getDate()-n);return toISODate(d); }
function firstOfMonthISO(){ const d=nowSP();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00Z");d.setDate(d.getDate()+n);return toISODate(d); }
function subDays(iso,n){ return addDays(iso,-n); }

// ── Format helpers ─────────────────────────────────────────────────────────
function parseBRL(s){ if(!s||s==="-"||s==="0")return 0;return parseFloat(String(s).replace(/R\$\s*/g,"").replace(/\./g,"").replace(",",".").trim())||0; }
function parseBRLAbs(s){ return Math.abs(parseBRL(s)); }
function parseUSD(s){ if(!s||s==="-"||s==="0")return 0;return parseFloat(String(s).replace(/[$\s,]/g,"").trim())||0; }
// Converte gasto de anúncio (campo "Spend") para USD a partir do nome da conta.
// Prioridade: novo formato "(MXN)"/"(USD)" no nome → legado por nome exato → default MXN
function metaSpendToUSD(rawSpend, accountName){
  const acc=(accountName||"").toUpperCase();
  if(acc.includes("(MXN)")) return rawSpend/18;
  if(acc.includes("(USD)")) return rawSpend;
  // Nomes legados — manter comportamento anterior
  if(acc==="CONTA 2 CARTÃO"||acc==="CONTA 2") return rawSpend/18;  // MXN
  if(acc==="CA03"||acc==="CA 03"||acc==="CA04"||acc==="CA 04") return rawSpend; // USD
  if(acc==="CONTA G") return rawSpend; // USD
  return rawSpend/18; // default: MXN
}

// Fallback: infere price tier pelo valor da compra quando não há UTM
// Recebe valor já convertido para USD (hotmartPriceUSD):
//   ~5 USD  = 79 MXN  → 85pesos
//   ~14 USD = 204 MXN → 220pesos
//   ~16 USD = 234 MXN → 220pesos
//   <1 USD              → teste, ignorar
function inferPriceTierFromValue(valUSD){
  const v=parseFloat(String(valUSD||"0").replace(",","."))||0;
  if(v<1) return null; // transação de teste (ex: 1 BRL ≈ 0.2 USD)

function extractCountryFromAdset(adsetName){
  if(!adsetName) return "México";
  // Padrão ca{N}-{word}-{country}, captura o último segmento após o segundo "-"
  const m=adsetName.match(/^ca\d+-.+-([a-z_]+)$/i);

// Extrai Ad ID numérico de 15-20 dígitos de uma string que pode ser:
// "120247448870650228" ou "manual_defin-venda-adv289|120247448870650228::..."
function extractAdId(raw){
  if(!raw) return null;
  // já é um número puro
  if(/^\d{15,20}$/.test(raw.trim())) return raw.trim();
  // busca sequência de 15-20 dígitos
  const m=raw.match(/\d{15,20}/);

}


// ── Hotmart helpers ─────────────────────────────────────────────────────────
// Converte timestamp (ms) ou "dd/mm/yyyy HH:MM:SS" para YYYY-MM-DD (GMT-6 México)
function tsToISO(ts){
  if(!ts||ts==="0") return null;
  // Formato textual: dd/mm/yyyy HH:MM:SS ou dd/mm/yyyy
  const txtMatch=String(ts).match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+\d{2}:\d{2}:\d{2})?$/);
  if(txtMatch){
    const [,dd,mm,yyyy]=txtMatch;
    return `${yyyy}-${mm}-${dd}`;
  }
  // Timestamp em milissegundos
  const n=parseInt(ts);
  if(!n||isNaN(n)) return null;
  const d=new Date(n-3*60*60*1000);
  return d.toISOString().split("T")[0];
}

// Extrai Ad ID de 15-20 dígitos do xcod da Hotmart
// Formato: [prefix]hQwK21wXxR[campaign|id]hQwK21wXxR[adset|id]hQwK21wXxR[adName|adId]hQwK21wXxR[placement]
function extractXcodMeta(xcod){
  const SEP="hQwK21wXxR";
  if(!xcod||!xcod.startsWith("FB")) return {platform:"",placement:""};
  const parts=xcod.slice(2).split(SEP);
  if(parts.length<2) return {platform:"",placement:""};
  const placement=parts[parts.length-1]||"";
  const p=placement.toLowerCase();
  let platform="";
  if(p.includes("instagram")) platform="instagram";
  else if(p.includes("facebook")) platform="facebook";
  else if(p.includes("messenger")) platform="messenger";
  else if(p.includes("audience")) platform="audience_network";
  else if(p.includes("thread")) platform="threads";
  else if(placement&&!placement.includes("{{")) platform=placement;
  return {platform,placement};
}
function extractAdIdFromXcod(xcod){
  if(!xcod) return null;
  const SEP="hQwK21wXxR";
  const parts=xcod.split(SEP);
  if(parts.length>=4){
    const adPart=parts[3];
    const pipe=adPart.lastIndexOf("|");
    if(pipe>=0){
      const candidate=adPart.slice(pipe+1).trim();
      if(/^\d{15,20}$/.test(candidate)) return candidate;
    }
  }
  return extractAdId(xcod);
}

function normalizeHotmartStatus(s){
