  } else {
    const stOrder=["Paga","Aberta","Em Recuperacao","Aguardando Reembolso","Reembolsado","Expirado"];
    const stC={"Paga":"var(--green)","Reembolsado":"var(--red)","Aguardando Reembolso":"var(--red)","Em Recuperacao":"var(--amber)","Aberta":"var(--amber)"};
    const allSts=[...new Set(Object.keys(statusCounts))].sort((a,b)=>(stOrder.indexOf(a)+99)%100-(stOrder.indexOf(b)+99)%100);
    anaContent=`<table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="color:var(--hint);font-size:10px;text-transform:uppercase;letter-spacing:.08em">
        <th style="text-align:left;padding:7px 10px;font-weight:700">Status</th>
        <th style="text-align:center;padding:7px 10px;font-weight:700">Qtd</th>
        <th style="text-align:right;padding:7px 10px;font-weight:700">Valor</th>
        <th style="text-align:right;padding:7px 10px;font-weight:700">% fat.</th>
      </tr></thead><tbody>
      ${allSts.map(st=>{
        const q=statusCounts[st]||0,v=statusVals[st]||0,p=totalFat>0?(v/totalFat*100):0;
        return `<tr style="border-top:1px solid var(--border)">
          <td style="padding:8px 10px;color:${stC[st]||"var(--text)"};font-weight:600">${st||"—"}</td>
          <td style="padding:8px 10px;text-align:center;color:var(--text);font-family:'JetBrains Mono',monospace">${q}</td>
          <td style="padding:8px 10px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${fBRL(v)}</td>
          <td style="padding:8px 10px;text-align:right;color:var(--muted)">${p.toFixed(1)}%</td>
        </tr>`;
      }).join("")}
      </tbody></table>`;
  }

  // KPI cards de contagem — um por step
  const kpiCountCards=svgSteps.map((s,i)=>{
    const col=i===0?"var(--text)":upsellColors[i-1];
    const pct=i===0?"":i===1?`${pct1.toFixed(1)}% do ${s0.label.split(" ")[0]}`:i===2?`${pct2.toFixed(1)}% do ${s1?.label.split(" ")[0]||""}`:"";;
    return `<div class="kc"><div class="kc-lbl">Compradores ${s.label}</div><div class="kc-val" style="color:${col}">${s.count}</div><div class="kc-sub">${pct}</div></div>`;
  }).join("");

  // Tickets — um por step
  const ticketCards=svgSteps.map(s=>`<div class="kc"><div class="kc-lbl">Ticket ${s.label.split(" ")[0]}</div><div class="kc-val kc-val-sm">${fBRL(s.count>0?(fat[s.id]||0)/s.count:0)}</div></div>`).join("");

  const gridCols=2+steps.length;

  el.innerHTML=`
    <div class="hdr">
      <div>
        <div class="hdr-title">Métricas do Funil</div>
        <div class="hdr-sub">base: ${cnt0} compradores do ${s0.label} · atualizado em: ${_dd.updated||"—"}</div>
      </div>
    </div>
    ${retoTempFilterBar()}

    <div class="g4" style="margin-bottom:14px">
      <div class="kc"><div class="kc-lbl">Investimento</div><div class="kc-val kc-val-sm">${fBRL(totalSpend)}</div><div class="kc-sub">Meta Ads</div></div>
      <div class="kc"><div class="kc-lbl">Faturamento total</div><div class="kc-val kc-val-sm">${fBRL(totalFat)}</div><div class="kc-sub">${steps.map(s=>s.label.split(" ")[0]).join(" + ")}</div></div>
      <div class="kc"><div class="kc-lbl">ROAS funil</div><div class="kc-val kc-val-sm" style="color:${roasC}">${roas.toFixed(2)}x</div></div>
      <div class="kc"><div class="kc-lbl">Lucro bruto</div><div class="kc-val kc-val-sm" style="color:${lucroC}">${fBRL(lucro)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(${gridCols},1fr);gap:10px;margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">LTV médio</div><div class="kc-val kc-val-sm">${fBRL(ltv)}</div><div class="kc-sub">por comprador ${s0.label.split(" ")[0]}</div></div>
      ${s1?`<div class="kc"><div class="kc-lbl">Take rate ${s1.label.split(" ")[0]}</div><div class="kc-val kc-val-sm">${taxaAscensao.toFixed(1)}%</div><div class="kc-sub">${cnt1} de ${cnt0} compraram</div></div>`:""}
      ${s2?`<div class="kc"><div class="kc-lbl">Take rate ${s2.label.split(" ")[0]}</div><div class="kc-val kc-val-sm" style="color:#34d399">${(taxaMapa||0).toFixed(1)}%</div><div class="kc-sub">${cnt2} de ${cnt1} compraram</div></div>`:""}
      ${ticketCards}
    </div>

    <div style="display:grid;grid-template-columns:1fr 260px;gap:14px;margin-bottom:20px;align-items:start">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px">
        <div class="section-lbl">Funil de conversão</div>
        <svg viewBox="0 0 ${SW} ${SH}" style="width:100%;max-width:${SW}px;display:block;margin:0 auto">${svgBlocks}</svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${kpiCountCards}
        ${qtdReemb>0?`<div class="kc"><div class="kc-lbl" style="color:var(--red)">Reembolsos</div><div class="kc-val kc-val-sm" style="color:var(--red)">${qtdReemb} · ${fBRLShort(valReemb)}</div><div class="kc-sub">${pctReemb.toFixed(1)}% do fat.</div></div>`:""}
        ${qtdAbrt>0?`<div class="kc"><div class="kc-lbl" style="color:var(--amber)">Em aberto</div><div class="kc-val kc-val-sm" style="color:var(--amber)">${qtdAbrt} · ${fBRLShort(valAbrt)}</div><div class="kc-sub">${pctAbrt.toFixed(1)}% do fat.</div></div>`:""}
      </div>
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px">
      <div style="display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px">
        ${tabs.map(t=>`<button onclick="setAnaTab('${t.k}')" style="font-size:11px;font-weight:600;padding:5px 13px;border-radius:8px;border:1px solid ${S.aTab===t.k?"rgba(96,165,250,.4)":"var(--border)"};background:${S.aTab===t.k?"rgba(59,130,246,.16)":"transparent"};color:${S.aTab===t.k?"#93c5fd":"var(--muted)"};cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">${t.l}</button>`).join("")}
      </div>
      ${anaContent}
    </div>
    <p style="font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace">${s0.label} · Base Vendas (Hotmart) + Base Meta (Meta Ads via Stract)</p>`;
}

// ── Render Resumo Diário ───────────────────────────────────────────────────
function renderResumo(){
  const el=document.getElementById("page-resumo");if(!el)return;
  const isFeo=S.currentFunil==="feo";
  const funilTitle=isFeo?"Planilla Finanzas en Orden":"Finanzas - Reto 14 Dias";
  const _resumoFocus=document.activeElement?.id;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  // Agrega métricas para um período
  function periodMetrics(s,e){
    const daily=getDailyT(s,e);
    const t=getTotalsT(daily);
    // faturamento (receita) do período — usa getVendasActive() para respeitar filtros de temp/preço
    const vA=getVendasActive();
    let valor=0;
    for(const d of Object.keys(vA).filter(d=>d>=s&&d<=e)) valor+=(vA[d]?.valor||0);
    t.valor=valor;
    t.roas=t.spend>0?valor/t.spend:0;
    t.cpv=t.vendas>0?t.spend/t.vendas:0;
    return t;
  }

  const tot  = periodMetrics(start, end);
  const ontem= periodMetrics(yest,  yest);
  const hojeBase = periodMetrics(today, today);
  const hoje = {...hojeBase};
  if(S.manualSpendHoje!==null){
    hoje.spend=S.manualSpendHoje;
    hoje.cpv=hoje.vendas>0?hoje.spend/hoje.vendas:0;
    hoje.roas=hoje.spend>0?hoje.valor/hoje.spend:0;
  }

  // Emoji de status
  function em(val, meta, higher){
    if(!meta||val===0) return "";
    const ratio=higher ? val/meta : meta/val;
    if(ratio>=1)   return "🟢";
    if(ratio>=0.85) return "🟡";
    return "🔴";
  }

  // Formata data "dd/mm"
  function fDM(iso){ if(!iso) return "—"; const [,m,d]=iso.split("-"); return `${d}/${m}`; }

  // Label do período filtrado
  const dateLabel= start===end ? fDM(start) : `${fDM(start)} a ${fDM(end)}`;

  // Bloco de texto formatado para copiar (WhatsApp markdown)
  function block(label, m, isTotal){
    const _bCpvM=isFeo?getFeoMetaCPV():META_CPV;
    const cpvE  =em(m.cpv,      _bCpvM,                     false);
    const roasE =em(m.roas,     isFeo?null:META_ROAS,        true);
    const pcE   =em(m.txPagChk, isFeo?null:METAS_T.txPagChk.val, true);
    const cvE   =em(m.txChkVnd, isFeo?null:METAS_T.txChkVnd.val, true);
    const cnE   =em(m.connect,  isFeo?null:METAS_T.connect.val,   true);
    const cpcE  =em(m.cpc,      isFeo?null:METAS_T.cpc.val,       false);
    const ctrE  =em(m.ctr,      isFeo?null:METAS_T.ctr.val,       true);
    const cpmE  =em(m.cpm,      isFeo?null:METAS_T.cpm.val,       false);
    const vLabel=isTotal?"Vendas Mensal":"Vendas";
    const cpvLabel=isTotal?"Custo por venda Mensal":"Custo por venda";
    const cpvMeta=_bCpvM?` ${cpvE} $${_bCpvM}`:`  `;
    const pcMeta =isFeo?"":` ${pcE} ${METAS_T.txPagChk.val}%`;
    const cvMeta =isFeo?"":` ${cvE} ${METAS_T.txChkVnd.val}%`;
    const cnMeta =isFeo?"":` ${cnE} ${METAS_T.connect.val}%`;
    const cpcMeta=isFeo?"":` ${cpcE} $${METAS_T.cpc.val}`;
    const ctrMeta=isFeo?"":` ${ctrE} ${METAS_T.ctr.val}%`;
    const cpmMeta=isFeo?"":` ${cpmE} $${METAS_T.cpm.val}`;
    return (
`*-> ${label}*
Investimento:\t${fBRL(m.spend)}\t
${vLabel}:\t${m.vendas}\t
${cpvLabel}:\t${fBRL(m.cpv)}${cpvMeta}
ROAS:\t${m.roas.toFixed(2)}\t

Tx conv PgV-Checkout:\t${m.txPagChk.toFixed(1)}%${pcMeta}
Tx conv Checkout-Vendas:\t${m.txChkVnd.toFixed(1)}%${cvMeta}
Connect Rate:\t${m.connect.toFixed(2)}%${cnMeta}

CPC:\t${fBRL(m.cpc)}${cpcMeta}
CTR:\t${m.ctr.toFixed(2)}%${ctrMeta}
CPM:\t${fBRL(m.cpm)}${cpmMeta}`
    );
  }

  const _feoPrice=isFeo&&S.feoPriceFilter!=="todos"?" "+S.feoPriceFilter.replace("pesos"," pesos"):"";
  const _resumoTitle=isFeo?`Finanzas con Proposito - Vendas - FEO${_feoPrice}`:"Finanzas con Proposito - Vendas - Reto";
  const resumoText =
`*${_resumoTitle}*\t\t

_${dateLabel}_\t\t

${block("Total", tot, true)}

${block("Ontem", ontem, false)}

${block("Hoje", hoje, false)}`;

  // ── Visual ────────────────────────────────────────────────────────────────
  function row(lbl, val, metaVal, emoji){
    const hasVal=val!==null&&val!==undefined;
    return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${hasVal?val:"—"}</span>
      <span style="font-size:13px;min-width:28px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaVal||""}</span></span>
    </div>`;
  }

  function section(label, m, isTotal, isHoje=false){
    const _sCpvM=isFeo?getFeoMetaCPV():META_CPV;
    const cpvE  =em(m.cpv,      _sCpvM,                          false);
    const roasE =em(m.roas,     isFeo?null:META_ROAS,            true);
    const pcE   =em(m.txPagChk, isFeo?null:METAS_T.txPagChk.val, true);
    const cvE   =em(m.txChkVnd, isFeo?null:METAS_T.txChkVnd.val, true);
    const cnE   =em(m.connect,  isFeo?null:METAS_T.connect.val,   true);
    const cpcE  =em(m.cpc,      isFeo?null:METAS_T.cpc.val,       false);
    const ctrE  =em(m.ctr,      isFeo?null:METAS_T.ctr.val,       true);
    const cpmE  =em(m.cpm,      isFeo?null:METAS_T.cpm.val,       false);
    const vLabel=isTotal?"Vendas (período)":"Vendas";
    const cpvLabel=isTotal?"Custo por venda":"Custo por venda";
    const isManual=isHoje&&S.manualSpendHoje!==null;
    const spendRow=isHoje?`
      <div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
        <span style="color:var(--muted);font-size:12px">Investimento</span>
        <div style="display:flex;align-items:center;gap:6px">
          <input id="manual-spend-input"
            value="${isManual?String(m.spend.toFixed(2)).replace('.',','):''}"
            placeholder="${fBRL(m.spend)}"
            onblur="setManualSpendHoje(this.value||'0')"
            onkeydown="if(event.key==='Enter')this.blur()"
            style="background:${isManual?'rgba(251,191,36,.08)':'var(--surf)'};border:1px solid ${isManual?'rgba(251,191,36,.5)':'var(--border)'};border-radius:6px;color:${isManual?'#fbbf24':'var(--text-strong)'};font-family:'JetBrains Mono',monospace;font-size:12px;padding:3px 8px;outline:none;width:120px;transition:all .15s"
            onfocus="this.style.borderColor='rgba(96,165,250,.5)'"
            onblur2="this.style.borderColor='${isManual?'rgba(251,191,36,.5)':'var(--border)'}'">
          ${isManual?`<button onclick="clearManualSpend()" title="Restaurar valor do Sheets" style="font-size:10px;padding:2px 7px;border-radius:5px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fbbf24;cursor:pointer;font-family:'DM Sans',sans-serif">↩ Restaurar</button>`:''}
        </div>
        <span style="font-size:13px;min-width:28px;text-align:right">${isManual?'✏️':''}</span>
      </div>`:row("Investimento", fBRL(m.spend), "", "");
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">→ ${label}</div>
      ${spendRow}
      ${row(vLabel, m.vendas, "", "")}
      ${row(cpvLabel, fBRL(m.cpv), _sCpvM?`meta $${_sCpvM}`:"", cpvE)}
      ${row("ROAS", m.roas.toFixed(2), isFeo?"":(`meta ${META_ROAS}x`), roasE)}
      <div style="height:10px"></div>
      ${row("Tx conv PgV-Checkout", m.txPagChk.toFixed(1)+"%", isFeo?"":(`meta ${METAS_T.txPagChk.val}%`), pcE)}
      ${row("Tx conv Checkout-Vendas", m.txChkVnd.toFixed(1)+"%", isFeo?"":(`meta ${METAS_T.txChkVnd.val}%`), cvE)}
      ${row("Connect Rate", m.connect.toFixed(2)+"%", isFeo?"":(`meta ${METAS_T.connect.val}%`), cnE)}
      <div style="height:10px"></div>
      ${row("CPC", fBRL(m.cpc), isFeo?"":(`meta $${METAS_T.cpc.val}`), cpcE)}
      ${row("CTR", m.ctr.toFixed(2)+"%", isFeo?"":(`meta ${METAS_T.ctr.val}%`), ctrE)}
      ${row("CPM", fBRL(m.cpm), isFeo?"":(`meta $${METAS_T.cpm.val}`), cpmE)}
    </div>`;
  }

  // Melhoria 3: variáveis para card de investimento (sem backtick aninhado)
  const _mSpend    = S.manualSpendHoje!==null;
  const _spendVal  = _mSpend ? String(S.manualSpendHoje.toFixed(2)).replace('.',',') : '';
  const _spendPH   = fBRL(hojeBase.spend);
  const _spendBg   = _mSpend ? 'rgba(251,191,36,.08)' : 'var(--surf)';
  const _spendBord = _mSpend ? 'rgba(251,191,36,.5)' : 'var(--border)';
  const _spendCol  = _mSpend ? '#fbbf24' : 'var(--text-strong)';
  const _spendExtra= _mSpend
    ? '<span style="font-size:10px;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:2px 8px;border-radius:5px">&#x270F;&#xFE0F; manual</span>'
      + ' <button onclick="clearManualSpend()" style="font-size:10px;padding:3px 9px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--hint);cursor:pointer">&#x21A9; Restaurar</button>'
    : '<span style="font-size:10px;color:var(--hint)">Edite para substituir o valor do Sheets &middot; Enter para aplicar</span>';

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)} · somente ${funilTitle}</div>
      </div>
      <div>
        <button onclick="copyResumo()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all .15s" onmouseover="this.style.background='rgba(59,130,246,.28)'" onmouseout="this.style.background='rgba(59,130,246,.18)'">
          📋 Copiar resumo
        </button>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    ${retoTempFilterBar()}
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;max-width:560px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <span style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap">Hoje — Investimento</span>
      <input id="manual-spend-input"
        value="${_spendVal}"
        placeholder="${_spendPH}"
        onkeydown="if(event.key==='Enter')this.blur()"
        onblur="setManualSpendHoje(this.value||'0');this.style.borderColor='${_spendBord}'"
        onfocus="this.style.borderColor='rgba(96,165,250,.5)'"
        style="background:${_spendBg};border:1px solid ${_spendBord};border-radius:7px;color:${_spendCol};font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 10px;outline:none;width:130px;transition:all .15s">
      ${_spendExtra}
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:560px">
      <pre id="resumo-preview" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);white-space:pre-wrap;line-height:1.8;margin:0;user-select:all">${resumoText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
    </div>
    <p class="foot">Ontem e Hoje são sempre datas fixas · Total reflete o filtro de datas do header</p>`;

  // Armazena texto para o botão copiar
  el._resumoText=resumoText;
  // Restaura foco no input manual de investimento
  if(document.activeElement?.id==="manual-spend-input"||_resumoFocus==="manual-spend-input"){
    requestAnimationFrame(()=>{
      const inp=document.getElementById("manual-spend-input");
      if(inp){inp.focus();const l=inp.value.length;inp.setSelectionRange(l,l);}
    });
  }
}

function copyResumo(){
  const el=document.getElementById("page-resumo");
  const text=el?._resumoText||"";
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    const btns=document.querySelectorAll("[onclick='copyResumo()']");
    btns.forEach(b=>{const orig=b.innerHTML;b.innerHTML="✓ Copiado!";b.style.color="#4ade80";setTimeout(()=>{b.innerHTML=orig;b.style.color="";},1800);});
  }).catch(()=>{ alert("Não foi possível copiar. Selecione o texto manualmente."); });
}

// ── Render ─────────────────────────────────────────────────────────────────

function render(){
  renderHeader();
  if(S.currentFunil==="mdi") return;   // MDI_HOOK — o mdi_set26 se desenha sozinho
  const ld=document.getElementById("loading");
  if(S.firstLoad&&S.loading){ld.style.display="flex";return;}
  ld.style.display="none";
  // Painel de erro visível
  const errEl=document.getElementById("err-panel");
  if(errEl){
    if(S.error){
      errEl.style.display="flex";
      errEl.innerHTML=`<div style="background:#1e1014;border:1px solid #f87171;border-radius:12px;padding:24px 28px;max-width:700px;width:100%">
        <div style="color:#f87171;font-weight:700;font-size:15px;margin-bottom:12px">⚠️ Erro ao carregar dados</div>
        <code style="display:block;color:#fca5a5;font-size:12px;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-all;line-height:1.6">${S.error}</code>
        <button onclick="localStorage.removeItem('dash_reto_v1');loadData(true)" style="margin-top:16px;padding:8px 18px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px">↻ Tentar novamente</button>
        <button onclick="navigator.clipboard.writeText(${JSON.stringify(JSON.stringify(S.error))})" style="margin-top:16px;margin-left:8px;padding:8px 18px;background:var(--surf);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px">📋 Copiar erro</button>
      </div>`;
      return;
    } else { errEl.style.display="none"; }
  }
  if(S.currentFunil==="dist"){
    if(S.currentPage==="principal") renderDistPrincipal();
    else if(S.currentPage==="trafego") renderDistTrafego();
    else if(S.currentPage==="anuncios") renderDistAnuncios();
    else if(S.currentPage==="resumo") renderDistResumo();
  } else if(S.currentFunil==="aquec"){
    if(S.currentPage==="principal") renderAquecPrincipal();
    else if(S.currentPage==="anuncios") renderAquecAnuncios();
    else if(S.currentPage==="resumo") renderAquecResumo();
  } else if(S.currentFunil==="feo"){
    if(S.currentPage==="principal") renderPrincipal();
    else if(S.currentPage==="trafego") renderTrafego();
    else if(S.currentPage==="anuncios") renderAnuncios();
    else if(S.currentPage==="funil") renderFunil();
    else if(S.currentPage==="resumo") renderResumo();
  } else {
    if(S.currentPage==="principal") renderPrincipal();
    else if(S.currentPage==="trafego") renderTrafego();
    else if(S.currentPage==="anuncios") renderAnuncios();
    else if(S.currentPage==="funil") renderFunil();
    else if(S.currentPage==="resumo") renderResumo();
  }

}


// ── Distribuição: helpers ─────────────────────────────────────────────────
function getDistDaily(start, end){
  const allDates=new Set([...Object.keys(S.distMeta||{}),...Object.keys(S.distSeg||{})]);
  return [...allDates].filter(d=>d>=start&&d<=end).sort().map(d=>{
    const m=S.distMeta[d]||{};
    const sg=S.distSeg[d]||{};
    const spend=m.spend||0,clicks=m.clicks||0,impressions=m.impressions||0;
    const video3s=m.video3s||0,video15s=m.video15s||0,profileVisits=m.profileVisits||0;
    const seguidores=sg.seguidores||0;
    const ctr=impressions>0?clicks/impressions*100:0;
    const cpm=impressions>0?spend/impressions*1000:0;
    const cpc=clicks>0?spend/clicks:0;
    const hookRate=impressions>0?video3s/impressions*100:0;
    const holdRate=video3s>0?video15s/video3s*100:0;
    const cps=seguidores>0?spend/seguidores:0;
    const cpVisita=profileVisits>0?spend/profileVisits:0;
    const [,mm,dd2]=d.split("-");
    return {date:d,label:`${dd2}/${mm}`,spend,clicks,impressions,video3s,video15s,
      profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cps,cpVisita};
  });
}

function getDistTotals(start, end){
  const dD=S.distMeta||{};
  let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
  for(const [d,v] of Object.entries(dD)){
    if(d<start||d>end) continue;
    spend+=v.spend; clicks+=v.clicks; impressions+=v.impressions;
    video3s+=v.video3s; video15s+=v.video15s; profileVisits+=v.profileVisits;
  }
  const sD=S.distSeg||{};
  let seguidores=0;
  for(const [d,v] of Object.entries(sD)){
    if(d<start||d>end) continue;
    seguidores+=v.seguidores;
  }
  const ctr=impressions>0?clicks/impressions*100:0;
  const cpm=impressions>0?spend/impressions*1000:0;
  const cpc=clicks>0?spend/clicks:0;
  const hookRate=impressions>0?video3s/impressions*100:0;
  const holdRate=video3s>0?video15s/video3s*100:0;
  const cps=seguidores>0?spend/seguidores:0;
  return {spend,clicks,impressions,video3s,video15s,profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cps};
}

// ── Distribuição: Métricas Tráfego ───────────────────────────────────────
function renderDistTrafego(){
  const el=document.getElementById("page-trafego");if(!el)return;
  const today=todayISO();
  const start=S.startDate, end=S.endDate;
  const daily=getDistDaily(start,end);

  // Hoje + últimos 3 dias como totais
  const todayD=getDistTotals(today,today);
  const p3Start=subDays(today,3), p3End=subDays(today,1);
  const p3Tot=getDistTotals(p3Start,p3End);

  const METRICS_ROW=[
    {key:"spend", lbl:"Investimento", fmt:fBRL, meta:null, higher:null},
    {key:"ctr",   lbl:"CTR",          fmt:fPct, meta:METAS_DIST.ctr.val, higher:true},
    {key:"cpm",   lbl:"CPM",          fmt:fBRL, meta:METAS_DIST.cpm.val, higher:false},
    {key:"cpc",   lbl:"CPC",          fmt:fBRL, meta:METAS_DIST.cpc.val, higher:false},
  ];

  function metricsRow(obj){
    return METRICS_ROW.map(m=>{
      const v=obj[m.key]||0;

      const bord=m.meta!=null?statusBorder(v,m.meta,m.higher):"var(--border)";

        <div class="kc-lbl">${m.lbl}</div>
        <div class="kc-val" style="color:${color};font-size:17px">${m.fmt(v)}</div>
        ${m.meta!=null?`<div class="kc-sub">Meta: ${m.fmt(m.meta)}</div>`:""}
      </div>`;
    }).join("");
  }

  const CHART_CONFIGS=[
    {key:"ctr", lbl:"CTR", fmt:fPct, meta:METAS_DIST.ctr.val, metaLbl:"Meta "+METAS_DIST.ctr.label},
    {key:"cpm", lbl:"CPM", fmt:fBRL, meta:METAS_DIST.cpm.val, metaLbl:"Meta "+METAS_DIST.cpm.label},
    {key:"cpc", lbl:"CPC", fmt:fBRL, meta:METAS_DIST.cpc.val, metaLbl:"Meta "+METAS_DIST.cpc.label},
  ];

  function dChart(c){
    const ov=S.distOverlays[c.key];
    const invOn=ov.inv;
    return `<div class="cc" style="position:relative">
      <div class="ch">
        <span class="ct">${c.lbl}</span>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:10px;color:var(--hint)">${c.metaLbl}</span>
          <div class="overlay-btns">
            <button class="btn-overlay${invOn?" on":""}"
              style="${invOn?`border-color:${CHART_INV};color:${CHART_INV};background:${CHART_INV}18`:""}"
              onclick="S.distOverlays['${c.key}'].inv=!S.distOverlays['${c.key}'].inv;renderDistTrafego()">+ Invest.</button>
          </div>
        </div>
      </div>
      <div style="position:relative">
        <canvas id="dtc-${c.key}"></canvas>
        <div class="tip" id="dtt-${c.key}"></div>
      </div>
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Métricas de Tráfego — Distribuição</div>
        <div class="hdr-sub">atualizado em: ${fDateBR(today)} · ${daily.length} dias</div>
      </div>
      <div>${statusLegend()}</div>
    </div>

    <div class="section-lbl">Hoje — ${fDateBR(today)}</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
      ${metricsRow(todayD)}
    </div>

    <div class="section-lbl">Últimos 3 dias — ${fDateBR(p3Start)} a ${fDateBR(p3End)}</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">
      ${metricsRow(p3Tot)}

      ${CHART_CONFIGS.map(c=>dChart(c)).join("")}
    </div>
    <p class="foot">Base Distribuição (Meta Ads) · Google Sheets API v4</p>`;

  requestAnimationFrame(()=>{
    const sW=document.getElementById("dtc-ctr")?.parentElement?.offsetWidth||500;
    CHART_CONFIGS.forEach(c=>{
      const ov=S.distOverlays[c.key];
      drawChartWithOverlay(`dtc-${c.key}`,daily,c.key,c.fmt,c.meta,c.metaLbl,ov.inv,false,sW,170);

function renderDistAnuncios(){
  const el=document.getElementById("page-anuncios"); if(!el)return;
  const start=S.startDate, end=S.endDate;

  // ── Build camp rows filtered by date ──────────────────────────────────────
  const campRows=Object.values(S.distMetaByCamp||{}).map(c=>{
    let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
    const byDate=S.distMetaByCampByDate[c.campName]||{};
    for(const [d,v] of Object.entries(byDate)){
      if(d<start||d>end) continue;
      spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;
      video3s+=v.video3s;video15s+=v.video15s;profileVisits+=v.profileVisits;
    }
    const seg=(S.distSegByCamp[c.campName]||{seguidores:0}).seguidores;
    const ctr=impressions>0?clicks/impressions*100:0;
    const cpm=impressions>0?spend/impressions*1000:0;
    const cpc=clicks>0?spend/clicks:0;
    const cps=seg>0?spend/seg:0;
    const cpVisita=profileVisits>0?spend/profileVisits:0;
    return {campName:c.campName,spend,clicks,impressions,profileVisits,seguidores:seg,ctr,cpm,cpc,cps,cpVisita};
  }).filter(r=>r.spend>0).sort((a,b)=>b.spend-a.spend);

// ── Distribuição: Resumo ──────────────────────────────────────────────────
function renderDistResumo(){
  const el=document.getElementById("page-resumo"); if(!el)return;
  const _resumoFocus=document.activeElement?.id;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  function fD(v){ return "$"+v.toFixed(2).replace(".",","); }
  function fP(v){ return v.toFixed(1).replace(".",",")+"%"; }
  function fN(v){ return v===0?"0":v.toLocaleString("pt-BR"); }
  function fDM(iso){ if(!iso)return "—"; const [,m,d]=iso.split("-"); return `${d}/${m}`; }

  function em(val, meta){
    if(!val||val===0) return "";
    const ratio=meta.higher?val/meta.val:meta.val/val;
    if(ratio>=1)   return "🟢";
    if(ratio>=0.85)return "🟡";
    return "🔴";
  }

  function distMetrics(s, e){
    const dD=S.distMeta||{};
    let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
    for(const [d,v] of Object.entries(dD)){
      if(d<s||d>e) continue;
      spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;
      video3s+=v.video3s;video15s+=v.video15s;profileVisits+=v.profileVisits;
    }
    const sD=S.distSeg||{};
    let seguidores=0;
    for(const [d,v] of Object.entries(sD)){
      if(d<s||d>e) continue;
      seguidores+=v.seguidores;
    }
    const ctr=impressions>0?clicks/impressions*100:null;
    const cpm=impressions>0?spend/impressions*1000:null;
    const cpc=clicks>0?spend/clicks:null;
    const hookRate=impressions>0?video3s/impressions*100:null;
    const holdRate=video3s>0?video15s/video3s*100:null;
    const cpVisita=profileVisits>0?spend/profileVisits:null;
    const cpSeg=seguidores>0?spend/seguidores:null;
    const txConv=profileVisits>0?seguidores/profileVisits*100:null;
    return {spend,clicks,impressions,profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cpVisita,cpSeg,txConv};
  }

  const tot  =distMetrics(start,end);
  const ontem=distMetrics(yest,yest);
  const hoje =distMetrics(today,today);

  const dateLabel=start===end?fDM(start):`${fDM(start)} a ${fDM(end)}`;

  // ── Text for copy ─────────────────────────────────────────────────────────
  function textBlock(label, m){
    function line(lbl, val, fmtFn, meta, pad=42){
      const v=val===null?"#DIV/0!":fmtFn(val);
      const dot=meta?(val===null?"":"\t"+(em(val,meta)||"🔴")+" Meta: "+meta.label):"";
      return `${lbl.padEnd(pad," ")}${v}${dot}`;
    }
    return [
      `📶 *${label}*`,``,
      line("Investimento:",         m.spend,       fD,  null),
      line("Visitas ao Perfil:",    m.profileVisits, fN, null),
      line("Custo/Visita:",         m.cpVisita,    fD,  METAS_DIST.cpVisita),
      line("Seguidores:",           m.seguidores,  fN,  null),
      line("Custo/Seguidor:",       m.cpSeg,       fD,  METAS_DIST.cpSeg),``,
      line("Hook Rate (3s/impr.):", m.hookRate,    fP,  METAS_DIST.hookRate),
      line("Hold Rate (15s/3s):",   m.holdRate,    fP,  METAS_DIST.holdRate),
    ].join("\n");
  }

  const fullText=[
    `*Finanzas - Distribuição de Conteúdo*`,``,
    `_${dateLabel}_`,``,
    textBlock("Total", tot),``,``,
    textBlock("Ontem",ontem),``,``,
    textBlock("Hoje",hoje),
  ].join("\n");

  // ── Visual rows ───────────────────────────────────────────────────────────
  function row(lbl, val, fmtFn, meta){
    const fv=val===null?"—":(typeof val==="number"?fmtFn(val):val);
    const badge=meta?em(val,meta):"";
    const metaTxt=meta&&val!==null?`<span style="font-size:10px;color:var(--hint);margin-left:4px">meta ${meta.label}</span>`:"";
    return `<div style="display:grid;grid-template-columns:180px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${fv}</span>
      <span style="font-size:13px;min-width:28px;text-align:right">${badge}${metaTxt}</span>
    </div>`;
  }

  function section(label, m, isHoje=false){
    const planRow=isHoje?`
      <div style="display:grid;grid-template-columns:180px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
        <span style="color:var(--muted);font-size:12px">Plan até hj</span>
        <input id="dist-plan-input"
          value="${S.distPlanHoje||''}"
          placeholder="Digitar plan..."
          oninput="S.distPlanHoje=this.value;renderDistResumo()"
          style="background:var(--surf);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:3px 8px;outline:none;width:100%;box-sizing:border-box">
      </div>`:"";
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">📶 ${label}</div>
      ${row("Investimento", m.spend, fD, null)}
      ${row("Visitas ao Perfil", m.profileVisits, fN, null)}
      ${row("Custo/Visita", m.cpVisita, fD, METAS_DIST.cpVisita)}
      ${row("Seguidores", m.seguidores, fN, null)}
      ${row("Custo/Seguidor", m.cpSeg, fD, METAS_DIST.cpSeg)}
      <div style="height:8px"></div>
      ${row("Hook Rate", m.hookRate, fP, METAS_DIST.hookRate)}
      ${row("Hold Rate", m.holdRate, fP, METAS_DIST.holdRate)}
      ${planRow}
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário — Distribuição</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)}</div>
      </div>
      <button id="dist-copy-btn" onclick="distCopyResumo()"
        style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif">
        📋 Copiar resumo
      </button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start">
      <div>
        ${section("Total", tot, false)}
        ${section("Ontem", ontem, false)}
        ${section("Hoje", hoje, true)}
      </div>
      <div style="position:sticky;top:20px">
        <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">Preview</div>
          <pre id="dist-resumo-pre" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.75;margin:0;user-select:all">${fullText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
        </div>
      </div>
    </div>
    <p class="foot">Ontem e Hoje são sempre datas fixas · Total reflete o filtro de datas do header</p>
  `;

  document.getElementById("dist-resumo-pre")._text=fullText;

  if(_resumoFocus==="dist-plan-input"){
    requestAnimationFrame(()=>{
      const inp=document.getElementById("dist-plan-input");
      if(inp){inp.focus();const l=inp.value.length;inp.setSelectionRange(l,l);}
    });
  }
}

function distCopyResumo(){
  const pre=document.getElementById("dist-resumo-pre");
  const text=pre?._text||"";
  if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    const b=document.getElementById("dist-copy-btn");
    if(b){const o=b.innerHTML;b.innerHTML="✓ Copiado!";b.style.color="#4ade80";setTimeout(()=>{b.innerHTML=o;b.style.color="";},1800);}
  }).catch(()=>alert("Selecione o texto manualmente."));
}

function getAquecDaily(start, end){
  const allDates=new Set([...Object.keys(S.aquecMeta||{}),...Object.keys(S.aquecSeg||{})]);
  return [...allDates].filter(d=>d>=start&&d<=end).sort().map(d=>{
    const m=S.aquecMeta[d]||{};
    const sg=S.aquecSeg[d]||{};
    const spend=m.spend||0,clicks=m.clicks||0,impressions=m.impressions||0;
    const video3s=m.video3s||0,video15s=m.video15s||0,profileVisits=m.profileVisits||0;
    const seguidores=sg.seguidores||0;
    const ctr=impressions>0?clicks/impressions*100:0;
    const cpm=impressions>0?spend/impressions*1000:0;
    const cpc=clicks>0?spend/clicks:0;
    const hookRate=impressions>0?video3s/impressions*100:0;
    const holdRate=video3s>0?video15s/video3s*100:0;
    const cps=seguidores>0?spend/seguidores:0;
    const cpVisita=profileVisits>0?spend/profileVisits:0;
    const [,mm,dd2]=d.split("-");
    return {date:d,label:`${dd2}/${mm}`,spend,clicks,impressions,video3s,video15s,
      profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cps,cpVisita};
  });
}

function getAquecTotals(start, end){
  const aD=S.aquecMeta||{};
  let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
  for(const [d,v] of Object.entries(aD)){
    if(d<start||d>end) continue;
    spend+=v.spend; clicks+=v.clicks; impressions+=v.impressions;
    video3s+=v.video3s; video15s+=v.video15s; profileVisits+=v.profileVisits;
  }
  const asD=S.aquecSeg||{};
  let seguidores=0;
  for(const [d,v] of Object.entries(asD)){
    if(d<start||d>end) continue;
    seguidores+=v.seguidores;
  }
  const ctr=impressions>0?clicks/impressions*100:0;
  const cpm=impressions>0?spend/impressions*1000:0;
  const cpc=clicks>0?spend/clicks:0;
  const hookRate=impressions>0?video3s/impressions*100:0;
  const holdRate=video3s>0?video15s/video3s*100:0;
  const cps=seguidores>0?spend/seguidores:0;
  return {spend,clicks,impressions,video3s,video15s,profileVisits,seguidores,ctr,cpm,cpc,hookRate,holdRate,cps};
}

function renderAquecAnuncios(){
  const el=document.getElementById("page-anuncios"); if(!el)return;
  const start=S.startDate, end=S.endDate;

  const campRows=Object.values(S.aquecMetaByCamp||{}).map(c=>{
    let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
    const byDate=S.aquecMetaByCampByDate[c.campName]||{};
    for(const [d,v] of Object.entries(byDate)){
      if(d<start||d>end) continue;
      spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;
      video3s+=v.video3s;video15s+=v.video15s;profileVisits+=v.profileVisits;
    }
    const seg=(S.aquecSegByCamp[c.campName]||{seguidores:0}).seguidores;
    const ctr=impressions>0?clicks/impressions*100:0;
    const cpm=impressions>0?spend/impressions*1000:0;
    const cpc=clicks>0?spend/clicks:0;
    const cps=seg>0?spend/seg:0;
    const cpVisita=profileVisits>0?spend/profileVisits:0;
    return {campName:c.campName,spend,clicks,impressions,profileVisits,seguidores:seg,ctr,cpm,cpc,cps,cpVisita};
  }).filter(r=>r.spend>0).sort((a,b)=>b.spend-a.spend);

  const hasCampFilter=S.selectedCamps.size>0;
  const filteredCamps=S.campSearch.trim()
    ?campRows.filter(c=>c.campName.toLowerCase().includes(S.campSearch.trim().toLowerCase()))
    :campRows;

  const adRows=Object.values(S.aquecMetaByAd||{}).map(a=>{
    if(hasCampFilter&&!S.selectedCamps.has(a.campName)) return null;
    let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
    const byDate=S.aquecMetaByAdByDate[a.adName]||{};
    for(const [d,v] of Object.entries(byDate)){
      if(d<start||d>end) continue;
      spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;
      video3s+=v.video3s;video15s+=v.video15s;profileVisits+=v.profileVisits;
    }
    if(spend===0) return null;
    const seg=(S.aquecSegByAd[a.adName]||{seguidores:0}).seguidores;
    const ctr=impressions>0?clicks/impressions*100:0;
    const cpm=impressions>0?spend/impressions*1000:0;
    const cpc=clicks>0?spend/clicks:0;
    const cps=seg>0?spend/seg:0;
    const cpVisita=profileVisits>0?spend/profileVisits:0;
    return {adName:a.adName,campName:a.campName,spend,clicks,impressions,profileVisits,seguidores:seg,ctr,cpm,cpc,cps,cpVisita};
  }).filter(Boolean).sort((a,b)=>b.spend-a.spend);

  const filteredAds=S.adSearch.trim()
    ?adRows.filter(a=>a.adName.toLowerCase().includes(S.adSearch.trim().toLowerCase()))
    :adRows;

  const tot=getAquecTotals(start,end);
  const cpVisitaV=tot.profileVisits>0?tot.spend/tot.profileVisits:0;

  const thS="padding:8px 12px;text-align:right;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);color:var(--hint);font-size:10px;font-weight:600;letter-spacing:.05em;white-space:nowrap";
  const thL="padding:8px 12px;text-align:left;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);color:var(--hint);font-size:10px;font-weight:600;letter-spacing:.05em";
  const td="padding:9px 12px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);border-bottom:1px solid rgba(255,255,255,.04)";
  const tdL="padding:9px 12px;text-align:left;font-size:11px;color:var(--text);border-bottom:1px solid rgba(255,255,255,.04)";

  const _aquecCampHTML=filteredCamps.map((r,i)=>{
    const sel=S.selectedCamps.has(r.campName);
    const bg=sel?"rgba(59,130,246,.12)":i%2?"rgba(255,255,255,.02)":"transparent";
    const bl=sel?"border-left:2px solid var(--accent)":"border-left:2px solid transparent";
    const cn=r.campName.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    const cj=JSON.stringify(r.campName);
    return "<tr style=\"background:"+bg+";"+bl+";cursor:pointer\" onclick=\"toggleAquecCamp("+cj+")\">"
      +"<td style=\""+tdL+"\"><span style=\"font-size:10px;color:var(--text-strong)\">"+cn+"</span></td>"
      +"<td style=\""+td+"\">"+fBRL(r.spend)+"</td>"
      +"<td style=\""+td+"\">"+r.profileVisits.toLocaleString("pt-BR")+"</td>"
      +"<td style=\""+td+"\">"+(r.cpVisita>0?fBRL(r.cpVisita):"—")+"</td>"
      +"<td style=\""+td+";font-weight:600;color:var(--text-strong)\">"+(r.seguidores||"—")+"</td>"
      +"<td style=\""+td+"\">"+(r.cps>0?fBRL(r.cps):"—")+"</td>"
      +"<td style=\""+td+"\">"+fPct(r.ctr)+"</td>"
      +"<td style=\""+td+"\">"+fBRL(r.cpm)+"</td>"
      +"</tr>";
  }).join("");

  const _aquecAdHTML=filteredAds.map((r,i)=>{
    const bg=i%2?"rgba(255,255,255,.02)":"transparent";
    const an=r.adName.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    return "<tr style=\"background:"+bg+"\">"
      +"<td style=\""+tdL+"\"><span style=\"font-size:11px;color:var(--text-strong)\">"+an+"</span></td>"
      +"<td style=\""+td+"\">"+fBRL(r.spend)+"</td>"
      +"<td style=\""+td+"\">"+r.profileVisits.toLocaleString("pt-BR")+"</td>"
      +"<td style=\""+td+"\">"+(r.cpVisita>0?fBRL(r.cpVisita):"—")+"</td>"
      +"<td style=\""+td+";font-weight:600;color:var(--text-strong)\">"+(r.seguidores||"—")+"</td>"
      +"<td style=\""+td+"\">"+(r.cps>0?fBRL(r.cps):"—")+"</td>"
      +"<td style=\""+td+"\">"+fPct(r.ctr)+"</td>"
      +"<td style=\""+td+"\">"+fBRL(r.cpm)+"</td>"
      +"</tr>";
  }).join("");

  el.innerHTML=`
  <div class="hdr" style="margin-bottom:16px">
    <div>
      <div class="hdr-title">Aquecimento Base — Campanhas / Anúncios</div>
      <div class="hdr-sub">período: ${start} a ${end} · ${filteredCamps.length}/${campRows.length} campanhas · ${filteredAds.length} anúncios</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px">
    ${kpiCard("Investimento",fBRL(tot.spend),"total","var(--text-strong)",false,tot.spend||null,false)}
    ${kpiCard("Visitas ao Perfil",tot.profileVisits.toLocaleString("pt-BR"),"total","var(--text-strong)",false,null,false)}
    ${kpiCard("Custo/Visita",cpVisitaV>0?fBRL(cpVisitaV):"—","—","var(--text-strong)",false,null,false)}
    ${kpiCard("Seguidores",tot.seguidores.toLocaleString("pt-BR"),"total","var(--text-strong)",false,null,false)}
  </div>

  <div style="margin-bottom:20px">
    <div style="font-size:12px;font-weight:700;color:var(--text-strong);margin-bottom:8px">Campanhas</div>
    <input type="text" placeholder="Buscar campanha..." value="${S.campSearch}"
      oninput="S.campSearch=this.value;renderAquecAnuncios()"
      style="width:100%;max-width:340px;background:var(--surf);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;padding:7px 12px;outline:none;margin-bottom:10px">
    <div style="overflow-x:auto;border-radius:10px;border:1px solid var(--border)">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr>
          <th style="${thL}">Campanha</th>
          <th style="${thS}">Investimento</th>
          <th style="${thS}">Visitas Perfil</th>
          <th style="${thS}">Custo/Visita</th>
          <th style="${thS}">Seguidores</th>
          <th style="${thS}">Custo/Seg.</th>
          <th style="${thS}">CTR</th>
          <th style="${thS}">CPM</th>
        </tr></thead>
        <tbody>${_aquecCampHTML}</tbody>
      </table>
    </div>
  </div>

  <div>
    <div style="font-size:12px;font-weight:700;color:var(--text-strong);margin-bottom:8px">
      Anúncios${hasCampFilter?" — filtrado por "+S.selectedCamps.size+" campanha(s)":""}
    </div>
    <input type="text" placeholder="Buscar anúncio..." value="${S.adSearch}"
      oninput="S.adSearch=this.value;renderAquecAnuncios()"
      style="width:100%;max-width:340px;background:var(--surf);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;padding:7px 12px;outline:none;margin-bottom:10px">
    <div style="overflow-x:auto;border-radius:10px;border:1px solid var(--border)">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr>
          <th style="${thL}">Anúncio</th>
          <th style="${thS}">Investimento</th>
          <th style="${thS}">Visitas Perfil</th>
          <th style="${thS}">Custo/Visita</th>
          <th style="${thS}">Seguidores</th>
          <th style="${thS}">Custo/Seg.</th>
          <th style="${thS}">CTR</th>
          <th style="${thS}">CPM</th>
        </tr></thead>
        <tbody>${_aquecAdHTML}</tbody>
      </table>
    </div>
  </div>`;
}

// ── Aquecimento Base: Resumo ──────────────────────────────────────────────
function renderAquecResumo(){
  const el=document.getElementById("page-resumo"); if(!el)return;
  const _resumoFocus=document.activeElement?.id;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  function fD(v){ return "$"+v.toFixed(2).replace(".",","); }
  function fP(v){ return v.toFixed(2).replace(".",",")+"%"; }
  function fN(v){ return v===0?"0":v.toLocaleString("pt-BR"); }
  function fDM(iso){ if(!iso)return "—"; const [,m,d]=iso.split("-"); return `${d}/${m}`; }

  function em(val, meta){
    if(!val||val===0||!meta||!meta.val) return "";
    const ratio=meta.higher?val/meta.val:meta.val/val;
    if(ratio>=1)   return "🟢";
    if(ratio>=0.85)return "🟡";
    return "🔴";
  }

  function aquecMetrics(s, e){
    const aD=S.aquecMeta||{};
    let spend=0,clicks=0,impressions=0,video3s=0,video15s=0,profileVisits=0;
    for(const [d,v] of Object.entries(aD)){
      if(d<s||d>e) continue;
      spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;
      video3s+=v.video3s;video15s+=v.video15s;profileVisits+=v.profileVisits;
    }
    const asD=S.aquecSeg||{};
    let seguidores=0;
    for(const [d,v] of Object.entries(asD)){
      if(d<s||d>e) continue;
      seguidores+=v.seguidores;
    }
    const cpm=impressions>0?spend/impressions*1000:null;
    const hookRate=impressions>0?video3s/impressions*100:null;
    const holdRate=video3s>0?video15s/video3s*100:null;
    const cpVisita=profileVisits>0?spend/profileVisits:null;
    const cpSeg=seguidores>0?spend/seguidores:null;
    const txConv=profileVisits>0?seguidores/profileVisits*100:null;
    return {spend,profileVisits,seguidores,cpm,hookRate,holdRate,cpVisita,cpSeg,txConv};
  }

  const tot  =aquecMetrics(start,end);
  const ontem=aquecMetrics(yest,yest);
  const hoje =aquecMetrics(today,today);
  const dateLabel=start===end?fDM(start):`${fDM(start)} a ${fDM(end)}`;

  function textBlock(label, m){
    function line(lbl, val, fmtFn, meta, pad=42){
      const v=val===null?"#DIV/0!":fmtFn(val);
      const dot=meta&&meta.val?(val===null?"":"\t"+(em(val,meta)||"🔴")+" Meta: "+meta.label):"";
      return `${lbl.padEnd(pad," ")}${v}${dot}`;
    }
    return [
      `📶 *${label}*`,``,
      line("Investimento:",              m.spend,       fD, null),
      line("Visitas ao Perfil:",         m.profileVisits,fN, null),
      line("Custo por visita ao perfil:",m.cpVisita,    fD, null),
      line("Seguidores:",                m.seguidores,  fN, null),
      line("Custo por Seguidor:",        m.cpSeg,       fD, null),``,
      line("Tx de conversao de seguidores:",m.txConv,  fP, METAS_AQUEC.txConv),
      line("hook rate (viu 3s / impressões):",m.hookRate,fP,METAS_AQUEC.hookRate),
      line("hold rate (viu 15s / viu 3s):",  m.holdRate, fP,METAS_AQUEC.holdRate),``,
      line("CPM:",                       m.cpm,         fD, METAS_AQUEC.cpm),
    ].join("\n");
  }

  const fullText=[
    `*Finanzas con proposito - aquecimento base*`,``,
    `_${dateLabel}_`,``,
    textBlock("Total", tot),``,``,
    textBlock("Ontem",ontem),``,``,
    textBlock("Hoje",hoje),
  ].join("\n");

  function row(lbl, val, fmtFn, meta){
    const fv=val===null?"—":(typeof val==="number"?fmtFn(val):val);
    const badge=meta&&meta.val?em(val,meta):"";
    const metaTxt=meta&&meta.val&&val!==null?`<span style="font-size:10px;color:var(--hint);margin-left:4px">meta ${meta.label}</span>`:"";
    return `<div style="display:grid;grid-template-columns:200px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${fv}</span>
      <span style="font-size:13px;min-width:28px;text-align:right">${badge}${metaTxt}</span>
    </div>`;
  }

  function section(label, m, isHoje=false){
    const planRow=isHoje?`
      <div style="display:grid;grid-template-columns:200px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
        <span style="color:var(--muted);font-size:12px">Plan até hj</span>
        <input id="aquec-plan-input"
          value="${S.aquecPlanHoje||''}"
          placeholder="Digitar plan..."
          oninput="S.aquecPlanHoje=this.value;renderAquecResumo()"
          style="background:var(--surf);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:3px 8px;outline:none;width:100%">
      </div>`:"";
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">${label}</div>
      ${row("Investimento", m.spend, fD, null)}
      ${row("Visitas ao Perfil", m.profileVisits, fN, null)}
      ${row("Custo/Visita", m.cpVisita, fD, null)}
      ${row("Seguidores", m.seguidores, fN, null)}
      ${row("Custo/Seguidor", m.cpSeg, fD, null)}
      <div style="height:8px"></div>
      ${row("Tx conv. seguidores", m.txConv, fP, METAS_AQUEC.txConv)}
      ${row("Hook Rate (3s/impr.)", m.hookRate, fP, METAS_AQUEC.hookRate)}
      ${row("Hold Rate (15s/3s)", m.holdRate, fP, METAS_AQUEC.holdRate)}
      <div style="height:8px"></div>
      ${row("CPM", m.cpm, fD, METAS_AQUEC.cpm)}
      ${planRow}
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário — Aquecimento Base</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)}</div>
      </div>
      <button id="aquec-copy-btn" onclick="aquecCopyResumo()"
        style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.3);border-radius:8px;color:#93c5fd;font-size:12px;font-weight:600;cursor:pointer">
        📋 Copiar resumo
      </button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start">
      <div>
        ${section("Total", tot, false)}
        ${section("Ontem", ontem, false)}
        ${section("Hoje", hoje, true)}
      </div>
      <div style="position:sticky;top:20px">
        <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">Preview</div>
          <pre id="aquec-resumo-pre" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.6;margin:0">${fullText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
        </div>
      </div>
    </div>
    <p class="foot">Ontem e Hoje são sempre datas fixas · Total reflete o filtro de datas do header</p>
  `;

  document.getElementById("aquec-resumo-pre")._text=fullText;

  if(_resumoFocus==="aquec-plan-input"){
    requestAnimationFrame(()=>{
      const inp=document.getElementById("aquec-plan-input");
      if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
    });
  }
}

function aquecCopyResumo(){
  const pre=document.getElementById("aquec-resumo-pre");
  if(!pre) return;
  const txt=pre._text||pre.textContent;
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.getElementById("aquec-copy-btn");
    if(btn){const o=btn.textContent;btn.textContent="✓ Copiado!";setTimeout(()=>btn.textContent=o,2000);}
  });
}

</script>
</body>
</html>
