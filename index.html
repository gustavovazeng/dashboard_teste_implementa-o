    "REFUNDED":"Reembolsado","CANCELLED":"Reembolsado","CANCELED":"Reembolsado","CHARGEBACK":"Reembolsado",
    "BILLET_PRINTED":"Aberta","WAITING_PAYMENT":"Aberta","PRINTED":"Aberta",
    "OVERDUE":"Expirado","DELAYED":"Expirado","EXPIRED":"Expirado",
  };
  return m[String(s).toUpperCase().trim()]||String(s).trim();
}

// Conversão para USD — rates = quanto da moeda vale 1 USD
const FX_RATES={
  USD:1, MXN:18, BRL:5.50, EUR:0.92, GBP:0.79, CAD:1.37,
  ARS:1000, COP:4100, CLP:960, PEN:3.75, CRC:530, GTQ:7.8,
  HNL:25, NIO:36.5, DOP:60, BOB:6.9, PYG:7700, UYU:41,
};
function toUSD(valor, currency){
  const c=(currency||"USD").toUpperCase().trim();
  const rate=FX_RATES[c]||1;
  return valor/rate;
}

// Conversão de preço Hotmart → USD com regra por produto
// Reto: MXN÷18, USD÷1, outros→$38 fixo
// Cero/outros: usa FX_RATES padrão
function hotmartPriceUSD(priceRaw, currency, productName){
  const price=parseFloat(String(priceRaw).replace(",","."))||0;
  const curr=(currency||"USD").toUpperCase().trim();
  if(/reto/i.test(productName)){
    if(curr==="MXN") return price/18;
    if(curr==="USD") return price;
    return 38; // outras moedas: preço padrão Reto = $38
  }
  if(/mapa/i.test(productName)){
    if(curr==="MXN") return price/18;
    if(curr==="USD") return price;
    return 297; // outras moedas: preço padrão Mapa = $297
  }
  return toUSD(price, curr);
}

// Parseia aba Hotmart para linhas normalizadas (valores convertidos para USD)
function parseHotmartRows(sheetJ){
  return parseSheet(sheetJ).map(r=>{
    const ts=r["data.purchase.order_date"]||r["data.purchase.approved_date"]||"0";
    const d=tsToISO(ts);
    const st=normalizeHotmartStatus(r["data.purchase.status"]||"");
    const xcod=r["data.purchase.origin.xcod"]||"";
    const sck=r["data.purchase.origin.sck"]||"";
    let adId=extractAdIdFromXcod(xcod)||"";
    // Fallback: sck pode carregar as UTMs quando xcod está vazio (ex: order bump)
    // Formato sck: funnel|platform|adsetName|adsetId|adName|adId|campName|campId|placement
    if(!adId&&sck){const sp=sck.split("|");if(sp.length>=6)adId=sp[5]||"";}
    const {platform:_plat,placement:_plac}=extractXcodMeta(xcod);
    const priceRaw=String(r["data.purchase.price.value"]||"0").replace(",",".");
    const currency=r["data.purchase.price.currency_value"]||"USD";
    const productName=r["data.product.name"]||"";
    const valor=hotmartPriceUSD(priceRaw, currency, productName);
    // Hotmart às vezes descoloca campos: email vai parar em last_name quando não há sobrenome.
    // Detecta: se email não tem "@" mas last_name tem, usa last_name como email.
    const rawEmail=(r["data.buyer.email"]||"").trim();
    const rawLastName=(r["data.buyer.last_name"]||"").trim();
    const resolvedEmail=(rawEmail.includes("@")?rawEmail:(rawLastName.includes("@")?rawLastName:"")).toLowerCase();
    // Telefone: checkout_phone ou, se email era na verdade um número, usa rawEmail como tel
    const rawPhone=(r["data.buyer.checkout_phone"]||"").replace(/\D/g,"");
    const resolvedPhone=rawPhone||((!rawEmail.includes("@")&&/^\d{7,}$/.test(rawEmail))?rawEmail.replace(/\D/g,""):"");
    return {
      "Email":resolvedEmail,
      "CPF Comprador":"",
      "Telefone":resolvedPhone,
      "Nome":r["data.buyer.name"]||"",
      "Status da compra":st,
      "Data da compra":d||"",
      "Nome do produto":r["data.product.name"]||"",
      "Valor do produto":valor.toFixed(2),
      "Taxa da plataforma":"0",
      "Ad Id":adId,
      _src:"hotmart",
      platform:_plat,
      placement:_plac,
      _orderDate:r["data.purchase.order_date"]||"",
      offerCode:(r["data.purchase.offer.code"]||"").trim(),
    };
  }).filter(r=>r["Data da compra"])
    // Dedup por order_date: mesma compra pode gerar 2 webhooks; prefere o que tem email real
    // Fallback: se não há order_date (timestamp ms), usa email+data para não deduplicar
    // compradores diferentes que compraram no mesmo dia
    .reduce((acc,r)=>{
      const em=r["Email"]&&r["Email"].includes("@")?r["Email"]:"";
      const key=r._orderDate||(em?em+"|"+r["Data da compra"]:r["Data da compra"]);
      const i=acc.findIndex(x=>{
        const xe=x["Email"]&&x["Email"].includes("@")?x["Email"]:"";
        const xk=x._orderDate||(xe?xe+"|"+x["Data da compra"]:x["Data da compra"]);
        return xk===key;
      });
      if(i<0){ acc.push(r); }
      else{
        const hasEmail=!!em;
        const existingEmail=acc[i]["Email"]&&acc[i]["Email"].includes("@");
        if(!existingEmail&&hasEmail) acc[i]=r; // substitui pela linha com email real
      }
      return acc;
    },[]);
}

// Busca uma aba em blocos de 5000 linhas para evitar timeout em abas grandes
// ── CSV parser → mesmo formato que a Sheets API {values:[rows]} ───────────
function parseCSVText(text){
  const lines=text.split(/\r?\n/);
  const result=[];
  for(const line of lines){
    if(!line.trim()) continue;
    const row=[];let cur="";let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){
        if(inQ&&line[i+1]==='"'){cur+='"';i++;}
        else inQ=!inQ;
      } else if(c===','&&!inQ){row.push(cur);cur="";}
      else cur+=c;
    }
    row.push(cur);
    result.push(row);
  }
  return {values:result};
}

async function fetchCSV(filename){
  console.log(`[csv] carregando "${filename}"...`);
  const res=await fetch("./"+encodeURIComponent(filename));
  if(!res.ok) throw new Error(`HTTP ${res.status} ao carregar "${filename}"`);
  const text=await res.text();
  const j=parseCSVText(text);
  console.log(`[csv] "${filename}": ${j.values.length-1} linhas de dados`);
  return j;
}

async function fetchCSVSafe(filename){
  return fetchCSV(filename).catch(e=>{
    console.warn(`[csv] "${filename}" não encontrado:`,e.message);
    return {values:[]};
  });
}

// ── Sheets API helpers ──────────────────────────────────────────────────────
async function fetchSheetPaged(tab, lastCol="L", pageSize=5000, sheetId=SHEET_ID){
  const allValues=[];
  let startRow=1;
  while(true){
    const endRow=startRow+pageSize-1;
    const range=`${encodeURIComponent(tab)}!A${startRow}:${lastCol}${endRow}`;
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${GAPI_KEY}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error(`Sheets API: HTTP ${res.status} ao buscar aba "${tab}"`);
    const data=await res.json();
    const rows=data.values||[];
    allValues.push(...rows);
    if(rows.length<pageSize) break;
    startRow+=pageSize;
  }
  return {values:allValues};
}

    console.error("processing error:",e);

}

// ── Derived — Principal ────────────────────────────────────────────────────
function getDaily(start,end){
  const d=D();
  const metaA=getMetaActive();
  const vA=getVendasActive();
  const all=new Set([...Object.keys(metaA),...Object.keys(vA)]);
  return Array.from(all).sort().filter(dt=>dt>=start&&dt<=end).map(date=>{
    const m=metaA[date]||{spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,purchases:0};
    const v=vA[date]||{qtd:0,valor:0,taxa:0};
    const lucro=v.valor-v.taxa-(m.spend*TAXA_IMPOSTO);
    return{date,label:fDate(date),spend:m.spend,faturamento:v.valor,vendas:v.qtd,
      gerenciador:m.purchases||0,
      roas:m.spend>0?v.valor/m.spend:0,cpv:v.qtd>0?m.spend/v.qtd:0,
      ticket:v.qtd>0?v.valor/v.qtd:0,lucro};
  });
}
function getTotals(daily){
  const d=D();
  const vA=getVendasActive();
  const t=daily.reduce((a,dt)=>({spend:a.spend+dt.spend,fat:a.fat+dt.faturamento,vendas:a.vendas+dt.vendas,
    taxa:a.taxa+(vA[dt.date]?.taxa||0)}),{spend:0,fat:0,vendas:0,taxa:0});
  return{...t,faturamento:t.fat,
    roas:t.spend>0?t.fat/t.spend:0,cpv:t.vendas>0?t.spend/t.vendas:0,
    ticket:t.vendas>0?t.fat/t.vendas:0,lucro:t.fat-t.taxa-(t.spend*TAXA_IMPOSTO)};
}


// ── Derived — Tráfego ──────────────────────────────────────────────────────
function getDailyT(start,end){
  const d=D();

  return Object.keys(metaA).sort().filter(dt=>dt>=start&&dt<=end).map(date=>{
    const m=metaA[date];

    const cpc   = m.clicks>0     ? m.spend/m.clicks          : 0;

    return{date,label:fDate(date),spend:m.spend,cpv:v.qtd>0?m.spend/v.qtd:0,
      cpc,ctr,cpm,txPagChk,txChkVnd,connect,
      clicks:m.clicks,impressions:m.impressions,landingViews:m.landingViews,

}
function getTotalsT(daily){

// ── Canvas drawing ─────────────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);
  return ctx;
}

function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    // find zero Y
    const yZero=yP(0);
    ctx.lineTo(xP(n-1),yZero);ctx.lineTo(xP(0),yZero);ctx.closePath();
    const cH=ctx.canvas.height/DPR;
    const g=ctx.createLinearGradient(0,0,0,cH);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}

// Gráfico simples (1 eixo, 1 linha) + overlay opcional nos 2 eixos Y
function drawChartWithOverlay(id, data, key, fmtY, refVal, refLabel, overlayInv, overlayCpv, cssW, cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:12,r:overlayInv||overlayCpv?52:12,b:26,l:52};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;

  const vals=data.map(d=>+(d[key])||0);
  const invVals=data.map(d=>d.spend||0);
  const cpvVals=data.map(d=>d.cpv||0);

  // Domínio eixo Y esquerda (métrica principal)
  let allL=[...vals];if(refVal!=null)allL.push(refVal);
  const lMax=Math.max(...allL,0.01)*1.2, lMin=0;
  // Domínio eixo Y direita (overlay)
  const rVals=overlayCpv?cpvVals:invVals;
  const rMax=overlayInv||overlayCpv?Math.max(...rVals,0.01)*1.2:1;

  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v-lMin)/(lMax-lMin))*cH;
  const yPR=v=>P.t+cH-((v-0)/(rMax-0))*cH;

  // Grid + eixo Y esquerda
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    const lv=lMax-(i/4)*(lMax-lMin);
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmtY(lv),P.l-4,y+3);
  }

  // Eixo Y direita se overlay ativo
  if(overlayInv||overlayCpv){
    const ovColor=overlayInv?CHART_INV:CHART_CPV;
    const ovFmt=overlayInv?fBRLShort:v=>"$"+v.toFixed(2);
    for(let i=0;i<=4;i++){
      const rv=rMax-(i/4)*(rMax-0);
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=ovColor;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="left";
      ctx.fillText(ovFmt(rv),P.l+cW+4,y+3);
    }
  }

  // Linha de referência
  if(refVal!=null){
    const ry=yPL(refVal);
    ctx.strokeStyle=CHART_COLOR+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,ry);ctx.lineTo(P.l+cW,ry);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=CHART_COLOR;ctx.font="8px 'Inter',sans-serif";ctx.textAlign="right";
    ctx.fillText(refLabel||"Meta",P.l+cW,ry-3);
  }

  // Linha principal
  drawLineArea(ctx,xP,yPL,vals,CHART_COLOR,true);

  // Overlay
  if(overlayInv) drawLineArea(ctx,xP,yPR,invVals,CHART_INV,false);
  if(overlayCpv) drawLineArea(ctx,xP,yPR,cpvVals,CHART_CPV,false);

  // X labels
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Gráfico dual-axis (investimento x CPV)
function drawDual(id,data,cssW,cssH,metaCpv){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:52,b:28,l:58};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.cpv||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,metaCpv||0,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v-0)/(lMax-0))*cH;
  const yPR=v=>P.t+cH-((v-0)/(rMax-0))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  if(metaCpv){
    const mY=yPR(metaCpv);
    ctx.strokeStyle=CHART_CPV+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=CHART_CPV;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta $"+metaCpv,P.l+cW+4,mY-3);
  }
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPV,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Tooltip genérico
function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${(l.fmt||fBRL)(+(d[l.key])||0)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

// Gráfico de barras — vendas por dia
function drawBarVendas(id, data, cssW, cssH, showGap){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:24,r:showGap?50:16,b:26,l:36};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;
  const n=data.length; if(n===0)return;
  const vals=data.map(d=>d.vendas||0);
  const maxV=Math.max(...vals,1);

  // Compute GAP% per day
  const gapPcts=showGap?data.map(d=>{
    const h=d.vendas||0,g=d.gerenciador||0;
    return h>0?((g-h)/h)*100:0;
  }):[];

  // Horizontal grid (left scale = vendas count)
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const y=P.t+(i/ticks)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    if(i<ticks){
      ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="right";
      ctx.fillText(Math.round(maxV*(1-i/ticks)),P.l-4,y+3);
    }
  }

  // Green bars (Hotmart vendas)
  const slot=cW/n;
  const barW=Math.max(3,Math.min(28,slot*0.6));
  const GREEN="#34d399";
  for(let i=0;i<n;i++){
    const v=vals[i];
    const bh=Math.max(v>0?2:0,(v/maxV)*cH);
    const cx=P.l+slot*i+slot/2;
    const x=cx-barW/2;
    const yb=P.t+cH-bh;
    const g=ctx.createLinearGradient(0,yb,0,P.t+cH);
    g.addColorStop(0,GREEN+"dd");g.addColorStop(1,GREEN+"55");
    ctx.fillStyle=g;
    const r=Math.min(3,barW/2,bh/2);
    ctx.beginPath();
    ctx.moveTo(x+r,yb);ctx.lineTo(x+barW-r,yb);
    ctx.quadraticCurveTo(x+barW,yb,x+barW,yb+r);
    ctx.lineTo(x+barW,yb+bh);ctx.lineTo(x,yb+bh);ctx.lineTo(x,yb+r);
    ctx.quadraticCurveTo(x,yb,x+r,yb);ctx.closePath();
    ctx.fill();
    if(v>0){
      ctx.fillStyle="#e8edf6";
      ctx.font=`bold ${Math.max(8,Math.min(11,barW-1))}px 'DM Sans',sans-serif`;
      ctx.textAlign="center";
      ctx.fillText(v,cx,yb-4);
    }
  }

  // GAP% overlay — separate y-scale, no numbers on bars
  if(showGap&&gapPcts.length>0){
    const RED="#f87171";
    const maxGap=Math.max(Math.max(...gapPcts.map(Math.abs)),5);
    // Y mapping: 0% → mid chart; ±maxGap → top/bottom within 80% of chart height
    const gapY=pct=>P.t+cH*0.1+(1-((pct/maxGap)*0.8+1)/2)*cH*0.8;

    // Faint 0% reference line
    const y0=gapY(0);
    ctx.strokeStyle="rgba(248,113,113,0.25)";ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(P.l,y0);ctx.lineTo(P.l+cW,y0);ctx.stroke();
    ctx.setLineDash([]);

    // GAP% line
    ctx.strokeStyle=RED;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const cx=P.l+slot*i+slot/2;
      const gy=gapY(gapPcts[i]);
      if(i===0) ctx.moveTo(cx,gy); else ctx.lineTo(cx,gy);
    }
    ctx.stroke();ctx.setLineDash([]);

    // Dots (no per-point labels)
    for(let i=0;i<n;i++){
      const cx=P.l+slot*i+slot/2;
      const gy=gapY(gapPcts[i]);
      ctx.fillStyle=RED;
      ctx.beginPath();ctx.arc(cx,gy,2.5,0,Math.PI*2);ctx.fill();
    }
    // Fixed Y-scale on right margin: +max%, 0%, -max%
    const scaleTicks=[maxGap,0,-maxGap];
    ctx.font="bold 8px 'DM Sans',sans-serif";ctx.textAlign="left";
    for(const pct of scaleTicks){
      const gy=gapY(pct);
      ctx.fillStyle=pct===0?"rgba(248,113,113,0.5)":RED;
      const lbl=(pct>0?"+":"")+Math.round(pct)+"%";
      ctx.fillText(lbl,P.l+cW+4,gy+3);
    }
  }

  // X labels
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,P.l+slot*i+slot/2,P.t+cH+18);});
}

// ── Dist chart helpers ────────────────────────────────────────────────────
// Generic dual-axis (spend left, any metric right) for dist funil
function drawDistDual(id, data, rKey, rRef, rRefLabel, cssW, cssH){
  const ctx=initCanvas(id,cssW,cssH); if(!ctx)return;
  const P={t:14,r:58,b:28,l:58};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d[rKey]||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,rRef||0.01,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-(v/lMax)*cH;
  const yPR=v=>P.t+cH-(v/rMax)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText(fBRLShort(rMax-(i/4)*rMax),P.l+cW+5,y+3.5);
  }
  if(rRef){
    const mY=yPR(rRef);
    ctx.strokeStyle="#f59e0b55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#f59e0b";ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText(rRefLabel,P.l+cW+4,mY-3);
  }
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,"#f59e0b",false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Bar chart for dist data (seguidores or profile visits)
function drawDistBar(id, data, key, color, fmtFn, cssW, cssH){
  const ctx=initCanvas(id,cssW,cssH); if(!ctx)return;
  const P={t:22,r:16,b:26,l:32};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;
  const n=data.length; if(n===0)return;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,1);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
  }
  const slot=cW/n;
  const barW=Math.max(3,Math.min(28,slot*0.6));
  for(let i=0;i<n;i++){
    const v=vals[i];
    const cx=P.l+slot*i+slot/2;
    const bh=Math.max(v>0?2:0,(v/maxV)*cH);
    const x=cx-barW/2;
    const y=P.t+cH-bh;
    const g=ctx.createLinearGradient(0,y,0,P.t+cH);
    g.addColorStop(0,color+"dd");g.addColorStop(1,color+"44");
    ctx.fillStyle=g;
    const r=Math.min(3,barW/2,bh/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+barW-r,y);
    ctx.quadraticCurveTo(x+barW,y,x+barW,y+r);
    ctx.lineTo(x+barW,y+bh);ctx.lineTo(x,y+bh);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    ctx.fill();
    if(v>0){
      ctx.fillStyle="#e8edf6";
      ctx.font=`bold ${Math.max(8,Math.min(11,barW-1))}px 'DM Sans',sans-serif`;
      ctx.textAlign="center";ctx.fillText(fmtFn(v),cx,y-4);
    }
  }
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,P.l+slot*i+slot/2,P.t+cH+18);});
}

                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${v.valor>0?fBRL(v.valor):"—"}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:${roas>=1?"#22c55e":roas>0?"#f59e0b":"var(--hint)"};font-weight:600">${roas>0?roas.toFixed(2)+"x":"—"}</td>
                </tr>`;
              }).join("");
            })()}
          </tbody>
        </table>
      </div>

      <!-- Por Formato -->
      <div>
        <div class="section-lbl" style="margin-bottom:10px">Por Formato</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead>
            <tr>
              ${["Formato","Plataforma","Vendas","CPV","Faturamento","ROAS"].map(h=>`<th style="padding:7px 12px;text-align:${h==="Formato"||h==="Plataforma"?"left":"right"};background:var(--surf);border-bottom:1px solid var(--border);color:var(--hint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px">${h}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${(()=>{
              const vpl=S.vendasByPlacement||{};
              const mp=S.metaByPlatform||{};
              const vp=S.vendasByPlatform||{};
              const sorted=Object.entries(vpl).sort((a,b)=>b[1].qtd-a[1].qtd);
              const fmtLabel=pl=>{
                const p=pl.toLowerCase();
                if(p.includes("reel"))    return "Reels";
                if(p.includes("feed"))    return "Feed";
                if(p.includes("storie"))  return "Stories";
                if(p.includes("instream"))return "In-stream Video";
                if(p.includes("explore")) return "Explore";
                return pl.replace(/_/g," ");
              };
              const platKey=pl=>{
                const p=pl.toLowerCase();
                if(p.includes("instagram"))return "instagram";
                if(p.includes("facebook")) return "facebook";
                if(p.includes("messenger"))return "messenger";
                return "";
              };
              const platLabel=pl=>{const m={instagram:"Instagram",facebook:"Facebook",messenger:"Messenger"};return m[pl]||pl;};
              const dotColor=pl=>pl==="instagram"?"#e1306c":pl==="facebook"?"#1877f2":"var(--hint)";
              return sorted.map(([pl,v],i)=>{
                const pk=platKey(pl);
                const platSpend=(mp[pk]||{spend:0}).spend;
                const platQtd=(vp[pk]||{qtd:0}).qtd;
                const estSpend=platQtd>0?(v.qtd/platQtd)*platSpend:0;
                const cpv=v.qtd>0&&estSpend>0?estSpend/v.qtd:0;
                const roas=estSpend>0?v.valor/estSpend:0;
                const bg=i%2===0?"transparent":"rgba(255,255,255,0.02)";
                const dc=dotColor(pk);
                return `<tr style="background:${bg}">
                  <td style="padding:8px 12px;color:var(--text)">${fmtLabel(pl)}</td>
                  <td style="padding:8px 12px"><span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${dc}22;color:${dc}">${platLabel(pk)}</span></td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-strong);font-weight:600">${v.qtd}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${cpv>0?fBRL(cpv):"—"}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${fBRL(v.valor)}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:${roas>=1?"#22c55e":roas>0?"#f59e0b":"var(--hint)"};font-weight:600">${roas>0?roas.toFixed(2)+"x":"—"}</td>
                </tr>`;
              }).join("");
            })()}
          </tbody>
        </table>
      </div>

    </div>
        <p class="foot">Base Meta (Stract) + Base Vendas (Eduzz) · Google Sheets API v4</p>`;

  requestAnimationFrame(()=>{
    const sW=document.getElementById(`tc-${CHART_CONFIGS[0].key}`)?.parentElement?.offsetWidth||500;
    CHART_CONFIGS.forEach(c=>{
      const ov=S.overlays[c.key];
      drawChartWithOverlay(`tc-${c.key}`,daily,c.key,c.fmt,c.meta,c.metaLbl,ov.inv,ov.cpv,sW,170);
      const tipLines=[{key:c.key,color:CHART_COLOR,name:c.lbl,fmt:c.fmt}];
      if(ov.inv) tipLines.push({key:"spend",color:CHART_INV,name:"Investimento",fmt:fBRL});
      if(ov.cpv) tipLines.push({key:"cpv",  color:CHART_CPV,name:"CPV",         fmt:fBRL});
      setupTip(`tc-${c.key}`,`tt-${c.key}`,daily,tipLines,52,ov.inv||ov.cpv?52:12);
    });
  });
}

// ── Render Campanhas + Anúncios (aba unificada) ───────────────────────────
function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;
  const isFeo=S.currentFunil==="feo";
  const _focusedId=document.activeElement?.id; // preserva foco dos inputs de busca
  const dd=D();
  const start=S.startDate, end=S.endDate;

  // ── 0. Mapas compartilhados: identidade, compradores por adId, gasto total por evento ─
  const _identMap=new Map();
  function _getIdKeys(r){
    const ks=[];
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(em) ks.push("e:"+em);
    if(cpf) ks.push("c:"+cpf);
    if(tel) ks.push("t:"+tel);
    return ks;
  }
  for(const r of dd.funilRows){
    const ks=_getIdKeys(r);if(!ks.length)continue;
    let canonical=null;
    for(const k of ks){if(_identMap.has(k)){canonical=_identMap.get(k);break;}}
    if(!canonical) canonical=ks[0];
    for(const k of ks) _identMap.set(k,canonical);
  }
  function _getCanonical(r){
    const ks=_getIdKeys(r);
    for(const k of ks){if(_identMap.has(k)) return _identMap.get(k);}
    return ks[0]||null;
  }
  // adBuyersMap: adId → Set<buyerKey> (compradores do produto PRINCIPAL atribuídos a cada adId)
  // Reto funnel: só "reto"; FEO funnel: só "feo" (Reto upsell não conta como comprador do front-end)
  const primaryProdId=isFeo?"feo":"reto";
  const adBuyersMap=new Map();
  for(const r of dd.funilRows){
    const dt=toISO(r["Data da compra"]||"")||"";
    if(dt<start||dt>end) continue;
    if((r["Status da compra"]||"").trim()!=="Paga") continue;
    if(classifyProduct(r["Nome do produto"]||"",isFeo?"feo":"reto")!==primaryProdId) continue;
    const adId=extractAdId(r["Ad Id"]||"");if(!adId)continue;
    const key=_getCanonical(r);if(!key)continue;
    if(!adBuyersMap.has(adId)) adBuyersMap.set(adId,new Set());
    adBuyersMap.get(adId).add(key);
  }
  // buyerTotalSpent: buyerKey → receita total do comprador (Reto + Cero + Mapa)
  // Sem filtro de data para capturar upsells que ocorrem fora do período
  const buyerTotalSpent=new Map();
  for(const r of dd.funilRows){
    if((r["Status da compra"]||"").trim()!=="Paga") continue;
    const key=_getCanonical(r);if(!key)continue;
    buyerTotalSpent.set(key,(buyerTotalSpent.get(key)||0)+(parseFloat(r["Valor do produto"])||0));
  }

  // ── 1a. País selecionado → countryAllowedIds (deve ser calculado antes de campRows)
  const hasCountryFilter=S.selectedCountry!=="todos";
  let countryAllowedIds=null;
  if(hasCountryFilter){
    const cEntry=dd.metaByCountry[S.selectedCountry];
    countryAllowedIds=cEntry?new Set([...cEntry.adIds]):new Set();
  }

  // ── 1b. Métricas por país (período filtrado) para a tabela de países ────
  const countryStats={};
  const countryBuyerSets={};
  for(const [adId,adData] of Object.entries(dd.metaByAdId)){
    const country=adData.country;
    if(!countryStats[country]) countryStats[country]={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0,ic:0};
    for(const [d,vals] of Object.entries(adData.byDate)){
      if(d>=start&&d<=end){
        countryStats[country].spend+=vals.spend;
        countryStats[country].clicks+=vals.clicks;
        countryStats[country].impressions+=vals.impressions;
        countryStats[country].ic+=vals.ic||0;
      }
    }
    const vByD=dd.vendasByAdDate[adId]||{};
    for(const [vd,vv] of Object.entries(vByD)){
      if(vd>=start&&vd<=end) countryStats[country].qtd+=vv.qtd;
    }
    if(!countryBuyerSets[country]) countryBuyerSets[country]=new Set();
    for(const ek of (adBuyersMap.get(adId)||new Set())) countryBuyerSets[country].add(ek);
  }
  for(const [country,keys] of Object.entries(countryBuyerSets)){
    if(!countryStats[country]) countryStats[country]={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0};
    for(const ek of keys) countryStats[country].funilRev+=(buyerTotalSpent.get(ek)||0);
  }

  // ── 1c. Constrói linhas de campanha (filtradas por país quando necessário)
  const campRows=[];
  for(const [campName,meta] of Object.entries(dd.metaByCamp)){
    const byDate=dd.metaByCampByDate[campName]||{};
    // Coleta adIds do período
    const adIdsPeriod=new Set();
    for(const [d,vals] of Object.entries(byDate)){
      if(d>=start&&d<=end) vals.adIds.forEach(id=>adIdsPeriod.add(id));
    }
    // Filtra por país se necessário
    const adIdsC=countryAllowedIds
      ? new Set([...adIdsPeriod].filter(id=>countryAllowedIds.has(id)))
      : adIdsPeriod;
    if(adIdsC.size===0) continue;
    // Spend/clicks/impressions — recalcula por adId quando país filtrado
    let cSpend=0,cClicks=0,cImpr=0,cIc=0,cLv=0,cChk=0;
    if(countryAllowedIds){
      for(const adId of adIdsC){
        const adData=dd.metaByAdId[adId];if(!adData)continue;
        for(const [d,vals] of Object.entries(adData.byDate)){
          if(d>=start&&d<=end){cSpend+=vals.spend;cClicks+=vals.clicks;cImpr+=vals.impressions;cIc+=vals.ic||0;cLv+=vals.landingViews||0;cChk+=vals.checkouts||0;}
        }
      }
    } else {
      for(const [d,vals] of Object.entries(byDate)){
        if(d>=start&&d<=end){cSpend+=vals.spend;cClicks+=vals.clicks;cImpr+=vals.impressions;cIc+=vals.ic||0;cLv+=vals.landingViews||0;cChk+=vals.checkouts||0;}
      }
    }
    if(cSpend===0) continue;
    let cQtd=0;
    for(const adId of adIdsC){
      const byD=dd.vendasByAdDate[adId]||{};
      for(const [vd,vv] of Object.entries(byD)){
        if(vd>=start&&vd<=end) cQtd+=vv.qtd;
      }
    }
    const campEvKeys=new Set();
    for(const adId of adIdsC){
      for(const ek of (adBuyersMap.get(adId)||new Set())) campEvKeys.add(ek);
    }
    let campFunilRev=0;
    for(const ek of campEvKeys) campFunilRev+=(buyerTotalSpent.get(ek)||0);
    campRows.push({campName,spend:cSpend,clicks:cClicks,impressions:cImpr,
      qtd:cQtd,valor:campFunilRev,
      cpc:cClicks>0?cSpend/cClicks:0,
      ctr:cImpr>0?(cClicks/cImpr)*100:0,
      cpm:cImpr>0?(cSpend/cImpr)*1000:0,
      cpv:cQtd>0?cSpend/cQtd:0,
      roas:cSpend>0?campFunilRev/cSpend:0,
      ticket:cQtd>0?campFunilRev/cQtd:0,
      ic:cIc, cpic:cIc>0?cSpend/cIc:0,
      connect:cClicks>0?(cLv/cClicks)*100:0,
      txPagChk:cLv>0?(cChk/cLv)*100:0,
      txChkVnd:cChk>0?(cQtd/cChk)*100:0,
      campStatus:dd.metaByCamp[campName]?.campStatus||'',
      adIds:adIdsC});
  }
  const {col:cCol,dir:cDir}=S.cSort;
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol]??0,bv=b[cCol]??0;
    if(typeof av==="string") return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });
  const filteredCamps=S.campSearch.trim()
    ? sortedCamps.filter(c=>c.campName.toLowerCase().includes(S.campSearch.trim().toLowerCase()))
    : sortedCamps;
  S._campOrder=filteredCamps.map(r=>r.campName);

  // ── 2. allowedAdIds: campRows já está filtrado por país, então a interseção é automática
  const hasFilter=S.selectedCamps.size>0;
  let allowedAdIds=null;
  if(hasFilter){
    allowedAdIds=new Set();
    for(const c of campRows){
      if(S.selectedCamps.has(c.campName)) c.adIds.forEach(id=>allowedAdIds.add(id));
    }
    // campRows.adIds já foram intersectados com countryAllowedIds, não precisa reintersectar
  } else if(countryAllowedIds){
    allowedAdIds=countryAllowedIds;
  }

  // ── 3. Constrói linhas de anúncios ──────────────────────────────────────
  function buildAdRows(start,end,allowedAdIds){
    const rows=[];
    for(const [advCode,meta] of Object.entries(dd.metaByAd)){
      const byDate=dd.metaByAdByDate[advCode]||{};

      // Coleta todos os adIds deste advCode dentro do período
      const adIdsInPeriod=new Set();
      for(const [d,vals] of Object.entries(byDate)){
        if(d>=start&&d<=end) vals.adIds.forEach(id=>adIdsInPeriod.add(id));
      }
      const allIds=adIdsInPeriod.size>0?adIdsInPeriod:meta.adIds;

      // Quando há filtro de campanha, restringe aos adIds permitidos
      const useIds=allowedAdIds
        ? new Set([...allIds].filter(id=>allowedAdIds.has(id)))
        : allIds;
      if(useIds.size===0) continue;

      // Spend / clicks / impressions — calculado a partir dos adIds filtrados
      let spend=0,clicks=0,impressions=0,ic=0,video3s=0,video15s=0,landingViews=0,checkouts=0,igUrl="";
      if(allowedAdIds){
        // Usa metaByAdId para precisão por campanha
        for(const adId of useIds){
          const adData=dd.metaByAdId[adId];if(!adData)continue;
          for(const [d,vals] of Object.entries(adData.byDate)){
            if(d>=start&&d<=end){
              spend+=vals.spend;clicks+=vals.clicks;impressions+=vals.impressions;
              ic+=vals.ic||0;video3s+=vals.video3s||0;video15s+=vals.video15s||0;
              landingViews+=vals.landingViews||0;checkouts+=vals.checkouts||0;
              if(!igUrl&&vals.igUrl) igUrl=vals.igUrl;
            }
          }
        }
      } else {
        // Sem filtro: usa o agregado por advCode (mais eficiente)
        for(const [d,vals] of Object.entries(byDate)){
          if(d>=start&&d<=end){
            spend+=vals.spend;clicks+=vals.clicks;impressions+=vals.impressions;
            ic+=vals.ic||0;video3s+=vals.video3s||0;video15s+=vals.video15s||0;
            landingViews+=vals.landingViews||0;checkouts+=vals.checkouts||0;
            if(!igUrl&&vals.igUrl) igUrl=vals.igUrl;
          }
        }
      }
      if(spend===0) continue;

      // Vendas (já são por adId — basta filtrar pelos adIds certos)
      let qtd=0,valor=0,taxa=0;
      for(const adId of useIds){
        const byD=dd.vendasByAdDate[adId]||{};
        for(const [vd,vvals] of Object.entries(byD)){
          if(vd>=start&&vd<=end){qtd+=vvals.qtd;valor+=vvals.valor;taxa+=vvals.taxa;}
        }
      }
      if(!igUrl) igUrl=meta.igUrl;

      // Status: ativo se qualquer adId tiver ad+adset+camp todos ACTIVE
      let isActive=false, hasStatusData=false;
      for(const adId of useIds){
        const adData=dd.metaByAdId[adId];
        if(!adData) continue;
        if(adData.adStatus) hasStatusData=true;
        if(adData.adStatus==="ACTIVE"&&adData.adsetStatus==="ACTIVE"&&adData.campStatus==="ACTIVE"){
          isActive=true; break;
        }
      }

      // Ticket ascensão (funil completo, sem filtro de data)
      let totalAscensoes=0;
      for(const adId of useIds){
        for(const eventKey of (adBuyersMap.get(adId)||new Set())){
          totalAscensoes+=(buyerTotalSpent.get(eventKey)||0);
        }
      }
      rows.push({advCode,adName:dd.metaByAd[advCode]?.adName||advCode,campName:dd.metaByAd[advCode]?.campName||"",spend,clicks,impressions,qtd,valor,igUrl,
        cpc:clicks>0?spend/clicks:0,
        ctr:impressions>0?(clicks/impressions)*100:0,
        cpm:impressions>0?(spend/impressions)*1000:0,
        cpv:qtd>0?spend/qtd:0,
        ticket:qtd>0?valor/qtd:0,
        ticketAsc:qtd>0?totalAscensoes/qtd:0,
        roas:spend>0&&totalAscensoes>0?totalAscensoes/spend:0,
        ic, cpic:ic>0?spend/ic:0,
        connect:clicks>0?(landingViews/clicks)*100:0,
        txPagChk:landingViews>0?(checkouts/landingViews)*100:0,
        txChkVnd:checkouts>0?(qtd/checkouts)*100:0,
        hookRate:impressions>0?(video3s/impressions)*100:0,
        holdRate:video3s>0?(video15s/video3s)*100:0,
        isActive, hasStatusData});
    }
    return rows.filter(r=>r.spend>0);
  }

  const adRows=buildAdRows(start,end,allowedAdIds);

  // ── 4. Totais KPI (do período filtrado) ─────────────────────────────────
  // Se há filtro de campanhas, agrega só das campanhas selecionadas; caso contrário usa dados diários
  let tot;
  if(hasFilter){
    tot=campRows.filter(c=>S.selectedCamps.has(c.campName))
      .reduce((a,c)=>({spend:a.spend+c.spend,clicks:a.clicks+c.clicks,
        impressions:a.impressions+c.impressions,qtd:a.qtd+c.qtd,valor:a.valor+c.valor}),
        {spend:0,clicks:0,impressions:0,qtd:0,valor:0});
  } else {
    const _da=D();
    const dailyA=[];
    for(const d of Array.from(new Set([...Object.keys(_da.meta),...Object.keys(_da.vendas)])).sort()){
      if(d<start||d>end) continue;
      const m=_da.meta[d]||{spend:0,clicks:0,impressions:0};
      const v=_da.vendas[d]||{qtd:0,valor:0};
      dailyA.push({spend:m.spend,clicks:m.clicks,impressions:m.impressions,qtd:v.qtd,valor:v.valor});
    }
    tot=dailyA.reduce((a,d)=>({spend:a.spend+d.spend,clicks:a.clicks+d.clicks,
      impressions:a.impressions+d.impressions,qtd:a.qtd+d.qtd,valor:a.valor+d.valor}),
      {spend:0,clicks:0,impressions:0,qtd:0,valor:0});
  }
  const totCpc=tot.clicks>0?tot.spend/tot.clicks:0;
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;
  const totCpm=tot.impressions>0?(tot.spend/tot.impressions)*1000:0;
  const totCpv=tot.qtd>0?tot.spend/tot.qtd:0;
  const totTicket=tot.qtd>0?tot.valor/tot.qtd:0;
  {
    const _dd=D();const _pId="reto";
    const _bSpent=new Map(),_bPrinc=new Set();
    for(const r of _dd.funilRows){
      const dt=toISO(r["Data da compra"]||"")||"";
      if(dt<start||dt>end) continue;
      if((r["Status da compra"]||"").trim()!=="Paga") continue;
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const id=em||cpf||tel;if(!id) continue;
      _bSpent.set(id,(_bSpent.get(id)||0)+(parseFloat(r["Valor do produto"])||0));
      if(classifyProduct(r["Nome do produto"]||"",_pId)===_pId) _bPrinc.add(id);
    }
    let _fat=0;for(const k of _bPrinc)_fat+=(_bSpent.get(k)||0);
    var totTicketAsc=_bPrinc.size>0?_fat/_bPrinc.size:0;
  }

  // ── 5. Ordenação anúncios ────────────────────────────────────────────────
  const {col,dir}=S.aSort;
  const sorted=[...adRows].sort((a,b)=>{
    const av=a[col]??0,bv=b[col]??0;
    if(typeof av==="string") return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });
  const filteredAds=S.adSearch.trim()
    ? sorted.filter(r=>r.advCode.toLowerCase().includes(S.adSearch.trim().toLowerCase()))
    : sorted;
  S._adOrder=filteredAds.map(r=>r.advCode);

  function sc(v,meta,hi){return (meta===null)?"var(--text)":statusColor(v,meta,hi);}
  function sb(v,meta,hi){return (meta===null)?"var(--border)":statusBorder(v,meta,hi);}

  function thC(col_,lbl,sortFn){
    const active=(sortFn==="camp"?cCol:col)===col_;
    const activeDir=sortFn==="camp"?cDir:dir;
    const arrow=active?(activeDir==="asc"?" ↑":" ↓"):" ↕";
    const fn=sortFn==="camp"?`sortCampanhas('${col_}')`:`sortAnuncios('${col_}')`;
    const isName=col_==="campName"||col_==="advCode";
    const align=isName?"left":"right";
    return `<th onclick="${fn}" style="padding:10px 14px;text-align:${align};font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${active?"var(--text)":"var(--hint)"};cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};font-size:9px;margin-left:3px">${arrow}</span></th>`;
  }

  // ── 6. Render ────────────────────────────────────────────────────────────
  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Campanhas / Anúncios</div>

function D(){
  if(S.currentFunil==="feo") return {
    ...S,

    vendasByAd:S.feoVendasByAd, vendasByAdDate:S.feoVendasByAdDate,
    metaByAd:S.feoMetaByAd, metaByAdByDate:S.feoMetaByAdByDate,
    metaByAdId:S.feoMetaByAdId, metaByCamp:S.feoMetaByCamp,
    metaByCampByDate:S.feoMetaByCampByDate, metaByCountry:{},
    funilRows:S.feoFunilRows, funilRowsByTemp:S.feoFunilRowsByTemp,
  };
  return S;
}
function getMetaActive(){
  if(S.currentFunil==="feo") return getFeoMetaActive();
  if(S.retoTempFilter==="todos") return S.meta;
  return S.metaByTemp[S.retoTempFilter]||{};
}
function getFeoMetaActive(){
  const tF=S.feoTempFilter, pF=S.feoPriceFilter;
  if(tF==="todos"&&pF==="todos") return S.feoMeta;
  // Filter dynamically from campByDate, applying both filters
  const res={};
  for(const [camp,byDate] of Object.entries(S.feoMetaByCampByDate)){
    if(tF!=="todos"&&extractTempFromCamp(camp)!==tF) continue;
    if(pF!=="todos"&&extractPriceFromCamp(camp)!==pF) continue;
    for(const [d,m] of Object.entries(byDate)){
      if(!res[d])res[d]={spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,purchases:0};
      res[d].spend+=m.spend;res[d].clicks+=m.clicks;res[d].impressions+=m.impressions;
      res[d].landingViews+=m.landingViews||0;res[d].checkouts+=m.checkouts||0;
    }
  }
  return res;
}
function getFeoVendasActive(){
  const tF=S.feoTempFilter, pF=S.feoPriceFilter;
  if(tF==="todos"&&pF==="todos") return S.feoVendas;

  if(pF!=="todos"){
    // Filtro de preço ativo: usa feoFunilRows que tem _priceTier em TODAS as linhas
    // (UTM primeiro; fallback por valor da compra — inclui vendas sem UTM)
    const res={};
    for(const r of S.feoFunilRows){
      if(classifyProduct(r["Nome do produto"]||"","feo")!=="feo") continue; // só produto principal
      if((r["Status da compra"]||"")!=="Paga") continue;
      if(r._priceTier&&r._priceTier!==pF) continue; // exclui tier errado; null = desconhecido → inclui
      const d=r["Data da compra"]||""; if(!d) continue;
      if(tF!=="todos"){
        // Filtro de temp sobreposto: aplica só a rows com UTM (sem UTM não tem temp)
        const ad=r["Ad Id"]?S.feoMetaByAdId[r["Ad Id"]]:null;
        if(!ad||extractTempFromCamp(ad.campName)!==tF) continue;
      }
      if(!res[d])res[d]={qtd:0,valor:0,taxa:0};
      res[d].qtd+=1;res[d].valor+=(parseFloat(r["Valor do produto"])||0);
    }
    return res;
  }

  // Só filtro de temp (sem preço): usa fvByAdDate (vendas com UTM por adId/data)
  const res={};
  for(const [adId,byDate] of Object.entries(S.feoVendasByAdDate)){
    const ad=S.feoMetaByAdId[adId]; if(!ad) continue;
    if(extractTempFromCamp(ad.campName)!==tF) continue;
    for(const [d,vv] of Object.entries(byDate)){
      if(!res[d])res[d]={qtd:0,valor:0,taxa:0};
      res[d].qtd+=vv.qtd;res[d].valor+=vv.valor;
    }
  }
  return res;
}
function getFeoFunilRows(){
  const tF=S.feoTempFilter, pF=S.feoPriceFilter;
  let rows=tF==="todos"?S.feoFunilRows:(S.feoFunilRowsByTemp[tF]||[]);
  if(pF!=="todos") rows=rows.filter(r=>{
    // Todos os rows agora têm _priceTier: UTM primeiro, fallback por valor
    // Se _priceTier desconhecido, inclui (buyer matching em buildFunilData garante correção)
    return !r._priceTier || r._priceTier===pF;
  });
  return rows;
}
function getFeoDaily(start,end){
  const metaA=getFeoMetaActive(), vA=getFeoVendasActive();
  const all=new Set([...Object.keys(metaA),...Object.keys(vA)]);
  return Array.from(all).sort().filter(dt=>dt>=start&&dt<=end).map(date=>{
    const m=metaA[date]||{spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,purchases:0};
    const v=vA[date]||{qtd:0,valor:0,taxa:0};
    return{date,label:fDate(date),spend:m.spend,faturamento:v.valor,vendas:v.qtd,
      gerenciador:m.purchases||0,
      roas:m.spend>0?v.valor/m.spend:0,cpv:v.qtd>0?m.spend/v.qtd:0,
      ticket:v.qtd>0?v.valor/v.qtd:0,lucro:v.valor-(m.spend*TAXA_IMPOSTO)};
  });
}
function getFeoTotals(daily){
  const vA=getFeoVendasActive();
  const t=daily.reduce((a,dt)=>({spend:a.spend+dt.spend,fat:a.fat+dt.faturamento,vendas:a.vendas+dt.vendas,
    taxa:a.taxa+(vA[dt.date]?.taxa||0)}),{spend:0,fat:0,vendas:0,taxa:0});
  return{...t,faturamento:t.fat,
    roas:t.spend>0?t.fat/t.spend:0,cpv:t.vendas>0?t.spend/t.vendas:0,
    ticket:t.vendas>0?t.fat/t.vendas:0,lucro:t.fat-t.taxa-(t.spend*TAXA_IMPOSTO)};
}
function getFeoDailyT(start,end){
  const metaA=getFeoMetaActive(), vA=getFeoVendasActive();
  return Object.keys(metaA).sort().filter(dt=>dt>=start&&dt<=end).map(date=>{
    const m=metaA[date];
    const v=vA[date]||{qtd:0};
    return{date,label:fDate(date),spend:m.spend,cpv:v.qtd>0?m.spend/v.qtd:0,
      cpc:m.clicks>0?m.spend/m.clicks:0,ctr:m.impressions>0?(m.clicks/m.impressions)*100:0,
      cpm:m.impressions>0?(m.spend/m.impressions)*1000:0,
      txPagChk:m.landingViews>0?(m.checkouts/m.landingViews)*100:0,
      txChkVnd:m.checkouts>0?(v.qtd/m.checkouts)*100:0,
      connect:m.clicks>0?(m.landingViews/m.clicks)*100:0,
      clicks:m.clicks,impressions:m.impressions,landingViews:m.landingViews,
      checkouts:m.checkouts,vendas:v.qtd};
  });
}
function getFeoTotalsT(daily){ return getTotalsT(daily); }

function classifyProduct(name, funil){
  if(!name) return null;
  const n=name.toUpperCase();
  if(funil==="feo"){
    if(n.includes("FEO")||n.includes("FINANZ")) return "feo";
    if(n.includes("RETO")) return "reto";
    return null;
  }
  if(n.includes("RETO")) return "reto";
  if(n.includes("CERO")) return "cero";
  if(n.includes("MAPA")) return "mapa";
  return null;
}

// Deduplicação de eventos webhook:
// Mesma pessoa + mesmo produto + dentro de 7 dias → mantém o mais recente por data/hora
// Se data/hora igual → hierarquia: Reembolsado > Aguardando Reembolso > Paga > Em Recuperacao > Expirado > outros
function deduplicateFunilRows(rows){
  const STATUS_PRIORITY={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
  function sp(st){ return STATUS_PRIORITY[st]||0; }

  // Chave: email+cpf+tel+produto+janela7dias
  // Agrupa por chave e mantém o de maior prioridade/data
  const groups=new Map();
  for(const r of rows){
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    const prod=(r["Nome do produto"]||"").trim().toUpperCase();
    const dataBruta=r["Data da compra"]||"";
    const dateStr=toISO(dataBruta)||"";
    const identity=em||cpf||tel;
    if(!identity||!prod||!dateStr) { /* sem chave — adiciona direto */ groups.set(Math.random().toString(),r); continue; }

    // Encontra grupo existente com mesma identidade + produto dentro de 7 dias
    let found=null;
    for(const [k,g] of groups){
      if(!g._identity||!g._prod) continue;
      if(g._prod!==prod) continue;
      // verifica identidade
      const gEm=(g["Email"]||"").toLowerCase().trim();
      const gCpf=(g["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const gTel=(g["Telefone"]||"").replace(/[^\d]/g,"");
      const identMatch=(em&&gEm&&em===gEm)||(cpf&&gCpf&&cpf===gCpf)||(tel&&gTel&&tel===gTel);
      if(!identMatch) continue;
      // verifica janela 7 dias
      const d1=new Date((g._dateStr||"")+"T12:00:00Z");
      const d2=new Date(dateStr+"T12:00:00Z");
      const diffDays=Math.abs((d2-d1)/(86400000));
      if(diffDays<=7){ found=k; break; }
    }

    const rWithMeta={...r,_identity:identity,_prod:prod,_dateStr:dateStr};
    if(found){
      const existing=groups.get(found);
      // Mantém o mais recente; se empate, maior prioridade de status
      const existDate=existing._dateStr||"";
      const newDate=dateStr;
      const existSP=sp(existing["Status da compra"]||"");
      const newSP=sp(r["Status da compra"]||"");
      if(newDate>existDate||(newDate===existDate&&newSP>existSP)){
        groups.set(found,rWithMeta);
      }
    } else {
      groups.set(Math.random().toString(),rWithMeta);
    }
  }
  return Array.from(groups.values());
}

function buildFunilData(rows, start, end, funil){
  const f=funil||"reto";
  const primaryId=getFunilSteps(f)[0].id; // produto de entrada do funil
  // filtered: só para análise de status/perdas — respeita período
  const filtered = rows.filter(r=>{
    if(!start && !end) return true;
    const d = toISO(r["Data da compra"]||r["Data"]);
    if(!d) return true;
    if(start && d<start) return false;
    if(end   && d>end)   return false;
    return true;
  });

  // Para buyers: usa TODAS as linhas (sem filtro de período)
  // O período só controla se a compra entra nos totais, não quem é o comprador
  const allRows = rows;

  // Agrupa por comprador (e-mail + cpf + telefone)
  // Identifica o comprador único
  function buyerKey(r){
    // Retorna chaves únicas: cada campo é prefixado para evitar colisão entre email/cpf/tel
    const keys=[];
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(em)  keys.push("e:"+em);
    if(cpf) keys.push("c:"+cpf);
    if(tel) keys.push("t:"+tel);
    return keys;
  }

  // Mapeia comprador -> conjunto de produtos comprados com data
  // Estrutura: {keys: Set, products: [{id, date, valor, status}]}
  const buyers = new Map(); // normalizedKey -> buyer obj

  function getOrCreate(r){
    const keys = buyerKey(r);
    // procura buyer existente que compartilhe pelo menos 1 chave
    for(const [k,b] of buyers){
      for(const key of keys){
        if(key && b.keys.has(key)){
          // adiciona as novas keys a esse buyer
          keys.forEach(k2=>{ if(k2) b.keys.add(k2); });
          return b;
        }
      }
    }
    // novo buyer
    const b={keys:new Set(keys.filter(Boolean)), products:[]};
    const mapKey = keys[0] || Math.random().toString();
    buyers.set(mapKey, b);
    return b;
  }

  for(const r of allRows){
    const prodId = classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const buyer = getOrCreate(r);
    const d = toISO(r["Data da compra"]||r["Data"]) || "";
    const status = normalizeStatus((r["Status da compra"]||"").trim());
    const valor  = (parseFloat(r["Valor do produto"])||0);
    const taxa   = parseBRLAbs(r["Taxa da plataforma"]);
    buyer.products.push({id:prodId, date:d, status, valor, taxa});
  }

  // Conta: só conta produtos comprados APÓS a primeira compra do manual (status Paga)
  const counts = {};
  const fat    = {};
  const taxa   = {};
  getFunilSteps(f).forEach(s=>{ counts[s.id]=0; fat[s.id]=0; taxa[s.id]=0; });

  // Status analysis
  const statusCounts = {};
  const statusVals   = {};
  const statusByProd = {};
  getFunilSteps(f).forEach(s=>{ statusByProd[s.id]={}; });

  // All rows for status analysis (sem filtro de funil)
  for(const r of filtered){
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    const val=(parseFloat(r["Valor do produto"])||0);
    statusCounts[st]=(statusCounts[st]||0)+1;
    statusVals[st]=(statusVals[st]||0)+val;
    if(!statusByProd[prodId]) statusByProd[prodId]={};
    statusByProd[prodId][st]=(statusByProd[prodId][st]||0)+1;
  }

  // Funil: só Paga, dentro do período
  // OBs de faturamento (produto principal + OBs diretos)
  const OB_FAT_IDS = new Set([primaryId]);

  // Passo 1: agrupa por comprador+data para calcular faturamento do produto principal
  // (evita duplicatas entre webhook e histórica)
  {
    const ST_PRI={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
    const grupos=new Map();
    for(const r of filtered){
      const prodId=classifyProduct(r["Nome do produto"],f);
      if(!OB_FAT_IDS.has(prodId)) continue; // só produto principal + OBs diretos aqui
      const st=normalizeStatus((r["Status da compra"]||"").trim());
      if(!st) continue;
      const d=toISO(r["Data da compra"]||r["Data"])||"";
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const identity=em||cpf||tel;
      // Fallback: se não há identity (sheet sem data.buyer.email/tel), usa order_date como chave única
      // (parseHotmartRows já deduplica por order_date, então não conta duplicatas)
      const orderKey=r._orderDate||"";
      const key=identity?identity+"|"+d:(orderKey?"_ord_"+orderKey:null);
      if(!key) continue;
      if(!grupos.has(key)) grupos.set(key,{st,d,valor:0,taxa:0,hasPrimary:false,obCounts:{}});
      const g=grupos.get(key);
      if((ST_PRI[st]||0)>(ST_PRI[g.st]||0)) g.st=st;
      if(prodId===primaryId) g.hasPrimary=true;
      if(st==="Paga"){
        g.valor += (parseFloat(r["Valor do produto"])||0);
        g.taxa  += parseBRLAbs(r["Taxa da plataforma"]);
        // Conta cada OB individualmente dentro do grupo
        if(prodId!==primaryId) g.obCounts[prodId]=(g.obCounts[prodId]||0)+1;
      }
    }
    for(const [,g] of grupos){
      if(!g.hasPrimary || g.st!=="Paga") continue;
      counts[primaryId]++;
      fat[primaryId] += g.valor;
      taxa[primaryId]+= g.taxa;
      // Contagem dos OBs desta transação
      for(const [obId, obQtd] of Object.entries(g.obCounts)){
        counts[obId]=(counts[obId]||0)+obQtd;
      }
    }
  }

  // Passo 2: upsell e ascensão (planLucro, curso) — por comprador, após produto principal
  for(const [,buyer] of buyers){
    const paid = buyer.products.filter(p=>p.status==="Paga");
    const mainPurchases = paid.filter(p=>p.id===primaryId).sort((a,b)=>a.date.localeCompare(b.date));
    if(!mainPurchases.length) continue;
    const mainDate = mainPurchases[0].date;
    const others = paid.filter(p=>{
      if(OB_FAT_IDS.has(p.id)) return false; // OBs já contados acima
      // Tolerância de 1 dia: order bumps são simultâneos mas Hotmart pode gravar
      // o upsell como data local do comprador (ex: México GMT-6) e o principal como UTC,
      // resultando em 1 dia de diferença aparente.
      if(p.date < subDays(mainDate,1)) return false;
      if(start && p.date < start) return false;
      if(end   && p.date > end)   return false;
      return true;
    });
    for(const p of others){
      counts[p.id]=(counts[p.id]||0)+1;
      fat[p.id]=(fat[p.id]||0)+p.valor;
      taxa[p.id]=(taxa[p.id]||0)+(p.taxa||0);
    }
  }

  const manualCount = counts[primaryId] || 1;
  const totalFat  = Object.values(fat).reduce((a,b)=>a+b,0);
  // Taxa Eduzz: inclui Paga + Reembolsado + Aguardando Reembolso
  // (Eduzz cobra taxa mesmo em reembolsos)
  const totalTaxaPaga = Object.values(taxa).reduce((a,b)=>a+b,0);
  let totalTaxaReemb = 0;
  for(const r of filtered){
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    if(st!=="Reembolsado" && st!=="Aguardando Reembolso") continue;
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    totalTaxaReemb += parseBRLAbs(r["Taxa da plataforma"]);
  }
  const totalTaxa = totalTaxaPaga + totalTaxaReemb;

  // Spend no período — respeita filtro de temperatura via getMetaActive()
  let totalSpend=0;
  const _metaD=getMetaActive();
  for(const d of Object.keys(_metaD)){
    if(start && d<start) continue;
    if(end   && d>end)   continue;
    totalSpend+=_metaD[d].spend||0;
  }

  return {
    counts, fat, manualCount, totalFat, totalSpend, buyers,
    roas: totalSpend>0 ? totalFat/totalSpend : 0,
    ltv:  totalFat/manualCount,
    lucro: totalFat - totalTaxa - (totalSpend*TAXA_IMPOSTO),
    taxaAscensao: (function(){
      const _upsell1Id=getFunilSteps(f)[1]?.id;
      if(!manualCount||!_upsell1Id) return 0;
      let cnt=0;
      for(const [,buyer] of buyers){
        const paid=buyer.products.filter(p=>p.status==="Paga");
        // compra do produto principal deve estar dentro do período filtrado
        const mp=paid.filter(p=>p.id===primaryId
          &&(!start||p.date>=start)&&(!end||p.date<=end))
          .sort((a,b)=>a.date.localeCompare(b.date))[0];
        if(!mp) continue;
        const ascendeu=paid.some(p=>p.id===_upsell1Id&&p.date>=mp.date);
        if(ascendeu) cnt++;
      }
      return (cnt/manualCount)*100;
    })(),
    taxaMapa: (function(){
      const _upsell1Id=getFunilSteps(f)[1]?.id;
      const _upsell2Id=getFunilSteps(f)[2]?.id;
      const upsell1Count=counts[_upsell1Id||""]||0;
      if(!_upsell2Id||!upsell1Count) return 0;
      let cnt=0;
      for(const [,buyer] of buyers){
        const paid=buyer.products.filter(p=>p.status==="Paga");
        // compra do upsell1 deve estar dentro do período filtrado
        const cp=paid.filter(p=>p.id===_upsell1Id
          &&(!start||p.date>=start)&&(!end||p.date<=end))
          .sort((a,b)=>a.date.localeCompare(b.date))[0];
        if(!cp) continue;
        const comprou=paid.some(p=>p.id===_upsell2Id&&p.date>=cp.date);
        if(comprou) cnt++;
      }
      return (cnt/upsell1Count)*100;
    })(),
    statusCounts, statusVals, statusByProd, buyers,
  };
}

    _funilRows=S.retoTempFilter==="todos"?_dd.funilRows:(S.funilRowsByTemp[S.retoTempFilter]||[]);
  }

  let fd;
  try{ fd=buildFunilData(_funilRows,S.startDate||"",S.endDate||"",funil); }

  const {counts,fat,manualCount,totalFat,totalSpend,roas,ltv,lucro,taxaAscensao,taxaMapa,statusCounts,statusVals}=fd;

  const steps=getFunilSteps(funil);
  const [s0,s1,s2]=steps;
  const cnt0=counts[s0.id]||0;
  const cnt1=s1?counts[s1.id]||0:0;
  const cnt2=s2?counts[s2.id]||0:0;
  const pct1=cnt0>0?(cnt1/cnt0)*100:0;
  const pct2=cnt1>0?(cnt2/cnt1)*100:0;

  const roasC=statusColor(roas,META_ROAS,true);
  const lucroC=lucro>=0?"var(--green)":"var(--red)";

  const qtdReemb=(statusCounts["Reembolsado"]||0)+(statusCounts["Aguardando Reembolso"]||0);
  const valReemb=(statusVals["Reembolsado"]||0)+(statusVals["Aguardando Reembolso"]||0);
  const qtdAbrt=statusCounts["Aberta"]||0;
  const valAbrt=statusVals["Aberta"]||0;
  const pctReemb=totalFat>0?(valReemb/totalFat)*100:0;

  // Funil SVG — dark theme

  if(s2) svgSteps.push({...s2,count:cnt2,fat:fat[s2.id]||0,w:Math.max(SW*(pct2/100)*(pct1/100),30),pct:`${pct2.toFixed(1)}% dos compradores ${s1?.label||""}`});
  const SH=svgSteps.length*(BH+GAP)-GAP;
  let svgBlocks="";
  svgSteps.forEach((s,i)=>{
    const y=i*(BH+GAP);
    const x=(SW-s.w)/2;

      <rect x="${x.toFixed(1)}" y="${y}" width="${s.w.toFixed(1)}" height="${BH}" rx="10" fill="${s.fill}" fill-opacity="0.85"/>
      <text x="${SW/2}" y="${y+18}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="${s.text}" opacity="0.65">${s.step}</text>

  });

  // Analytics
  window.setAnaTab=t=>{S.aTab=t;renderFunil();};
  const tabs=[{k:"tempo",l:"Evolução mensal"},{k:"status",l:"Status / Perdas"}];

        </tbody></table>`;
