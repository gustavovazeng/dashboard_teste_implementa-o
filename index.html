<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cristiano — Sessão Estratégica — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── App Header ─────────────────────────────────────────────────── */
.app-hdr{position:sticky;top:0;z-index:20;background:rgba(12,17,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 26px;height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}

/* Funil dropdown */
.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surf);cursor:pointer;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;transition:border-color .15s}
.funil-btn:hover{border-color:var(--border-h)}
.funil-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;color:var(--green);letter-spacing:.04em}
.funil-chevron{color:var(--muted);font-size:10px;margin-left:2px}
.funil-menu{position:absolute;top:calc(100% + 6px);left:0;background:#1a2236;border:1px solid var(--border-h);border-radius:10px;padding:4px;min-width:200px;box-shadow:0 6px 30px rgba(2,6,20,.45);z-index:100}
.funil-opt{padding:8px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all .12s;display:flex;align-items:center;gap:8px}
.funil-opt:hover{background:var(--accent-bg);color:var(--text)}
.funil-opt.fopt-active{background:var(--accent-bg);color:#cfe0ff}
.fopt-dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.funil-opt.fopt-active .fopt-dot{background:var(--green)}
.funil-soon{padding:8px 12px;font-size:10px;color:var(--hint);font-style:italic}

/* Nav tabs */
.hdr-tabs{display:flex;align-items:center;gap:4px}
.htab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap}
.htab:hover{color:var(--text)}
.htab.htab-active{background:rgba(59,130,246,.16);color:#fff}
.htab-icon{font-size:13px}

/* Period controls */
.hdr-right{display:flex;align-items:center;gap:8px}
.presets{display:flex;gap:4px}
.btn-pre{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .12s;white-space:nowrap}
.btn-pre:hover{border-color:var(--border-h);color:var(--text)}
.btn-pre.on{background:rgba(59,130,246,.16);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}
.drbox{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s;padding:0 6px;gap:3px}
.drbox:focus-within{border-color:rgba(96,165,250,.5)}
.drbox-icon{color:var(--hint);font-size:12px;user-select:none}
.drbox input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:5px 4px;cursor:pointer;color-scheme:dark;width:100px}
.drbox-sep{color:var(--hint);font-size:11px;user-select:none}
.btn-update{background:rgba(59,130,246,.16);border:1px solid rgba(96,165,250,.3);color:#60a5fa;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap;box-shadow:0 0 16px rgba(59,130,246,.2)}
.btn-update:hover:not(:disabled){box-shadow:0 0 16px rgba(59,130,246,.4)}
.btn-update:disabled{opacity:.4;cursor:not-allowed}

/* ─── Content ────────────────────────────────────────────────────── */
.app-content{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}

/* Page header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.hdr-title{font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text-strong);line-height:1.25}
.hdr-sub{margin-top:5px;font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace}
.err{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--red);line-height:1.5}

/* KPIs */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.kc:hover{border-color:var(--border-h)}
.kc-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.kc-val{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.1;color:var(--text-strong)}
.kc-val-sm{font-size:18px}
.kc-sub{font-size:10px;color:var(--hint);margin-top:5px;font-family:'JetBrains Mono',monospace}
.kc-date{font-size:9px;color:var(--hint);margin-bottom:4px;font-family:'JetBrains Mono',monospace;font-weight:500}

/* Section label */
.section-lbl{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:20px}

/* Status legend */
.status-legend{display:flex;gap:16px;margin-bottom:14px}
.sl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--hint)}
.sl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Charts */
.cc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ll{width:14px;height:2px;border-radius:2px}
.ld{width:7px;height:7px;border-radius:50%}
.charts-2x2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
.charts-2x3{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}

/* Toggle overlay buttons */
.overlay-btns{display:flex;gap:6px}
.btn-overlay{font-size:10px;padding:3px 10px;border-radius:5px;border:1px solid var(--border-h);color:var(--muted);background:transparent;cursor:pointer;transition:all .12s;font-family:'DM Sans',sans-serif}
.btn-overlay:hover{border-color:var(--accent);color:var(--text)}
.btn-overlay.on{background:var(--accent-bg);border-color:rgba(96,165,250,.4);color:#60a5fa;font-weight:600}

/* Tooltip */
.tip{background:#1a2236;border:1px solid var(--border-h);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 4px 16px rgba(2,6,20,.45);display:none;position:absolute;pointer-events:none;z-index:20;min-width:150px}
.tl{color:var(--hint);margin-bottom:5px;font-weight:500;font-size:10px;font-family:'JetBrains Mono',monospace}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;font-size:11px}
.tv{color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace}

/* Spinner */
.sw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.sp{width:32px;height:32px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{color:var(--hint);font-size:13px}
.foot{margin-top:18px;font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace;opacity:.5}
canvas{display:block}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer;filter:invert(1)}

/* Quick period inside pages (funil / análise) */
.period-wrap{margin-bottom:18px}
.period-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.period-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.drbox-sm{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:7px;overflow:hidden;gap:2px;padding:0 5px}
.drbox-sm input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 4px;cursor:pointer;color-scheme:dark;width:96px}
.period-quick{display:flex;gap:5px;flex-wrap:wrap}
.btn-q{background:transparent;border:1px solid var(--border);color:var(--hint);padding:4px 11px;border-radius:6px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:all .12s;white-space:nowrap}
.btn-q:hover{border-color:var(--border-h);color:var(--text)}
.btn-q.on{background:var(--accent-bg);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}

/* Análise sub-tabs */
.ana-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;gap:0}
.ana-tab{padding:7px 14px;font-size:11px;font-weight:500;color:var(--hint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.ana-tab:hover{color:var(--text)}
.ana-tab.active{color:#60a5fa;border-bottom-color:#3b82f6}

/* ─── Mobile Responsive ────────────────────────────────────────── */
@media(max-width:768px){
  /* ── Header ── */
  .app-hdr{
    height:auto;flex-wrap:wrap;
    padding:0;gap:0;align-items:stretch;
  }
  .funil-wrap{
    padding:9px 14px;flex-shrink:0;
    border-bottom:1px solid var(--border);
    width:auto;
  }
  .hdr-right{
    order:2;flex:1;min-width:0;
    display:flex;align-items:center;gap:6px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding:8px 14px 8px 8px;flex-wrap:nowrap;
    border-bottom:1px solid var(--border);
  }
  .hdr-right::-webkit-scrollbar{display:none}
  .presets{flex-wrap:nowrap;gap:3px}
  .btn-pre{font-size:10px;padding:4px 8px;flex-shrink:0}
  .drbox{flex-shrink:0}
  .drbox input[type=date]{width:86px;font-size:10px}
  .btn-update{font-size:11px;padding:5px 10px;flex-shrink:0}
  .hdr-tabs{
    order:3;width:100%;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    flex-wrap:nowrap;gap:2px;
    padding:6px 14px 8px;
  }
  .hdr-tabs::-webkit-scrollbar{display:none}
  .htab{flex-shrink:0;font-size:11px;padding:5px 10px}
  .htab-icon{font-size:12px}

  /* ── Content ── */
  .app-content{padding:14px 10px 30px;max-width:100%}
  .hdr{flex-direction:column;gap:6px;margin-bottom:14px}
  .hdr-title{font-size:18px}

  /* ── KPI Grids ── */
  .g3,.g4,.g5{
    grid-template-columns:repeat(2,1fr)!important;
    gap:8px!important;
  }
  .kc{padding:12px 13px}
  .kc-val{font-size:18px}
  .kc-val-sm{font-size:15px}

  /* ── Inline repeat grids (render functions) ── */
  [style*="repeat(3,1fr)"],[style*="repeat(4,1fr)"],
  [style*="repeat(5,1fr)"],[style*="repeat(6,1fr)"],
  [style*="repeat(7,1fr)"],[style*="repeat(8,1fr)"]{
    grid-template-columns:repeat(2,1fr)!important;
    gap:8px!important;
  }
  /* 2-column side-by-side layouts → single column */
  [style*="1fr 1fr"]{grid-template-columns:1fr!important}
  /* Funil SVG + cards sidebar → stack */
  [style*="1fr 260px"]{grid-template-columns:1fr!important}
  /* Resumo diário 2-col → stack */
  [style*="220px 1fr"]{grid-template-columns:1fr!important}

  /* ── Charts ── */
  .charts-2x2,.charts-2x3{
    grid-template-columns:1fr!important;
    gap:10px!important;
  }

  /* ── Tables: allow horizontal scroll ── */
  .page div[style*="overflow:hidden"]{
    overflow-x:auto!important;
    -webkit-overflow-scrolling:touch;
  }
  .page table{font-size:10px!important}
  .page td,.page th{
    padding:7px 8px!important;
    white-space:nowrap;
  }
  /* First column (names/labels) can wrap */
  .page td:first-child,.page th:first-child{
    white-space:normal;
    min-width:90px;max-width:140px;
  }

  /* ── Status legend ── */
  .status-legend{flex-wrap:wrap;gap:8px}

  /* ── Period quick buttons ── */
  .period-quick{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .period-quick::-webkit-scrollbar{display:none}
  .btn-q{flex-shrink:0;font-size:10px;padding:3px 9px}

  /* ── Ana sub-tabs ── */
  .ana-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap}
  .ana-tabs::-webkit-scrollbar{display:none}
  .ana-tab{flex-shrink:0;font-size:10px;padding:6px 10px}

  /* ── Section label spacing ── */
  .section-lbl{margin-top:16px}
}
</style>
</head>
<body>
<!-- ─── App Header ───────────────────────────────────────────────── -->
<header class="app-hdr">
  <div class="funil-wrap" id="funil-wrap">
    <button class="funil-btn" onclick="toggleFunilMenu(event)">
      <span class="funil-dot" id="funil-dot"></span>
      <div>
        <div class="funil-name" id="funil-name">Cristiano - Sessão Estratégica</div>
        <div class="funil-status" id="funil-status">ativo</div>
      </div>
      <span class="funil-chevron">▾</span>
    </button>
    <div class="funil-menu" id="funil-menu" style="display:none">
      <div class="funil-opt fopt-active" id="fopt-sessao" onclick="setFunil('sessao')">
        <span class="fopt-dot"></span> Cristiano - Sessão Estratégica
      </div>
      <div class="funil-soon">+ Novos funis em breve</div>
    </div>
  </div>
  <nav class="hdr-tabs" id="hdr-tabs">
    <button class="htab htab-active" onclick="navTo('principal')">⊞ Principal</button>
    <button class="htab" onclick="navTo('funil')">▽ Métricas do funil</button>
    <button class="htab" onclick="navTo('trafego')">⟳ Métricas tráfego</button>
    <button class="htab" onclick="navTo('anuncios')">◈ Campanhas / Anúncios</button>
    <button class="htab" onclick="navTo('resumo')">📋 Resumo diário</button>
  </nav>
  <div class="hdr-right">
    <div class="presets" id="hdr-presets">
      <button class="btn-pre" onclick="applyQuickCurrent('hoje')">Hoje</button>
      <button class="btn-pre" onclick="applyQuickCurrent('ontem')">Ontem</button>
      <button class="btn-pre" onclick="applyQuickCurrent('7d')">7 dias</button>
      <button class="btn-pre on" onclick="applyQuickCurrent('30d')">30 dias</button>
      <button class="btn-pre" onclick="applyQuickCurrent('mes')">Este mês</button>
    </div>
    <div class="drbox">
      <span class="drbox-icon">📅</span>
      <input type="date" id="hdr-start" onchange="onDCCurrent('s',this.value)"/>
      <span class="drbox-sep">→</span>
      <input type="date" id="hdr-end" onchange="onDCCurrent('e',this.value)"/>
    </div>
    <button class="btn-update" id="btn-update" onclick="loadData(true)">↻ Atualizar</button>
  </div>
</header>

<div class="app-content">
  <div class="sw" id="loading"><div class="sp"></div><p class="st">Carregando dados...</p></div>
  <div id="err-panel" style="display:none;align-items:flex-start;justify-content:center;padding:40px 24px"></div>
  <div id="page-principal" class="page active"></div>
  <div id="page-funil"     class="page"></div>
  <div id="page-trafego"   class="page"></div>
  <div id="page-anuncios"  class="page"></div>
  <div id="page-resumo"    class="page"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// Dashboard Cristiano — Sessão Estratégica
// Adaptado do modelo "Dashboard TMR Saúde" (mesma arquitetura/visual),
// lendo os dados AO VIVO da planilha do Google Sheets (aba "Base meta -
// consultoria" para anúncios Meta, aba "Base formulário - consultoria" para
// leads) via o endpoint gviz (ver bloco "Google Sheets (ao vivo)" abaixo).
// A planilha precisa estar compartilhada como pública ("Qualquer pessoa com
// o link" → Leitor) — sem isso o fetch() falha e aparece um erro no painel.
// Funil ativo: "Sessão Estratégica". Todo o gasto e todos os formulários da
// planilha pertencem a este único funil — não há filtro por nome/prefixo de
// campanha (ver CONTEXT.md).
// ══════════════════════════════════════════════════════════════════════════

// ── Metas Sessão Estratégica ────────────────────────────────────────────────
const META_CPF = 25;   // R$ 25 custo por formulário (meta)

const METAS_T = {
  cpf:      {val:25,   higher:false},
  cpc:      {val:3.75, higher:false},
  ctr:      {val:1.20, higher:true},
  cpm:      {val:45,   higher:false},
  connect:  {val:60,   higher:true},
  txConvPg: {val:null, higher:true}, // sem meta definida ainda
};

// Chart colors
const CHART_COLOR = "#3b82f6";
const CHART_INV   = "#3b82f6";
const CHART_CPF   = "#fbbf24";
const CHART_LEADS = "#34d399";
const CHART_ORG   = "#a78bfa";

// ── State ─────────────────────────────────────────────────────────────────
const S = {
  currentFunil:"sessao",   // preparado para outros funis futuramente
  meta:{},        // date → {spend,clicks,impressions,landingViews}
  leadsD:{},      // date → {traffic,organic}  (traffic = utm_source com "FBAds"; organic = todo o resto)
  metaByAd:{}, metaByAdByDate:{},
  metaByCamp:{}, metaByCampByDate:{},
  metaTipo:{quente:{},frio:{}},   // date → {spend,clicks,impressions,landingViews} — por classificação da campanha
  leadsTipo:{quente:{},frio:{}},  // date → count
  leadsFat:{},          // "Qual sua renda mensal?" → count (todas as fichas, all-time)
  leadsEsp:{},          // "Qual cenário você se enquadra hoje?" → count
  leadsConstruiu:{},    // "Você já construiu para vender?" → count
  leadsGuardado:{},     // "Quanto você tem guardado..." → count
  leadsDificuldade:{},  // "Qual sua maior dificuldade..." → count (texto livre, alta cardinalidade)
  leadsClassificacao:{},// "classificação" → count (Qualificado/Desqualificado)
  leadsSource:{},       // origem (UTM) → count — ex.: FBAds, bio, biothreads, storyWilker...
  leadsByAdId:{}, // adId → date → count
  leadsByCamp:{}, // campName (resolvido) → date → count
  startDate:"", endDate:"", activeQuick:"30d",
  aSort:{col:"spend",dir:"desc"},
  cSort:{col:"spend",dir:"desc"},
  campSearch:"", adSearch:"",
  manualSpendHoje:null,
  selectedCamps:new Set(),
  selectedAds:new Set(),
  overlays:{cpf:{inv:false},ctr:{inv:false},cpm:{inv:false},cpc:{inv:false},txConvPg:{inv:false},connect:{inv:false}},
  currentPage:"principal",
  updated:null,
  loading:true, error:null, firstLoad:true,
};

// ── Date helpers (GMT-3 Brasil) ───────────────────────────────────────────
function nowBR(){ return new Date(Date.now()-(3*60*60*1000)); }
function toISODate(d){ return d.toISOString().split("T")[0]; }
function todayISO(){ return toISODate(nowBR()); }
function yesterdayISO(){ const d=nowBR();d.setDate(d.getDate()-1);return toISODate(d); }
function nDaysAgoISO(n){ const d=nowBR();d.setDate(d.getDate()-n);return toISODate(d); }
function firstOfMonthISO(){ const d=nowBR();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00Z");d.setDate(d.getDate()+n);return toISODate(d); }
function subDays(iso,n){ return addDays(iso,-n); }
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function monthLabel(iso){ if(!iso)return"—"; const [y,m]=iso.split("-"); return `${MESES[parseInt(m,10)-1]}/${y.slice(2)}`; }

// ── Format helpers ────────────────────────────────────────────────────────
function parseBRL(s){
  if(!s||s==="-"||s==="0")return 0;
  s=String(s).replace(/[R$\s]/g,"").trim();
  if(!s||s==="-")return 0;
  // Both . and , → Brazilian thousands: 1.234,56
  if(s.includes(",")&&s.includes("."))return parseFloat(s.replace(/\./g,"").replace(",","."))||0;
  // Only , → Brazilian decimal: 2,68
  if(s.includes(","))return parseFloat(s.replace(",","."))||0;
  // Only . → US decimal: 2.68
  return parseFloat(s)||0;
}
function fBRL(n){ return "R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fBRLShort(n){ const a=Math.abs(n||0),sg=n<0?"-":"";if(a>=1000)return sg+"R$ "+(a/1000).toFixed(1).replace(".",",")+"k";return sg+"R$ "+Math.round(a); }
function fPct(n){ return (n||0).toFixed(1)+"%"; }
function fN(n){ return (n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fDate(iso){ if(!iso)return"";const[,m,d]=iso.split("-");return `${d}/${m}`; }
function fDateBR(iso){ if(!iso)return"";const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`; }
function toISO(s){
  if(!s||s==="Date"||s==="")return null;
  s=String(s).trim();
  // Google Sheets/gviz às vezes serializa datas como Date(YYYY,M,D) (mês 0-indexado)
  const dLit=/^Date\((\d+),(\d+),(\d+)/.exec(s);
  if(dLit){
    const[,y,m,day]=dLit;
    return `${y}-${String(parseInt(m,10)+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  }
  s=s.split(/[ T]/)[0]; // corta hora, aceita separador " " ou "T" (ISO datetime)
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const p=s.split("/");
  if(p.length===3){
    const y=p[2].length===4?p[2]:"20"+p[2];
    const a=parseInt(p[0]),b=parseInt(p[1]);
    // If first part > 12 → must be DD/MM/YYYY (BR)
    // If second part > 12 → must be MM/DD/YYYY (US)
    // Ambiguous → assume BR (DD/MM)
    if(b>12){
      // MM/DD/YYYY (US format from Google Sheets export)
      return `${y}-${p[0].padStart(2,"0")}-${p[1].padStart(2,"0")}`;
    }
    return `${y}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
  }
  return null;
}
function stripTime(s){ if(!s)return s;return String(s).trim().split(" ")[0]; }

// ── Status helpers ────────────────────────────────────────────────────────
function statusColor(val,meta,higherIsBetter){
  if(!val||val===0)return "#8a96ab";
  const ratio=val/meta;
  if(higherIsBetter){ if(ratio>=1)return "#34d399";if(ratio>=0.9)return "#fbbf24";return "#f87171"; }
  else { if(ratio<=1)return "#34d399";if(ratio<=1.1)return "#fbbf24";return "#f87171"; }
}
function statusBorder(val,meta,higherIsBetter){
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399") return "rgba(52,211,153,.22)";
  if(c==="#fbbf24") return "rgba(251,191,36,.22)";
  if(c==="#f87171") return "rgba(248,113,113,.22)";
  return "var(--border)";
}
function em(val,meta,higher){
  if(meta===null||meta===undefined)return "";
  if(!val||val===0)return "";
  const ratio=higher?val/meta:meta/val;
  if(ratio>=1)return "🟢";if(ratio>=0.85)return "🟡";return "🔴";
}

// ── Google Sheets (ao vivo) ─────────────────────────────────────────────
// Os dados vêm direto da planilha do Google Sheets via endpoint gviz (API de
// visualização), formato out:json (JSONP). Usamos out:json em vez de out:csv
// porque o out:csv não é confiável para células com texto multi-linha (ver
// CONTEXT.md, "3º bug"). A busca é paginada em pedaços pequenos (range=) em
// vez de pedir a aba inteira de uma vez, porque pedir tudo de uma vez também
// se mostrou instável em planilhas grandes (ver diagnostico.html).
const SHEET_ID = "17cGj1d1k9sUxMi4bpsyfXI_ha3voP2d08jFm_QnjEvk";
const SHEET_META_NAME = "Base meta - consultoria";
const SHEET_FORM_NAME = "Base formulário - consultoria";
const SHEET_META_LASTCOL = 14;  // Date .. Publisher Platform (Breakdown)
const SHEET_FORM_LASTCOL = 22;  // m .. variacao

function colLetter(n){
  let s="";
  while(n>0){ const rem=(n-1)%26; s=String.fromCharCode(65+rem)+s; n=Math.floor((n-1)/26); }
  return s;
}
function gvizUrl(name,extra){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}${extra||""}`;
}
async function fetchRaw(url){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),20000);
  let res;
  try{ res=await fetch(url,{cache:"no-cache",signal:ctrl.signal}); }
  catch(e){ clearTimeout(timer); throw new Error("Falha de rede: "+e.message); }
  clearTimeout(timer);
  if(!res.ok) throw new Error("Erro HTTP "+res.status+" — confira se a planilha está pública (\"Qualquer pessoa com o link\" → Leitor)");
  return await res.text();
}
function parseGvizText(text){
  if(!text||text.trim().length===0) return {cols:[],rows:[]};
  const m=/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/.exec(text.trim());
  if(!m) return {cols:[],rows:[],parseFail:true};
  let json;
  try{ json=JSON.parse(m[1]); }catch(e){ return {cols:[],rows:[],parseFail:true}; }
  if(json.status==="error"){
    const msg=(json.errors&&json.errors[0]&&json.errors[0].detailed_message)||"erro desconhecido";
    return {cols:[],rows:[],errorMsg:msg};
  }
  return json.table||{cols:[],rows:[]};
}
function cellVal(cell){
  if(!cell) return "";
  if(cell.f!=null) return String(cell.f);
  if(cell.v!=null) return String(cell.v);
  return "";
}
// headersCount: quantas linhas do range devem ser tratadas como cabeçalho (0 ou 1).
// Sem isso, o Google TENTA adivinhar se a 1ª linha do range é cabeçalho comparando
// os tipos de dado das colunas — e erra em abas quase totalmente texto (ex.: a
// aba "Base formulário", que é e-mail/whatsapp/respostas de texto livre): ele não
// acha diferença de tipo entre a "linha de cabeçalho" e as linhas de dado, decide
// que não há cabeçalho, e devolve os nomes de coluna como letras genéricas
// (A, B, C...) em vez dos nomes reais — quebrando toda leitura por nome de campo
// (r["Data"], r["utm_source"] etc. viram undefined, e processData() descarta a
// linha inteira). Forçar headers=1 na 1ª página (que tem a linha 1 de verdade) e
// headers=0 nas páginas seguintes (que não têm linha de cabeçalho nenhuma) resolve
// isso de vez, sem depender do palpite do Google.
async function fetchGvizRange(name,range,headersCount){
  const text=await fetchRaw(gvizUrl(name,`&range=${encodeURIComponent(range)}&headers=${headersCount}`));
  const t=parseGvizText(text);
  if(t.errorMsg) throw new Error(`Google Sheets ("${name}"): `+t.errorMsg);
  if(t.parseFail) throw new Error(`Resposta inesperada do Google Sheets pra aba "${name}" (não veio JSON válido).`);
  return t;
}
// Busca uma aba inteira, paginada em pedaços pequenos e em paralelo (evita o
// truncamento/corrupção que acontecia pedindo a aba inteira de uma vez só).
async function fetchSheetRows(name,lastColNum){
  const lastCol=colLetter(lastColNum);
  const CHUNK=lastColNum>=20?60:150;
  const PARALLEL=8;

  const first=await fetchGvizRange(name,`A1:${lastCol}${1+CHUNK}`,1);
  if(!first.cols||!first.cols.length) throw new Error(`Não recebi cabeçalhos da aba "${name}" — confira o nome da aba e se a planilha está pública.`);
  const headers=first.cols.map(c=>(c.label||c.id||"").trim());
  let allRows=(first.rows||[]).filter(r=>(r.c||[]).some(c=>cellVal(c)!==""));

  let nextStart=2+CHUNK;
  while(true){
    const wave=[];
    for(let i=0;i<PARALLEL;i++){
      const s=nextStart+i*CHUNK, e=s+CHUNK-1;
      wave.push(fetchGvizRange(name,`A${s}:${lastCol}${e}`,0).catch(()=>({rows:[]})));
    }
    const results=await Promise.all(wave);
    let anyRows=false;
    for(const table of results){
      const rows=(table.rows||[]).filter(r=>(r.c||[]).some(c=>cellVal(c)!==""));
      if(rows.length>0){ anyRows=true; allRows.push(...rows); }
    }
    nextStart+=PARALLEL*CHUNK;
    if(!anyRows) break;
  }
  return allRows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,cellVal(r.c[i])])));
}

// Processa as duas abas (já como arrays de objetos, vindos do Google Sheets ao vivo) e popula o state S.
function processData(mRows, lRows){
    console.log(`[sheets] Meta: ${mRows.length} linhas | Formulário: ${lRows.length} linhas`);
    // Diagnóstico — ajuda a identificar se os cabeçalhos/valores vieram diferentes do esperado.
    if(mRows[0])console.log("[diag] cabeçalhos Meta:",Object.keys(mRows[0]));
    if(lRows[0])console.log("[diag] cabeçalhos Formulário:",Object.keys(lRows[0]));
    if(lRows[0]){
      console.log("[diag] 1ª linha Formulário — Data:",JSON.stringify(lRows[0]["Data"]),"| utm_source:",JSON.stringify(lRows[0]["utm_source"]),"| utm_medium:",JSON.stringify(lRows[0]["utm_medium"]));
    }

    // ── Mapa de campanhas (id → nome / tipo quente|frio) ────────────────
    const campIdToName={}, campIdToTipo={};
    for(const r of mRows){
      const cid=(r["Campaign ID"]||"").trim();
      const cn=(r["Campaign Name"]||"").trim();
      if(!cid||!cn)continue;
      if(!campIdToName[cid])campIdToName[cid]=cn;
      if(campIdToTipo[cid]===undefined){
        const cnl=cn.toLowerCase();
        campIdToTipo[cid]=cnl.includes("frio")?"frio":(cnl.includes("quente")?"quente":null);
      }
    }
    // Todas as campanhas do CSV pertencem ao funil Sessão Estratégica (sem filtro por nome/prefixo).

    // ── Processa Meta Ads (todo o CSV) ──────────────────────────────────
    const mD={}, mByAd={}, mByAdByDate={}, mByCamp={}, mByCampByDate={};
    const mTipo={quente:{},frio:{}};
    for(const r of mRows){
      const d=toISO(r["Date"]);if(!d)continue;
      const campName=(r["Campaign Name"]||"").trim();

      const sp=parseBRL(r["Spend (Cost, Amount Spent)"]);
      const cl=parseInt(r["Action Link Clicks"]||0)||0;
      const im=parseInt(r["Impressions"]||0)||0;
      const lv=parseInt(r["Action Landing Page View"]||0)||0;

      if(!mD[d])mD[d]={spend:0,clicks:0,impressions:0,landingViews:0};
      mD[d].spend+=sp; mD[d].clicks+=cl; mD[d].impressions+=im; mD[d].landingViews+=lv;

      const adName=(r["Ad Name"]||"").trim();
      const adId=r["Ad ID"]||r["Ad Id"]||"";
      const igUrl=r["Instagram Permalink URL"]||"";
      const cid=(r["Campaign ID"]||"").trim();
      const tipo=campIdToTipo[cid];

      if(tipo==="quente"||tipo==="frio"){
        if(!mTipo[tipo][d])mTipo[tipo][d]={spend:0,clicks:0,impressions:0,landingViews:0};
        mTipo[tipo][d].spend+=sp; mTipo[tipo][d].clicks+=cl;
        mTipo[tipo][d].impressions+=im; mTipo[tipo][d].landingViews+=lv;
      }

      if(adName){
        if(!mByAd[adName])mByAd[adName]={adName,adIds:new Set(),spend:0,clicks:0,impressions:0,landingViews:0,igUrl:"",camps:new Set(),tipo:null};
        if(adId)mByAd[adName].adIds.add(adId);
        mByAd[adName].spend+=sp;mByAd[adName].clicks+=cl;mByAd[adName].impressions+=im;mByAd[adName].landingViews+=lv;
        if(igUrl&&!mByAd[adName].igUrl)mByAd[adName].igUrl=igUrl;
        if(campName)mByAd[adName].camps.add(campName);
        if(!mByAd[adName].tipo&&tipo)mByAd[adName].tipo=tipo;
        if(!mByAdByDate[adName])mByAdByDate[adName]={};
        if(!mByAdByDate[adName][d])mByAdByDate[adName][d]={spend:0,clicks:0,impressions:0,adIds:new Set(),igUrl:""};
        mByAdByDate[adName][d].spend+=sp;mByAdByDate[adName][d].clicks+=cl;
        mByAdByDate[adName][d].impressions+=im;
        if(adId)mByAdByDate[adName][d].adIds.add(adId);
        if(igUrl&&!mByAdByDate[adName][d].igUrl)mByAdByDate[adName][d].igUrl=igUrl;
      }
      if(campName){
        if(!mByCamp[campName])mByCamp[campName]={campName,spend:0,clicks:0,impressions:0,landingViews:0,tipo:tipo||null};
        mByCamp[campName].spend+=sp;mByCamp[campName].clicks+=cl;mByCamp[campName].impressions+=im;mByCamp[campName].landingViews+=lv;
        if(!mByCampByDate[campName])mByCampByDate[campName]={};
        if(!mByCampByDate[campName][d])mByCampByDate[campName][d]={spend:0,clicks:0,impressions:0,adIds:new Set()};
        mByCampByDate[campName][d].spend+=sp;mByCampByDate[campName][d].clicks+=cl;mByCampByDate[campName][d].impressions+=im;
        if(adId)mByCampByDate[campName][d].adIds.add(adId);
      }
    }
    S.meta=mD; S.metaByAd=mByAd; S.metaByAdByDate=mByAdByDate;
    S.metaByCamp=mByCamp; S.metaByCampByDate=mByCampByDate;
    S.metaTipo=mTipo;

    // ── Processa Formulário (leads) ──────────────────────────────────────
    // utm_medium: "{nome-campanha}_id_{campaignId}"  → id da campanha
    // utm_content: "{nome-anuncio}_id_{adId}::{fbclid}" → id do anúncio
    // Tráfego pago = utm_source contém "FBAds" OU está vazio (fichas sem UTM também contam
    // como tráfego). Qualquer outro valor de utm_source (bio, wpp, ytb, biothreads,
    // storyWilker, etc.) é considerado orgânico.
    const medRe=/_id_(\d+)$/;
    const contRe=/_id_(\d{8,})/;
    const lD={};
    const lTipo={quente:{},frio:{}};
    const fatCount={}, espCount={};
    const construiuCount={}, guardadoCount={}, dificuldadeCount={}, classificacaoCount={};
    const sourceCount={};
    const lByAdId={}, lByCamp={};
    for(const r of lRows){
      const d=toISO(r["Data"]);if(!d)continue;
      const utmSource=(r["utm_source"]||"").trim();
      const isFBAds=utmSource.toUpperCase().includes("FBADS");
      const isEmpty=utmSource==="";
      const isPaid=isFBAds||isEmpty;

      if(!lD[d])lD[d]={traffic:0,organic:0};
      if(isPaid)lD[d].traffic++; else lD[d].organic++;

      // Origem (UTM) — todas as fichas; "FBAds" agrupa as variações, "Sem UTM" fica à parte
      // (mesmo contando como tráfego na métrica acima)
      const srcLabel=isFBAds?"FBAds":(utmSource||"Sem UTM");
      sourceCount[srcLabel]=(sourceCount[srcLabel]||0)+1;

      // Qualificações do formulário — todas as fichas (pagas + orgânicas)
      const renda=(r["Qual sua renda mensal?"]||"").trim();
      const cenario=(r["Qual cenário você se enquadra hoje?"]||"").trim();
      const construiu=(r["Você já construiu para vender?"]||"").trim();
      const guardado=(r["Quanto você tem guardado para começar a investir em construir para vender?"]||"").trim();
      const dificuldade=(r["Qual você considera ser a sua maior dificuldade ou desafio na construção para venda?"]||"").trim();
      const classificacao=(r["classificação"]||"").trim();
      if(renda)fatCount[renda]=(fatCount[renda]||0)+1;
      if(cenario)espCount[cenario]=(espCount[cenario]||0)+1;
      if(construiu)construiuCount[construiu]=(construiuCount[construiu]||0)+1;
      if(guardado)guardadoCount[guardado]=(guardadoCount[guardado]||0)+1;
      if(dificuldade)dificuldadeCount[dificuldade]=(dificuldadeCount[dificuldade]||0)+1;
      if(classificacao)classificacaoCount[classificacao]=(classificacaoCount[classificacao]||0)+1;

      if(!isPaid)continue; // orgânico não tem campanha/anúncio de ads pra atribuir

      const med=(r["utm_medium"]||"").trim();
      const mm=medRe.exec(med);
      const cid=mm?mm[1]:null;
      const campName=cid?(campIdToName[cid]||""):"";
      if(cid&&campName){
        const tipo=campIdToTipo[cid];
        if(tipo==="quente"||tipo==="frio"){
          if(!lTipo[tipo][d])lTipo[tipo][d]=0;
          lTipo[tipo][d]++;
        }
        if(!lByCamp[campName])lByCamp[campName]={};
        lByCamp[campName][d]=(lByCamp[campName][d]||0)+1;
      }

      const cont=(r["utm_content"]||r["utm_term"]||"").trim();
      const am=contRe.exec(cont);
      const adId=am?am[1]:null;
      if(adId){if(!lByAdId[adId])lByAdId[adId]={};lByAdId[adId][d]=(lByAdId[adId][d]||0)+1;}
    }
    S.leadsD=lD; S.leadsTipo=lTipo; S.leadsFat=fatCount; S.leadsEsp=espCount;
    S.leadsConstruiu=construiuCount; S.leadsGuardado=guardadoCount;
    S.leadsDificuldade=dificuldadeCount; S.leadsClassificacao=classificacaoCount;
    S.leadsSource=sourceCount;
    S.leadsByAdId=lByAdId; S.leadsByCamp=lByCamp;

    // Data da última atualização (última data com investimento)
    const allDates=Object.keys(mD).sort();
    S.updated=allDates.length?fDateBR(allDates[allDates.length-1]):"—";

    // Período padrão: últimos 30 dias com dados disponíveis
    if(!S.startDate){
      const lastDate=allDates.length?allDates[allDates.length-1]:todayISO();
      S.endDate=lastDate; S.startDate=subDays(lastDate,29); S.activeQuick="30d";
    }
    S.firstLoad=false;
}

async function loadData(force=false){
  S.loading=true; S.error=null; render();
  try{
    const [mRows,lRows]=await Promise.all([
      fetchSheetRows(SHEET_META_NAME,SHEET_META_LASTCOL),
      fetchSheetRows(SHEET_FORM_NAME,SHEET_FORM_LASTCOL),
    ]);
    processData(mRows, lRows);
  }catch(e){
    console.error(e);
    S.error="Erro ao carregar dados: "+e.message;
    S.firstLoad=false;
  }
  S.loading=false;
  render();
}

// ── Derived metrics ───────────────────────────────────────────────────────
function getDaily(start,end){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.leadsD)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const m=S.meta[date]||{spend:0,clicks:0,impressions:0,landingViews:0};
    const l=S.leadsD[date]||{traffic:0,organic:0};
    return{date,label:fDate(date),spend:m.spend,
      trafficLeads:l.traffic,organicLeads:l.organic,
      cpf:l.traffic>0?m.spend/l.traffic:0,
    };
  });
}
function getTotals(daily){
  return daily.reduce((a,d)=>({
    spend:a.spend+d.spend,
    trafficLeads:a.trafficLeads+d.trafficLeads,
    organicLeads:a.organicLeads+d.organicLeads,
  }),{spend:0,trafficLeads:0,organicLeads:0});
}

function getDailyT(start,end){
  return Object.keys(S.meta).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const m=S.meta[date];
    const l=S.leadsD[date]||{traffic:0,organic:0};
    const cpc   = m.clicks>0      ? m.spend/m.clicks           : 0;
    const ctr   = m.impressions>0 ? (m.clicks/m.impressions)*100 : 0;
    const cpm   = m.impressions>0 ? (m.spend/m.impressions)*1000 : 0;
    const connect   = m.clicks>0  ? (m.landingViews/m.clicks)*100 : 0;
    const txConvPg  = m.landingViews>0 ? (l.traffic/m.landingViews)*100 : 0;
    const cpf   = l.traffic>0     ? m.spend/l.traffic           : 0;
    return{date,label:fDate(date),spend:m.spend,
      cpc,ctr,cpm,connect,txConvPg,cpf,
      clicks:m.clicks,impressions:m.impressions,
      landingViews:m.landingViews,
      trafficLeads:l.traffic};
  });
}
function getTotalsT(daily){
  const t=daily.reduce((a,d)=>({
    spend:a.spend+d.spend,clicks:a.clicks+d.clicks,
    impressions:a.impressions+d.impressions,
    landingViews:a.landingViews+d.landingViews,
    trafficLeads:a.trafficLeads+d.trafficLeads,
  }),{spend:0,clicks:0,impressions:0,landingViews:0,trafficLeads:0});
  return{...t,
    cpc:   t.clicks>0      ? t.spend/t.clicks              : 0,
    ctr:   t.impressions>0 ? (t.clicks/t.impressions)*100  : 0,
    cpm:   t.impressions>0 ? (t.spend/t.impressions)*1000  : 0,
    connect:  t.clicks>0       ? (t.landingViews/t.clicks)*100    : 0,
    txConvPg: t.landingViews>0 ? (t.trafficLeads/t.landingViews)*100 : 0,
    cpf:   t.trafficLeads>0 ? t.spend/t.trafficLeads : 0,
  };
}
function getDayMetrics(iso){
  const m=S.meta[iso]||{spend:0,clicks:0,impressions:0,landingViews:0};
  const l=S.leadsD[iso]||{traffic:0,organic:0};
  return{
    spend:m.spend,
    cpc:   m.clicks>0      ? m.spend/m.clicks              : 0,
    ctr:   m.impressions>0 ? (m.clicks/m.impressions)*100  : 0,
    cpm:   m.impressions>0 ? (m.spend/m.impressions)*1000  : 0,
    connect:  m.clicks>0       ? (m.landingViews/m.clicks)*100    : 0,
    txConvPg: m.landingViews>0 ? (l.traffic/m.landingViews)*100 : 0,
    cpf:   l.traffic>0     ? m.spend/l.traffic             : 0,
    trafficLeads:l.traffic,
  };
}
// Métricas do período incluindo split quente/frio — usado no Resumo diário
function periodMetrics(s,e){
  const t=getTotalsT(getDailyT(s,e));
  let tLeads=0;
  for(const[d,l] of Object.entries(S.leadsD)){ if(d>=s&&d<=e) tLeads+=l.traffic; }
  t.trafficLeads=tLeads;
  t.organicLeads=0; // orgânico ainda não rastreado para esta oferta
  t.totalLeads=tLeads;
  t.cpf=tLeads>0?t.spend/tLeads:0;

  let sQ=0,nQ=0,sF=0,nF=0;
  for(const[d,v] of Object.entries(S.metaTipo.quente||{})){ if(d>=s&&d<=e)sQ+=v.spend; }
  for(const[d,n] of Object.entries(S.leadsTipo.quente||{})){ if(d>=s&&d<=e)nQ+=n; }
  for(const[d,v] of Object.entries(S.metaTipo.frio||{})){ if(d>=s&&d<=e)sF+=v.spend; }
  for(const[d,n] of Object.entries(S.leadsTipo.frio||{})){ if(d>=s&&d<=e)nF+=n; }
  t.leadsQuente=nQ; t.leadsFrio=nF;
  t.cpfQuente=nQ>0?sQ/nQ:0; t.cpfFrio=nF>0?sF/nF:0;
  return t;
}

// ── Canvas / Chart helpers ────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);
  return ctx;
}
function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    ctx.lineTo(xP(n-1),yP(0));ctx.lineTo(xP(0),yP(0));ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,ctx.canvas.height/DPR);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}
function drawBars(ctx,xP,yP,yZero,vals,color,barW){
  vals.forEach((v,i)=>{
    const x=xP(i)-barW/2, y=Math.min(yP(v),yZero), h=Math.abs(yP(v)-yZero);
    ctx.fillStyle=color+"cc";
    ctx.fillRect(x,y,barW,Math.max(h,1));
  });
}

// Dual-axis: Investimento (esq.) × Custo por Formulário (dir.)
function drawDualInv(id,data,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:58,b:28,l:64};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.cpf||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,META_CPF,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v)/(lMax))*cH;
  const yPR=v=>P.t+cH-((v)/(rMax))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("R$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  const mY=yPR(META_CPF);
  ctx.strokeStyle=CHART_CPF+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=CHART_CPF;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
  ctx.fillText("Meta R$"+META_CPF,P.l+cW+4,mY-3);
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPF,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Formulários (tráfego) — barras
function drawFormsBar(id,data,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:40};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d.trafficLeads||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/n)*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,CHART_LEADS,barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){
      ctx.fillStyle="#e8edf6";ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;
      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

function drawChartWithOverlay(id,data,key,fmtY,refVal,refLabel,overlayInv,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:12,r:overlayInv?52:12,b:26,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>+(d[key])||0);
  const invVals=data.map(d=>d.spend||0);
  let allL=[...vals];if(refVal!=null)allL.push(refVal);
  const lMax=Math.max(...allL,0.01)*1.2;
  const rMax=overlayInv?Math.max(...invVals,0.01)*1.2:1;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-(v/lMax)*cH;
  const yPR=v=>P.t+cH-(v/rMax)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmtY(lMax-(i/4)*lMax),P.l-4,y+3);
  }
  if(overlayInv){
    for(let i=0;i<=4;i++){
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=CHART_CPF;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="left";
      ctx.fillText(fBRLShort(rMax-(i/4)*rMax),P.l+cW+4,y+3);
    }
  }
  if(refVal!=null){
    const ry=yPL(refVal);
    ctx.strokeStyle=CHART_COLOR+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,ry);ctx.lineTo(P.l+cW,ry);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=CHART_COLOR;ctx.font="8px 'Inter',sans-serif";ctx.textAlign="right";
    ctx.fillText(refLabel||"Meta",P.l+cW,ry-3);
  }
  drawLineArea(ctx,xP,yPL,vals,CHART_COLOR,true);
  if(overlayInv)drawLineArea(ctx,xP,yPR,invVals,CHART_CPF,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${(l.fmt||fBRL)(+(d[l.key])||0)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}
