// ══════════════════════════════════════════════════════════════════════════
// Distribuição de Conteúdo (Seguidores) — funil independente, mesma planilha
// da Sessão Estratégica (SHEET_ID), aba "Base Seguidores".
//
// A aba tem um problema de origem: o relatório automático que a alimenta às
// vezes concatena, dentro da MESMA aba, blocos de dados com layouts de coluna
// diferentes (linhas em branco + uma nova linha de cabeçalho no meio dos
// dados — visto a partir de ~linha 950, e o layout desse 2º bloco já mudou
// mais de uma vez). Por isso o parser abaixo NÃO assume cabeçalho único
// (diferente do parseSheet() usado no resto do projeto): ele varre a aba
// inteira linha a linha, reconhece toda vez que aparece uma nova linha de
// cabeçalho (coluna A = "Dia" ou "Date") e remapeia as colunas a partir dali,
// por NOME de coluna (não por posição fixa) — resiliente a reordenar/
// adicionar/remover colunas extras (Moeda, Link, datas de relatório etc.).
// ══════════════════════════════════════════════════════════════════════════

const META_CPS=0.50; // meta de Custo por novo seguidor

// Nome de coluna (de qualquer um dos formatos já vistos na aba) → campo canônico
// interno. Ordem importa: checagens de adset/campanha vêm antes da de "ad", porque
// "Identificação do conjunto de anúncios" também contém a palavra "anúncio".
function matchSegField(h){
  h=(h||"").trim();
  if(!h) return null;
  if(/^dia$|^date$/i.test(h)) return "date";
  if(/nome do conjunto/i.test(h)) return "adsetName";
  if(/nome da campanha|^campaign name$/i.test(h)) return "campName";
  if(/nome do an.ncio|^ad name$/i.test(h)) return "adName";
  if(/identifica.*conjunto|^adset id$/i.test(h)) return "adsetId";
  if(/identifica.*campanha|^campaign id$/i.test(h)) return "campId";
  if(/identifica.*an.ncio|^ad id$/i.test(h)) return "adId";
  if(/valor usado|^spend/i.test(h)) return "spend";
  if(/cliques no link|action link clicks/i.test(h)) return "clicks";
  if(/impress/i.test(h)) return "impressions";
  if(/alcance|^reach/i.test(h)) return "reach";
  if(/visitas ao perfil|profile visits/i.test(h)) return "profileVisits";
  if(/seguidores/i.test(h)) return "novosSeguidores";
  return null; // colunas ignoradas: Moeda, Instagram Permalink URL, Link, datas de relatório...
}

// "R$ 9,50" (formato com header em inglês) ou "1.85" (formato com header em português,
// decimal americano sem separador de milhar) → número.
function parseValorSeg(s){
  if(!s||s==="-") return 0;
  s=String(s).trim();
  if(!s) return 0;
  if(s.includes("R$")||s.includes(",")) return parseBRL(s);
  return parseFloat(s)||0;
}

// Varre a aba (array de arrays, rawRows[0] = cabeçalho da linha 1) detectando
// blocos com cabeçalhos diferentes ao longo do caminho.
function parseSeguidoresRows(rawRows){
  let colMap=null;
  function isHeaderRow(row){
    const a=(row&&row[0]||"").trim();
    return /^dia$|^date$/i.test(a);
  }
  function isBlank(row){
    return !row || row.every(c=>!c || !String(c).trim());
  }
  const out=[];
  for(let i=0;i<rawRows.length;i++){
    const row=rawRows[i];
    if(isBlank(row)) continue;
    if(isHeaderRow(row)){ colMap=row.map(matchSegField); continue; }
    if(!colMap) continue;
    const rec={};
    for(let c=0;c<row.length;c++){
      const f=colMap[c]; if(!f) continue;
      rec[f]=(row[c]==null?"":String(row[c]).trim());
    }
    if(!rec.date) continue;
    out.push(rec);
  }
  return out;
}

function toSegMetric(rec){
  return {
    date: toISO(rec.date),
    spend: parseValorSeg(rec.spend),
    clicks: parseInt(rec.clicks,10)||0,
    impressions: parseInt(rec.impressions,10)||0,
    reach: parseInt(rec.reach,10)||0,
    adId: rec.adId||"",
    adName: rec.adName||"",
    adsetId: rec.adsetId||"",
    adsetName: rec.adsetName||"",
    campId: rec.campId||"",
    campName: rec.campName||"",
    profileVisits: parseInt(rec.profileVisits,10)||0,
    novosSeguidores: parseInt(rec.novosSeguidores,10)||0,
  };
}

function processDataDist(rawRows){
  const recs=parseSeguidoresRows(rawRows).map(toSegMetric).filter(r=>r.date);
  const daily={}, byAd={}, byAdByDate={}, byCamp={}, byCampByDate={};
  const blank=()=>({spend:0,clicks:0,impressions:0,reach:0,profileVisits:0,seguidores:0});
  for(const r of recs){
    if(!daily[r.date]) daily[r.date]=blank();
    const d=daily[r.date];
    d.spend+=r.spend; d.clicks+=r.clicks; d.impressions+=r.impressions; d.reach+=r.reach;
    d.profileVisits+=r.profileVisits; d.seguidores+=r.novosSeguidores;

    if(r.adId){
      if(!byAd[r.adId]) byAd[r.adId]={...blank(),adName:r.adName,campName:r.campName};
      const a=byAd[r.adId];
      a.spend+=r.spend; a.clicks+=r.clicks; a.impressions+=r.impressions; a.reach+=r.reach;
      a.profileVisits+=r.profileVisits; a.seguidores+=r.novosSeguidores;
      if(r.adName) a.adName=r.adName;
      if(r.campName) a.campName=r.campName;
      if(!byAdByDate[r.adId]) byAdByDate[r.adId]={};
      if(!byAdByDate[r.adId][r.date]) byAdByDate[r.adId][r.date]=blank();
      const ad=byAdByDate[r.adId][r.date];
      ad.spend+=r.spend; ad.clicks+=r.clicks; ad.impressions+=r.impressions; ad.reach+=r.reach;
      ad.profileVisits+=r.profileVisits; ad.seguidores+=r.novosSeguidores;
    }
    if(r.campName){
      if(!byCamp[r.campName]) byCamp[r.campName]=blank();
      const c=byCamp[r.campName];
      c.spend+=r.spend; c.clicks+=r.clicks; c.impressions+=r.impressions; c.reach+=r.reach;
      c.profileVisits+=r.profileVisits; c.seguidores+=r.novosSeguidores;
      if(!byCampByDate[r.campName]) byCampByDate[r.campName]={};
      if(!byCampByDate[r.campName][r.date]) byCampByDate[r.campName][r.date]=blank();
      const cd=byCampByDate[r.campName][r.date];
      cd.spend+=r.spend; cd.seguidores+=r.novosSeguidores;
    }
  }
  S.dist.daily=daily; S.dist.byAd=byAd; S.dist.byAdByDate=byAdByDate;
  S.dist.byCamp=byCamp; S.dist.byCampByDate=byCampByDate;
  S.dist.updated=new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"});
}

// ── Agregação por período ──────────────────────────────────────────────────
function getDailyDist(start,end){
  const out=[];
  if(!start||!end) return out;
  let d=start, guard=0;
  while(d<=end && guard<3660){
    const m=S.dist.daily[d]||{spend:0,clicks:0,impressions:0,reach:0,profileVisits:0,seguidores:0};
    out.push({date:d,label:fDate(d),...m,
      cpc:m.clicks>0?m.spend/m.clicks:0,
      ctr:m.impressions>0?(m.clicks/m.impressions)*100:0,
      cpm:m.impressions>0?(m.spend/m.impressions)*1000:0,
      custoPorVisita:m.profileVisits>0?m.spend/m.profileVisits:0,
      custoPorSeguidor:m.seguidores>0?m.spend/m.seguidores:0,
      txConvSeg:m.profileVisits>0?(m.seguidores/m.profileVisits)*100:0,
    });
    d=addDays(d,1); guard++;
  }
  return out;
}
function getTotalsDist(daily){
  const t=daily.reduce((a,d)=>({
    spend:a.spend+d.spend, clicks:a.clicks+d.clicks, impressions:a.impressions+d.impressions,
    reach:a.reach+d.reach, profileVisits:a.profileVisits+d.profileVisits, seguidores:a.seguidores+d.seguidores,
  }),{spend:0,clicks:0,impressions:0,reach:0,profileVisits:0,seguidores:0});
  return {...t,
    cpc:t.clicks>0?t.spend/t.clicks:0,
    ctr:t.impressions>0?(t.clicks/t.impressions)*100:0,
    cpm:t.impressions>0?(t.spend/t.impressions)*1000:0,
    custoPorVisita:t.profileVisits>0?t.spend/t.profileVisits:0,
    custoPorSeguidor:t.seguidores>0?t.spend/t.seguidores:0,
    txConvSeg:t.profileVisits>0?(t.seguidores/t.profileVisits)*100:0,
  };
}
function getDayMetricsDist(iso){ return getTotalsDist(getDailyDist(iso,iso)); }

// ── Gráficos (Distribuição) ─────────────────────────────────────────────────
function drawDualSeg(id,data,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:58,b:28,l:64};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.custoPorSeguidor||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-(v/lMax)*cH;
  const yPR=v=>P.t+cH-(v/rMax)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("R$"+(rMax-(i/4)*rMax).toFixed(2),P.l+cW+5,y+3.5);
  }
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPV,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
function drawSegBarDist(id,data,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:40};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d.seguidores||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/n)*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,"#10b981",barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){
      ctx.fillStyle="#e8edf6";
      ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;
      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
function drawProfileBarDist(id,data,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:44};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d.profileVisits||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/n)*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,CHART_COLOR,barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){
      ctx.fillStyle="#e8edf6";
      ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;
      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// ── Render Campanhas/Anúncios (Distribuição) ────────────────────────────────
function buildAdRowsDist(start,end){
  const rows=[];
  for(const [adId,meta] of Object.entries(S.dist.byAd)){
    const byDate=S.dist.byAdByDate[adId]||{};
    let spend=0,clicks=0,impressions=0,reach=0,profileVisits=0,seguidores=0;
    for(const [d,v] of Object.entries(byDate)){
      if(d>=start&&d<=end){
        spend+=v.spend; clicks+=v.clicks; impressions+=v.impressions; reach+=v.reach;
        profileVisits+=v.profileVisits; seguidores+=v.seguidores;
      }
    }
    if(spend===0&&clicks===0&&impressions===0) continue;
    rows.push({
      adId, adName:meta.adName||adId, campName:meta.campName||"—",
      spend,clicks,impressions,reach,profileVisits,seguidores,
      cpc:clicks>0?spend/clicks:0,
      ctr:impressions>0?(clicks/impressions)*100:0,
      cpm:impressions>0?(spend/impressions)*1000:0,
      custoPorVisita:profileVisits>0?spend/profileVisits:0,
      custoPorSeguidor:seguidores>0?spend/seguidores:0,
    });
  }
  return rows;
}
function sortAnunciosDist(col){
  if(S.dist.aSort.col===col) S.dist.aSort.dir=S.dist.aSort.dir==="asc"?"desc":"asc";
  else {S.dist.aSort.col=col;S.dist.aSort.dir="desc";}
  renderAnunciosDist();
}

// ── Resumo diário (Distribuição de Conteúdo) ────────────────────────────────
// Modelo exato pedido pelo Cristiano: meta de R$0,50 no Custo por novo seguidor
// (com emoji de grading), CPC/CTR/CPM por bloco, e comparação com "plan" (meta
// manual) em 2 pares editáveis — "plan até hj" (cumulativo, aparece no bloco
// Total) e "plan diário" (aparece igual em Ontem e em Hoje, já que na prática é
// a mesma meta batida por dia).
function renderResumoDist(){
  const el=document.getElementById("page-resumo");if(!el)return;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  const tot=getTotalsDist(getDailyDist(start,end));
  const ontem=getTotalsDist(getDailyDist(yest,yest));
  const hojeBase=getTotalsDist(getDailyDist(today,today));
  const hoje={...hojeBase};
  if(S.dist.manualSpendHoje!==null){
    hoje.spend=S.dist.manualSpendHoje;
    hoje.custoPorSeguidor=hoje.seguidores>0?hoje.spend/hoje.seguidores:0;
    hoje.custoPorVisita=hoje.profileVisits>0?hoje.spend/hoje.profileVisits:0;
  }
  // Propaga a diferença do investimento manual de hoje pro Total, se hoje estiver no período.
  if(S.dist.manualSpendHoje!==null && today>=start && today<=end){
    const delta=S.dist.manualSpendHoje-hojeBase.spend;
    tot.spend+=delta;
    tot.custoPorSeguidor=tot.seguidores>0?tot.spend/tot.seguidores:0;
    tot.custoPorVisita=tot.profileVisits>0?tot.spend/tot.profileVisits:0;
  }

  function fDM(iso){if(!iso)return"—";const[,m,d]=iso.split("-");return`${d}/${m}`;}
  const dateLabel=start===end?fDM(start):`${fDM(start)} a ${fDM(end)}`;
  function fBRLR(n){ return "R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fPlanBRL(n){ return "R$ "+Math.round(n||0).toLocaleString("pt-BR"); }
  function fPlanInt(n){ return Math.round(n||0).toLocaleString("pt-BR"); }

  function blockText(label,m,planLbl,planInv,planSeg){
    const cpsE=em(m.custoPorSeguidor,META_CPS,false);
    const lines=[
`*${label}*`,
``,
`Investimento:\t${fBRLR(m.spend)}${planInv!=null?`\t(${planLbl}: ${fPlanBRL(planInv)} )`:""}`,
`Visitas ao perfil:\t${m.profileVisits}`,
`Custo por visita ao perfil:\t${m.profileVisits>0?fBRLR(m.custoPorVisita):"—"}`,
``,
`Novos seguidores:\t${m.seguidores}${planSeg!=null?`\t(${planLbl}: ${fPlanInt(planSeg)} )`:""}`,
`Custo por novo seguidor:\t${m.seguidores>0?fBRLR(m.custoPorSeguidor):"—"}\t${cpsE} Meta: ${fBRLR(META_CPS)}`,
``,
`Tx conv visitantes para seguidores:\t${(m.txConvSeg||0).toFixed(1)}%`,
``,
`CPC:\t${fBRLR(m.cpc)}`,
`CTR:\t${(m.ctr||0).toFixed(2)}%`,
`CPM:\t${fBRLR(m.cpm)}`,
    ];
    return lines.join("\n");
  }

  const resumoText=
`*Resumo consolidado - Distribuição de conteúdo*\t\t

_${dateLabel}_\t\t

${blockText("-> Total",tot,"plan até hj",S.dist.planAteHoje,S.dist.planAteHojeSeg)}

${blockText("-> Ontem",ontem,"plan ontem",S.dist.planDiario,S.dist.planDiarioSeg)}

${blockText("-> Hoje",hoje,"plan hj",S.dist.planDiario,S.dist.planDiarioSeg)}`;

  // Visual blocks
  function row(lbl,val,metaStr,emoji){
    return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${val||"—"}</span>
      <span style="font-size:13px;min-width:28px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaStr||""}</span></span>
    </div>`;
  }
  function section(label,m,planLbl,planInv,planSeg,isHoje=false){
    const cpsE=em(m.custoPorSeguidor,META_CPS,false);
    const isManual=isHoje&&S.dist.manualSpendHoje!==null;
    const investRow=isHoje?`
      <div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
        <span style="color:var(--muted);font-size:12px">Investimento</span>
        <input id="manual-spend-input-dist"
          value="${isManual?(m.spend||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''}"
          placeholder="${fBRLR(hojeBase.spend)}"
          oninput="setManualSpendHojeDist(this.value)"
          onkeydown="if(event.key==='Enter')this.blur()"
          style="font-family:'JetBrains Mono',monospace;font-size:12px;color:${isManual?'#fbbf24':'var(--text-strong)'};background:transparent;border:none;border-bottom:1px solid ${isManual?'rgba(251,191,36,.4)':'rgba(255,255,255,.1)'};outline:none;padding:2px 0;width:100%"/>
        <span style="font-size:13px;min-width:80px;text-align:right">
          ${isManual?`<button onclick="clearManualSpendHojeDist()" style="font-size:10px;padding:2px 8px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fbbf24;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">↩ Restaurar</button>`:""}
        </span>
      </div>`:row("Investimento",fBRLR(m.spend),planInv!=null?`${planLbl}: ${fPlanBRL(planInv)}`:"","");
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">${label}</div>
      ${investRow}
      ${row("Visitas ao perfil",m.profileVisits,"","")}
      ${row("Custo por visita ao perfil",m.profileVisits>0?fBRLR(m.custoPorVisita):"—","","")}
      <div style="height:10px"></div>
      ${row("Novos seguidores",m.seguidores,planSeg!=null?`${planLbl}: ${fPlanInt(planSeg)}`:"","")}
      ${row("Custo por novo seguidor",m.seguidores>0?fBRLR(m.custoPorSeguidor):"—",`meta ${fBRLR(META_CPS)}`,cpsE)}
      <div style="height:10px"></div>
      ${row("Tx conv visitantes → seguidores",(m.txConvSeg||0).toFixed(1)+"%","","")}
      <div style="height:10px"></div>
      ${row("CPC",fBRLR(m.cpc),"","")}
      ${row("CTR",(m.ctr||0).toFixed(2)+"%","","")}
      ${row("CPM",fBRLR(m.cpm),"","")}
    </div>`;
  }

  function planInputRow(id,label,val,setter){
    return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0">
      <span style="color:var(--muted);font-size:11px;flex:1">${label}</span>
      <input id="${id}" value="${val!=null?val:''}" placeholder="—" oninput="${setter}(this.value)"
        onkeydown="if(event.key==='Enter')this.blur()"
        style="width:100px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong);background:var(--surf);border:1px solid var(--border);border-radius:5px;padding:3px 6px;text-align:right"/>
    </div>`;
  }
  const planEditor=`
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:var(--text-strong);margin-bottom:8px">🎯 Metas (plan)</div>
      ${planInputRow("plan-ate-hoje-inv","Plan até hj — Investimento",S.dist.planAteHoje,"setPlanAteHojeDist")}
      ${planInputRow("plan-ate-hoje-seg","Plan até hj — Seguidores",S.dist.planAteHojeSeg,"setPlanAteHojeSegDist")}
      ${planInputRow("plan-diario-inv","Plan diário — Investimento",S.dist.planDiario,"setPlanDiarioDist")}
      ${planInputRow("plan-diario-seg","Plan diário — Seguidores",S.dist.planDiarioSeg,"setPlanDiarioSegDist")}
    </div>`;

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário — Distribuição de Conteúdo</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)}</div>
      </div>
      <button onclick="copyResumoDist()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all .15s">
        📋 Copiar resumo
      </button>
    </div>
    ${S.dist.error?`<div class="err">⚠️ ${S.dist.error}</div>`:""}
    <div style="display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start">
      <div>
        ${planEditor}
        ${section("📶 Total",tot,"plan até hj",S.dist.planAteHoje,S.dist.planAteHojeSeg)}
        ${section("⬅️ Ontem",ontem,"plan ontem",S.dist.planDiario,S.dist.planDiarioSeg)}
        ${section("⬇️ Hoje",hoje,"plan hj",S.dist.planDiario,S.dist.planDiarioSeg,true)}
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;position:sticky;top:70px">
        <pre id="resumo-preview-dist" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.8;margin:0;user-select:all">${resumoText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
      </div>
    </div>`;
  el._resumoText=resumoText;
  requestAnimationFrame(()=>{
    const fid=document.activeElement?.id;
    const editableIds=["manual-spend-input-dist","plan-ate-hoje-inv","plan-ate-hoje-seg","plan-diario-inv","plan-diario-seg"];
    if(editableIds.includes(fid)){
      const s=document.getElementById(fid);
      if(s){const l=s.value.length;s.setSelectionRange(l,l);}
    }
  });
}
function setManualSpendHojeDist(v){
  const n=parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",","."));
  S.dist.manualSpendHoje=(isNaN(n)||n<=0)?null:n;
  renderResumoDist();
}
function clearManualSpendHojeDist(){ S.dist.manualSpendHoje=null; renderResumoDist(); }
function setPlanAteHojeDist(v){
  const n=parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",","."));
  S.dist.planAteHoje=(isNaN(n)||n<0)?null:n; renderResumoDist();
}
function setPlanAteHojeSegDist(v){
  const n=parseInt(String(v).replace(/\D/g,""),10);
  S.dist.planAteHojeSeg=(isNaN(n)||n<0)?null:n; renderResumoDist();
}
function setPlanDiarioDist(v){
  const n=parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",","."));
  S.dist.planDiario=(isNaN(n)||n<0)?null:n; renderResumoDist();
}
function setPlanDiarioSegDist(v){
  const n=parseInt(String(v).replace(/\D/g,""),10);
  S.dist.planDiarioSeg=(isNaN(n)||n<0)?null:n; renderResumoDist();
}
function copyResumoDist(){
  const el=document.getElementById("page-resumo");
  const text=el?._resumoText||"";if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    const btns=document.querySelectorAll("button");
    btns.forEach(b=>{if(b.textContent.includes("Copiar resumo")){const orig=b.innerHTML;b.innerHTML="✓ Copiado!";setTimeout(()=>{b.innerHTML=orig;},1800);}});
  }).catch(()=>alert("Selecione o texto manualmente."));
}

render();
loadData();
</script>
</body>
</html>
