<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sessão Estratégica — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);
  --hbg:rgba(12,17,28,.92);
  --txt:#e8edf6;--txt-s:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#e8621a;
  --green:#34d399;--amber:#fbbf24;--red:#f87171;--blue:#3b82f6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ── Header ──────────────────────────────────────────────────── */
#hdr{position:sticky;top:0;z-index:20;background:var(--hbg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 24px;height:52px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.hprod{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:var(--txt-s);
  display:flex;align-items:center;gap:6px;flex-shrink:0}
.hprod-dot{width:8px;height:8px;border-radius:50%;background:#34d399;flex-shrink:0}
.htabs{display:flex;align-items:center;gap:4px}
.htab{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
  color:var(--muted);border:none;background:transparent;font-family:'DM Sans',sans-serif;
  transition:all .15s;white-space:nowrap}
.htab.active{background:rgba(232,98,26,.15);color:#e8621a}
.htab:hover:not(.active){background:rgba(255,255,255,.05);color:var(--txt)}
.hright{display:flex;align-items:center;gap:5px;flex-shrink:0}
.qbtn{padding:4px 9px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;
  color:var(--muted);border:1px solid transparent;background:transparent;
  font-family:'DM Sans',sans-serif;transition:all .15s}
.qbtn.active{background:rgba(232,98,26,.15);border-color:rgba(232,98,26,.35);color:#e8621a}
.qbtn:hover:not(.active){background:rgba(255,255,255,.05);color:var(--txt)}
.dc{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--txt-s);
  border-radius:5px;padding:4px 7px;font-size:11px;font-family:'JetBrains Mono',monospace;
  font-weight:500;width:96px;outline:none}
.dc:focus{border-color:rgba(232,98,26,.5)}
.sep{color:var(--hint);font-size:11px;padding:0 1px}
.ubtn{padding:5px 11px;background:rgba(232,98,26,.2);border:1px solid rgba(232,98,26,.4);
  color:#e8621a;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all .15s}
.ubtn:hover{background:rgba(232,98,26,.35)}

/* ── Layout ──────────────────────────────────────────────────── */
#root{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}

/* ── Page title ──────────────────────────────────────────────── */
.ptitle{font-family:'Sora',sans-serif;font-size:22px;font-weight:700;color:var(--txt-s);margin-bottom:3px}
.psub{font-size:12px;color:var(--muted);margin-bottom:20px}

/* ── KPI cards ───────────────────────────────────────────────── */
.krow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:14px 18px;min-width:130px;flex:1}
.kc-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin-bottom:6px}
.kc-v{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--txt-s)}
.kc-s{font-size:11px;color:var(--muted);margin-top:4px}

/* ── Chart card ──────────────────────────────────────────────── */
.cc{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;margin-bottom:16px}
.cc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cc-l{font-size:12px;font-weight:600;color:var(--txt-s)}
.cc-m{font-size:11px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.cgrid{grid-template-columns:1fr}}

/* ── Today / 3d cards ────────────────────────────────────────── */
.sg{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;margin-bottom:16px}
.sg-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin-bottom:12px}
.sgrid{display:flex;gap:20px;flex-wrap:wrap}
.si{min-width:80px}
.si-l{font-size:10px;color:var(--muted);margin-bottom:3px}
.si-v{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--txt-s)}

/* ── Ads table ───────────────────────────────────────────────── */
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse}
th{padding:10px 12px;text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);cursor:pointer;border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);white-space:nowrap;user-select:none}
th:last-child{border-right:none}
th.sa{color:var(--txt-s)}
td{padding:9px 12px;text-align:center;font-size:12px;
  border-bottom:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.03);
  font-family:'JetBrains Mono',monospace}
td:last-child{border-right:none}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.td-name{text-align:left;font-family:'DM Sans',sans-serif;font-weight:600;
  color:var(--txt-s);font-size:11px;max-width:240px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ig{font-size:10px;color:#e8621a;text-decoration:none;margin-left:6px;opacity:.7}
.ig:hover{opacity:1}
</style>
</head>
<body>

<div id="hdr">
  <div class="hprod"><span class="hprod-dot"></span>Sessão Estratégica</div>
  <div class="htabs" id="htabs"></div>
  <div class="hright" id="hright"></div>
</div>

<div id="root">
  <div id="page-principal"  class="page active"></div>
  <div id="page-trafego"   class="page"></div>
  <div id="page-anuncios"  class="page"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const SHEET_ID = "17cGj1d1k9sUxMi4bpsyfXI_ha3voP2d08jFm_QnjEvk";
const API_KEY  = "AIzaSyDxMp-u0RUfy-Xv0jICULZbJGpuAUxqQPI";
const TAB_META = "Base meta - consultoria";
const TAB_FORM = "Base formulário - consultoria";
const CACHE_KEY = "dash_sessao_v1";
const IS_FILE   = location.protocol==="file:";

// Metas
const META_CPF     = 25.00;   // custo/formulário (lower)
const META_CONNECT = 60;      // connect rate % (higher)
const META_CPC     = 3.75;    // (lower)
const META_CTR     = 1.20;    // % (higher)
const META_CPM     = 45.00;   // (lower)

const TABS=[
  {id:"principal", l:"⬡ Principal"},
  {id:"trafego",   l:"◈ Métricas Tráfego"},
  {id:"anuncios",  l:"✦ Anúncios"},
];

// ── State ─────────────────────────────────────────────────────────────────
const S={
  tab:"principal",
  startDate:"",  endDate:"",  activeQuick:"mes",
  tStartDate:"", tEndDate:"", tActiveQuick:"7d",
  aStartDate:"", aEndDate:"", aActiveQuick:"mes",
  aSort:{col:"spend",dir:"desc"},
  // data
  meta:{},            // date → {spend,clicks,impressions,lpv}
  metaByAdId:{},      // adId → {adName,spend,clicks,impressions,lpv,igUrl}
  metaByAdIdDate:{},  // adId → date → {spend,clicks,impressions,lpv,igUrl}
  forms:{},           // date → {total,qualified,unqualified}
  formsByAdDate:{},   // adId → date → {total,qualified,unqualified}
  updated:null,
};

// ── Date helpers ──────────────────────────────────────────────────────────
function nowSP(){
  const n=new Date(), off=n.getTimezoneOffset()*60000;
  return new Date(n.getTime()-off-3*3600000);
}
function todaySP(){return nowSP().toISOString().slice(0,10);}
function addDays(iso,d){
  const dt=new Date(iso+"T12:00:00Z");
  dt.setUTCDate(dt.getUTCDate()+d);
  return dt.toISOString().slice(0,10);
}
function monthStart(iso){return iso.slice(0,8)+"01";}
function toISO(s){
  if(!s)return"";
  s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return`${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(m)return`${m[3]}-${m[2]}-${m[1]}`;
  return"";
}
function fmtD(iso){if(!iso)return"";const[,m,d]=iso.split("-");return`${d}/${m}`;}
function fmtDF(iso){if(!iso)return"";const[y,m,d]=iso.split("-");return`${d}/${m}/${y}`;}

// ── Format ────────────────────────────────────────────────────────────────
function fBRL(v){return"R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fPct(v){return v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";}
function fInt(v){return Math.round(v).toLocaleString("pt-BR");}
function parseBRL(s){
  if(!s||s==="-")return 0;
  return parseFloat(String(s).replace(/R\$\s*/g,"").replace(/\./g,"").replace(",",".").trim())||0;
}
function parseI(s){return parseInt(String(s).replace(/\./g,""))||0;}

// ── Colors ────────────────────────────────────────────────────────────────
function sColor(val,meta,higher){
  if(!meta||!val||isNaN(val))return"#f1f5fb";
  const r=higher?val/meta:meta/val;
  if(r>=1)return"#34d399";
  if(r>=0.9)return"#fbbf24";
  return"#f87171";
}
function sBorder(val,meta,higher){
  const c=sColor(val,meta,higher);
  if(c==="#34d399")return"rgba(52,211,153,.22)";
  if(c==="#fbbf24")return"rgba(251,191,36,.22)";
  if(c==="#f87171")return"rgba(248,113,113,.22)";
  return"rgba(255,255,255,.07)";
}

// ── Quick presets ─────────────────────────────────────────────────────────
function quickDates(k){
  const t=todaySP();
  if(k==="hoje")  return{s:t,e:t};
  if(k==="ontem") return{s:addDays(t,-1),e:addDays(t,-1)};
  if(k==="7d")    return{s:addDays(t,-6),e:t};
  if(k==="30d")   return{s:addDays(t,-29),e:t};
  if(k==="mes")   return{s:monthStart(t),e:t};
  return{s:"",e:""};
}

// ── Ad ID helper ──────────────────────────────────────────────────────────
function extractAdId(raw){
  if(!raw)return null;
  const s=String(raw).trim();
  if(/^\d{15,20}$/.test(s))return s;
  const m=s.match(/\d{15,20}/);
  return m?m[0]:null;
}

// ── Parse sheet ───────────────────────────────────────────────────────────
function parseSheet(raw){
  const rows=(raw.values||[]);
  if(!rows.length)return[];
  const h=rows[0];
  return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>{o[k]=r[i]||"";});return o;});
}

// ── Fetch paged ───────────────────────────────────────────────────────────
async function fetchPaged(sheetId,tab,apiKey,block=5000){
  const base=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/`;
  const enc=encodeURIComponent(tab);
  const hr=await fetch(`${base}${enc}!A1:ZZ1?key=${apiKey}`);
  if(!hr.ok)throw new Error(`HTTP ${hr.status} ao carregar "${tab}"`);
  const hj=await hr.json();
  const header=(hj.values||[])[0]||[];
  let all=[header];
  let row=2;
  while(true){
    const r=await fetch(`${base}${enc}!A${row}:ZZ${row+block-1}?key=${apiKey}`);
    if(!r.ok)break;
    const j=await r.json();
    const v=j.values||[];
    if(!v.length)break;
    all=[...all,...v];
    if(v.length<block)break;
    row+=block;
  }
  return{values:all};
}

// ── Load data ─────────────────────────────────────────────────────────────
async function loadData(force=false){
  if(!force&&!IS_FILE){
    try{
      const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
      if(c&&c.mj&&c.fj&&c.date===todaySP()){processData(c.mj,c.fj);return;}
    }catch(e){}
  }
  document.getElementById("root").innerHTML=
    `<div style="color:#8a96ab;padding:60px;text-align:center;font-size:14px">Carregando dados…</div>`;
  try{
    const[mRaw,fRaw]=await Promise.all([
      fetchPaged(SHEET_ID,TAB_META,API_KEY),
      fetchPaged(SHEET_ID,TAB_FORM,API_KEY),
    ]);
    if(!IS_FILE){
      try{localStorage.setItem(CACHE_KEY,JSON.stringify({mj:mRaw,fj:fRaw,date:todaySP()}));}catch(e){}
    }
    processData(mRaw,fRaw);
  }catch(err){
    document.getElementById("root").innerHTML=
      `<div style="color:#f87171;padding:60px;text-align:center">${err.message}</div>`;
  }
}

// ── Process data ──────────────────────────────────────────────────────────
function processData(mRaw,fRaw){
  const mRows=parseSheet(mRaw);
  const fRows=parseSheet(fRaw);

  // ── Meta: group by date+adId (sum across platforms) ──────────────────
  const groups=new Map(); // `date|adId` → obj
  for(const r of mRows){
    const date=String(r["Date"]||"").trim();
    if(!date||date==="Date")continue;
    const adId=String(r["Ad ID"]||"").trim(); if(!adId)continue;
    const adName=String(r["Ad Name"]||"").trim();
    const spend=parseBRL(r["Spend (Cost, Amount Spent)"]||"0");
    const clicks=parseI(r["Action Link Clicks"]||"0");
    const imps=parseI(r["Impressions"]||"0");
    const lpv=parseI(r["Action Landing Page View"]||"0");
    const igUrl=r["Instagram Permalink URL"]||"";
    const k=`${date}|${adId}`;
    if(!groups.has(k))groups.set(k,{date,adId,adName,spend:0,clicks:0,imps:0,lpv:0,igUrl:""});
    const g=groups.get(k);
    g.spend+=spend; g.clicks+=clicks; g.imps+=imps; g.lpv+=lpv;
    if(!g.igUrl&&igUrl)g.igUrl=igUrl;
    if(!g.adName&&adName)g.adName=adName;
  }

  const mD={}, mByAdId={}, mByAdIdDate={};
  for(const[,g] of groups){
    const{date,adId,adName,spend,clicks,imps:impressions,lpv,igUrl}=g;
    // daily total
    if(!mD[date])mD[date]={spend:0,clicks:0,impressions:0,lpv:0};
    mD[date].spend+=spend; mD[date].clicks+=clicks;
    mD[date].impressions+=impressions; mD[date].lpv+=lpv;
    // by adId
    if(!mByAdId[adId])mByAdId[adId]={adName,spend:0,clicks:0,impressions:0,lpv:0,igUrl:""};
    mByAdId[adId].spend+=spend; mByAdId[adId].clicks+=clicks;
    mByAdId[adId].impressions+=impressions; mByAdId[adId].lpv+=lpv;
    if(!mByAdId[adId].igUrl&&igUrl)mByAdId[adId].igUrl=igUrl;
    if(!mByAdId[adId].adName&&adName)mByAdId[adId].adName=adName;
    // by adId + date
    if(!mByAdIdDate[adId])mByAdIdDate[adId]={};
    if(!mByAdIdDate[adId][date])mByAdIdDate[adId][date]={spend:0,clicks:0,impressions:0,lpv:0,igUrl:""};
    const bd=mByAdIdDate[adId][date];
    bd.spend+=spend; bd.clicks+=clicks; bd.impressions+=impressions; bd.lpv+=lpv;
    if(!bd.igUrl&&igUrl)bd.igUrl=igUrl;
  }

  // ── Forms: by date and by adId ────────────────────────────────────────
  const fD={}, fByAdDate={};
  for(const r of fRows){
    const date=toISO(r["Data"]||""); if(!date)continue;
    const cl=(r["classificação"]||"").trim();
    const qual=cl==="Qualificado";
    const disq=cl==="Desqualificado";
    const adId=extractAdId(r["utm_content"]||"");
    // daily
    if(!fD[date])fD[date]={total:0,qualified:0,unqualified:0};
    fD[date].total++;
    if(qual)fD[date].qualified++;
    if(disq)fD[date].unqualified++;
    // by adId
    if(adId){
      if(!fByAdDate[adId])fByAdDate[adId]={};
      if(!fByAdDate[adId][date])fByAdDate[adId][date]={total:0,qualified:0,unqualified:0};
      fByAdDate[adId][date].total++;
      if(qual)fByAdDate[adId][date].qualified++;
      if(disq)fByAdDate[adId][date].unqualified++;
    }
  }

  S.meta=mD; S.metaByAdId=mByAdId; S.metaByAdIdDate=mByAdIdDate;
  S.forms=fD; S.formsByAdDate=fByAdDate;
  S.updated=nowSP().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});

  // Init dates
  if(!S.startDate){const{s,e}=quickDates("mes");S.startDate=s;S.endDate=e;}
  if(!S.tStartDate){const{s,e}=quickDates("7d");S.tStartDate=s;S.tEndDate=e;}
  if(!S.aStartDate){const{s,e}=quickDates("mes");S.aStartDate=s;S.aEndDate=e;}

  document.getElementById("root").innerHTML=`
    <div id="page-principal"  class="page"></div>
    <div id="page-trafego"   class="page"></div>
    <div id="page-anuncios"  class="page"></div>`;

  renderAll();
}

// ── Aggregators ───────────────────────────────────────────────────────────
function sumMeta(s,e){
  let spend=0,clicks=0,impressions=0,lpv=0;
  for(const[d,v] of Object.entries(S.meta)){
    if(d>=s&&d<=e){spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;lpv+=v.lpv;}
  }
  return{spend,clicks,impressions,lpv};
}
function sumForms(s,e){
  let total=0,qualified=0,unqualified=0;
  for(const[d,v] of Object.entries(S.forms)){
    if(d>=s&&d<=e){total+=v.total;qualified+=v.qualified;unqualified+=v.unqualified;}
  }
  return{total,qualified,unqualified};
}
function dailySeries(s,e){
  const days=[];let cur=s;
  while(cur<=e){days.push(cur);cur=addDays(cur,1);}
  return days.map(d=>({
    d,
    spend:(S.meta[d]||{}).spend||0,
    clicks:(S.meta[d]||{}).clicks||0,
    impressions:(S.meta[d]||{}).impressions||0,
    lpv:(S.meta[d]||{}).lpv||0,
    forms:(S.forms[d]||{}).total||0,
    qualified:(S.forms[d]||{}).qualified||0,
    unqualified:(S.forms[d]||{}).unqualified||0,
  }));
}

// ── Canvas chart helpers ──────────────────────────────────────────────────
const CG="rgba(255,255,255,0.06)";
const CT="#6b7689";

function drawBars(cvs,data,color,fmtFn,metaVal){
  const ctx=cvs.getContext("2d");
  const W=cvs.offsetWidth||600, H=120;
  cvs.width=W; cvs.height=H;
  if(!data.length){ctx.clearRect(0,0,W,H);return;}
  const vals=data.map(d=>d.v);
  const max=Math.max(...vals,(metaVal||0))*1.15||1;
  const pad={t:8,b:24,l:4,r:4};
  const w=W-pad.l-pad.r, h=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  // grid
  [0.5,1].forEach(f=>{
    const y=pad.t+h*(1-f);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+w,y);
    ctx.strokeStyle=CG;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=CT;ctx.font="9px 'JetBrains Mono'";ctx.textAlign="right";
    ctx.fillText(fmtFn(max*f),pad.l+42,y-2);
  });
  // meta line
  if(metaVal){
    const my=pad.t+h*(1-metaVal/max);
    ctx.beginPath();ctx.moveTo(pad.l,my);ctx.lineTo(pad.l+w,my);
    ctx.strokeStyle="rgba(251,191,36,.5)";ctx.setLineDash([4,3]);ctx.lineWidth=1;ctx.stroke();
    ctx.setLineDash([]);
  }
  // bars
  const n=data.length;
  const bw=Math.max(2,Math.floor(w/n*0.7));
  const gap=(w-bw*n)/(n+1);
  data.forEach((pt,i)=>{
    const x=pad.l+gap*(i+1)+bw*i;
    const bh=Math.max(1,h*(pt.v/max));
    ctx.fillStyle=color; ctx.globalAlpha=0.75;
    ctx.fillRect(x,pad.t+h-bh,bw,bh);
    ctx.globalAlpha=1;
  });
  // x labels
  const step=Math.max(1,Math.floor(n/7));
  data.forEach((pt,i)=>{
    if(i%step!==0&&i!==n-1)return;
    const x=pad.l+gap*(i+1)+bw*i+bw/2;
    ctx.fillStyle=CT;ctx.font="9px 'JetBrains Mono'";ctx.textAlign="center";
    ctx.fillText(fmtD(pt.d),x,H-pad.b+11);
  });
}

function drawLine(cvs,data,color,fmtFn,metaVal){
  const ctx=cvs.getContext("2d");
  const W=cvs.offsetWidth||600, H=120;
  cvs.width=W; cvs.height=H;
  if(!data.length){ctx.clearRect(0,0,W,H);return;}
  const vals=data.map(d=>d.v);
  const max=Math.max(...vals,(metaVal||0))*1.15||1;
  const pad={t:8,b:24,l:4,r:4};
  const w=W-pad.l-pad.r, h=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  [0.5,1].forEach(f=>{
    const y=pad.t+h*(1-f);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+w,y);
    ctx.strokeStyle=CG;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=CT;ctx.font="9px 'JetBrains Mono'";ctx.textAlign="right";
    ctx.fillText(fmtFn(max*f),pad.l+44,y-2);
  });
  if(metaVal){
    const my=pad.t+h*(1-metaVal/max);
    ctx.beginPath();ctx.moveTo(pad.l,my);ctx.lineTo(pad.l+w,my);
    ctx.strokeStyle="rgba(251,191,36,.5)";ctx.setLineDash([4,3]);ctx.lineWidth=1;ctx.stroke();
    ctx.setLineDash([]);
  }
  const n=data.length;
  // area fill
  ctx.beginPath();
  data.forEach((pt,i)=>{
    const x=pad.l+Math.round(i/(n-1||1)*w);
    const y=pad.t+h*(1-pt.v/max);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  const lx=pad.l+w;
  ctx.lineTo(lx,pad.t+h);ctx.lineTo(pad.l,pad.t+h);ctx.closePath();
  // parse color to rgba fill
  let fc="rgba(59,130,246,.08)";
  if(color==="#34d399")fc="rgba(52,211,153,.08)";
  else if(color==="#fbbf24")fc="rgba(251,191,36,.08)";
  else if(color==="#f87171")fc="rgba(248,113,113,.08)";
  else if(color==="#e8621a")fc="rgba(232,98,26,.08)";
  ctx.fillStyle=fc; ctx.fill();
  // dots
  data.forEach((pt,i)=>{
    const x=pad.l+Math.round(i/(n-1||1)*w);
    const y=pad.t+h*(1-pt.v/max);
    ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  });
  // labels
  const step=Math.max(1,Math.floor(n/7));
  data.forEach((pt,i)=>{
    if(i%step!==0&&i!==n-1)return;
    const x=pad.l+Math.round(i/(n-1||1)*w);
    ctx.fillStyle=CT;ctx.font="9px 'JetBrains Mono'";ctx.textAlign="center";
    ctx.fillText(fmtD(pt.d),x,H-pad.b+11);
  });
}

// ── Header ────────────────────────────────────────────────────────────────
function renderHeader(){
  document.getElementById("htabs").innerHTML=TABS.map(t=>
    `<button class="htab${S.tab===t.id?" active":""}" onclick="switchTab('${t.id}')">${t.l}</button>`
  ).join("");

  let s,e,q;
  if(S.tab==="principal"){s=S.startDate;e=S.endDate;q=S.activeQuick;}
  else if(S.tab==="trafego"){s=S.tStartDate;e=S.tEndDate;q=S.tActiveQuick;}
  else{s=S.aStartDate;e=S.aEndDate;q=S.aActiveQuick;}

  const presets=[{k:"hoje",l:"Hoje"},{k:"ontem",l:"Ontem"},{k:"7d",l:"7 dias"},{k:"30d",l:"30 dias"},{k:"mes",l:"Este mês"}];
  document.getElementById("hright").innerHTML=
    presets.map(p=>`<button class="qbtn${q===p.k?" active":""}" onclick="applyQ('${p.k}')">${p.l}</button>`).join("")+
    `<input type="date" class="dc" value="${s}" onchange="onDC('s',this.value)"/>
     <span class="sep">→</span>
     <input type="date" class="dc" value="${e}" onchange="onDC('e',this.value)"/>
     <button class="ubtn" onclick="loadData(true)">↻ Atualizar</button>`;

  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const pg=document.getElementById(`page-${S.tab}`);
  if(pg)pg.classList.add("active");
}

function switchTab(id){
  S.tab=id; renderHeader();
  if(id==="principal")renderPrincipal();
  else if(id==="trafego")renderTrafego();
  else renderAnuncios();
}

function applyQ(k){
  const{s,e}=quickDates(k);
  if(S.tab==="principal"){S.startDate=s;S.endDate=e;S.activeQuick=k;}
  else if(S.tab==="trafego"){S.tStartDate=s;S.tEndDate=e;S.tActiveQuick=k;}
  else{S.aStartDate=s;S.aEndDate=e;S.aActiveQuick=k;}
  renderHeader();
  if(S.tab==="principal")renderPrincipal();
  else if(S.tab==="trafego")renderTrafego();
  else renderAnuncios();
}

function onDC(w,v){
  if(S.tab==="principal"){if(w==="s")S.startDate=v;else S.endDate=v;S.activeQuick="";}
  else if(S.tab==="trafego"){if(w==="s")S.tStartDate=v;else S.tEndDate=v;S.tActiveQuick="";}
  else{if(w==="s")S.aStartDate=v;else S.aEndDate=v;S.aActiveQuick="";}
  renderHeader();
  if(S.tab==="principal")renderPrincipal();
  else if(S.tab==="trafego")renderTrafego();
  else renderAnuncios();
}

  });
}

// ── Anúncios ──────────────────────────────────────────────────────────────
function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;
  const s=S.aStartDate, e=S.aEndDate;

  // Build per-ad rows
  const rows=[];
  for(const[adId,meta] of Object.entries(S.metaByAdId)){
    const byDate=S.metaByAdIdDate[adId]||{};
    let spend=0,clicks=0,impressions=0,lpv=0,igUrl="";
    for(const[d,v] of Object.entries(byDate)){
      if(d>=s&&d<=e){spend+=v.spend;clicks+=v.clicks;impressions+=v.impressions;lpv+=v.lpv;if(!igUrl&&v.igUrl)igUrl=v.igUrl;}
    }
    if(spend===0)continue;
    let forms=0,qualified=0,unqualified=0;
    const fByD=S.formsByAdDate[adId]||{};
    for(const[d,v] of Object.entries(fByD)){
      if(d>=s&&d<=e){forms+=v.total;qualified+=v.qualified;unqualified+=v.unqualified;}
    }
    const cpc=clicks>0?spend/clicks:0;
    const ctr=impressions>0?(clicks/impressions)*100:0;
    const cpm=impressions>0?(spend/impressions)*1000:0;
    const cpf=forms>0?spend/forms:0;
    const cpfQ=qualified>0?spend/qualified:0;
    const con=forms>0?(qualified/forms)*100:0;
    rows.push({adId,adName:meta.adName,spend,clicks,impressions,lpv,forms,qualified,unqualified,cpc,ctr,cpm,cpf,cpfQ,con,igUrl});
  }

  // Totals
  const tot=rows.reduce((a,r)=>({
    spend:a.spend+r.spend,clicks:a.clicks+r.clicks,impressions:a.impressions+r.impressions,
    lpv:a.lpv+r.lpv,forms:a.forms+r.forms,qualified:a.qualified+r.qualified,unqualified:a.unqualified+r.unqualified,
  }),{spend:0,clicks:0,impressions:0,lpv:0,forms:0,qualified:0,unqualified:0});
  const tCpc=tot.clicks>0?tot.spend/tot.clicks:0;
  const tCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;
  const tCpm=tot.impressions>0?(tot.spend/tot.impressions)*1000:0;
  const tCpf=tot.forms>0?tot.spend/tot.forms:0;
  const tCpfQ=tot.qualified>0?tot.spend/tot.qualified:0;
  const tCon=tot.forms>0?(tot.qualified/tot.forms)*100:0;

  // Sort
  const{col,dir}=S.aSort;
  const sorted=[...rows].sort((a,b)=>{
    const av=a[col]??0, bv=b[col]??0;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });

  function th(c,lbl){
    const act=col===c;
    const arr=act?(dir==="asc"?" ↑":" ↓"):" ↕";
    return`<th class="${act?"sa":""}" onclick="sortAds('${c}')">${lbl}<span style="color:${act?"#e8621a":"#6b7689"};font-size:10px;margin-left:2px">${arr}</span></th>`;
  }

  el.innerHTML=`
<div class="ptitle">Anúncios</div>
<div class="psub">atualizado ${S.updated||"—"} · ${rows.length} anúncios com investimento no período</div>

<div class="krow" style="margin-bottom:20px">
  <div class="kc"><div class="kc-l">Investimento</div><div class="kc-v">${fBRL(tot.spend)}</div></div>
  <div class="kc"><div class="kc-l">Formulários</div><div class="kc-v">${fInt(tot.forms)}</div><div class="kc-s">${fInt(tot.qualified)} qualif. · ${fInt(tot.unqualified)} desqualif.</div></div>
  <div class="kc" style="border-color:${sBorder(tCpf,META_CPF,false)}"><div class="kc-l">Custo/Formulário</div><div class="kc-v" style="color:${sColor(tCpf,META_CPF,false)}">${tCpf>0?fBRL(tCpf):"—"}</div><div class="kc-s">Meta: ${fBRL(META_CPF)}</div></div>
  <div class="kc"><div class="kc-l">Custo/Form Quente</div><div class="kc-v">${tCpfQ>0?fBRL(tCpfQ):"—"}</div><div class="kc-s">${fInt(tot.qualified)} qualificados</div></div>
  <div class="kc" style="border-color:${sBorder(tCon,META_CONNECT,true)}"><div class="kc-l">Connect Rate</div><div class="kc-v" style="color:${sColor(tCon,META_CONNECT,true)}">${tCon>0?fPct(tCon):"—"}</div><div class="kc-s">Meta: ${META_CONNECT}%</div></div>
  <div class="kc" style="border-color:${sBorder(tCpc,META_CPC,false)}"><div class="kc-l">CPC</div><div class="kc-v" style="color:${sColor(tCpc,META_CPC,false)}">${tCpc>0?fBRL(tCpc):"—"}</div><div class="kc-s">Meta: ${fBRL(META_CPC)}</div></div>
  <div class="kc" style="border-color:${sBorder(tCtr,META_CTR,true)}"><div class="kc-l">CTR</div><div class="kc-v" style="color:${sColor(tCtr,META_CTR,true)}">${tCtr>0?fPct(tCtr):"—"}</div><div class="kc-s">Meta: ${META_CTR}%</div></div>
  <div class="kc" style="border-color:${sBorder(tCpm,META_CPM,false)}"><div class="kc-l">CPM</div><div class="kc-v" style="color:${sColor(tCpm,META_CPM,false)}">${tCpm>0?fBRL(tCpm):"—"}</div><div class="kc-s">Meta: ${fBRL(META_CPM)}</div></div>
</div>

<div class="tw"><table>
<thead><tr>
  ${th("adName","Anúncio")}
  ${th("spend","Invest.")}
  ${th("forms","Forms")}
  ${th("qualified","Qualif.")}
  ${th("unqualified","Desqualif.")}
  ${th("con","Connect Rate")}
  ${th("cpf","Custo/Form")}
  ${th("cpfQ","Custo/Quente")}
  ${th("cpc","CPC")}
  ${th("ctr","CTR")}
  ${th("cpm","CPM")}
  ${th("clicks","Cliques")}
  ${th("impressions","Impressões")}
</tr></thead>
<tbody>
${sorted.map(r=>`<tr>
  <td class="td-name" title="${r.adName}">${r.adName}${r.igUrl?`<a class="ig" href="${r.igUrl}" target="_blank">↗</a>`:""}</td>
  <td>${fBRL(r.spend)}</td>
  <td>${r.forms>0?fInt(r.forms):`<span style="color:#6b7689">—</span>`}</td>
  <td style="color:#34d399">${r.qualified>0?fInt(r.qualified):`<span style="color:#6b7689">—</span>`}</td>
  <td style="color:#f87171">${r.unqualified>0?fInt(r.unqualified):`<span style="color:#6b7689">—</span>`}</td>
  <td style="color:${r.forms>0?sColor(r.con,META_CONNECT,true):"#6b7689"}">${r.forms>0?fPct(r.con):"—"}</td>
  <td style="color:${r.forms>0?sColor(r.cpf,META_CPF,false):"#6b7689"}">${r.forms>0?fBRL(r.cpf):"—"}</td>
  <td>${r.qualified>0?fBRL(r.cpfQ):`<span style="color:#6b7689">—</span>`}</td>
  <td style="color:${sColor(r.cpc,META_CPC,false)}">${r.clicks>0?fBRL(r.cpc):"—"}</td>
  <td style="color:${sColor(r.ctr,META_CTR,true)}">${r.impressions>0?fPct(r.ctr):"—"}</td>
  <td style="color:${sColor(r.cpm,META_CPM,false)}">${r.impressions>0?fBRL(r.cpm):"—"}</td>
  <td>${fInt(r.clicks)}</td>
  <td>${fInt(r.impressions)}</td>
</tr>`).join("")}
</tbody>
</table></div>`;
}

function sortAds(col){
  S.aSort.dir=S.aSort.col===col?(S.aSort.dir==="asc"?"desc":"asc"):"desc";
  S.aSort.col=col;
  renderAnuncios();
}

// ── Init ──────────────────────────────────────────────────────────────────
function renderAll(){
  renderHeader();
  renderPrincipal();
}

loadData();
</script>
</body>
</html>
