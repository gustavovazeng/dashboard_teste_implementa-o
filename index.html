// ── Render Anúncios ────────────────────────────────────────────────────────
function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;

  // Constrói tabela de anúncios no período selecionado
  // Para cada advCode, soma invest da base Meta e vendas da base Vendas
  // cruzando pelo Ad ID
  function buildAdRows(start,end){
    const dd=D();
    const currentFunil=S.currentFunil;
    const principalId=currentFunil==="mapa"?"mapa":"manual";

    // Passo 0: mapa de identidades unificado (email + cpf + tel → chave canônica)
    // Garante que o mesmo comprador é reconhecido mesmo usando campos diferentes em compras distintas
    const identMap=new Map();
    function getIdKeys(r){
      const ks=[];
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      if(em)  ks.push("e:"+em);
      if(cpf) ks.push("c:"+cpf);
      if(tel) ks.push("t:"+tel);
      return ks;
    }
    for(const r of dd.funilRows){
      const ks=getIdKeys(r); if(!ks.length) continue;
      let canonical=null;
      for(const k of ks){ if(identMap.has(k)){canonical=identMap.get(k);break;} }
      if(!canonical) canonical=ks[0];
      for(const k of ks) identMap.set(k,canonical);
    }
    function getCanonical(r){
      const ks=getIdKeys(r);
      for(const k of ks){ if(identMap.has(k)) return identMap.get(k); }
      return ks[0]||null;
    }

    // Passo A: adId → Set de eventos de compra (canonical+data) do produto principal
    // Usa chave canonical+data (igual ao dedup de vendasByAdDate) para alinhar os dois lados
    const adBuyersMap=new Map();  // adId → Set de eventKeys ("canonical|date")
    for(const r of dd.funilRows){
      const dt=toISO(r["Data da compra"]||"")||"";
      if(dt<start||dt>end) continue;
      if((r["Status da compra"]||"").trim()!=="Paga") continue;
      if(classifyProduct(r["Nome do produto"]||"",currentFunil)!==principalId) continue;
      const adId=extractAdId(r["Ad Id"]||""); if(!adId) continue;
      const key=getCanonical(r); if(!key) continue;
      const eventKey=key+"|"+dt;
      if(!adBuyersMap.has(adId)) adBuyersMap.set(adId,new Set());
      adBuyersMap.get(adId).add(eventKey);
    }

    // Passo B: evento (canonical+data) → totalGasto naquele dia (todos os produtos Paga)
    const eventTotalSpent=new Map();
    for(const r of dd.funilRows){
      const dt=toISO(r["Data da compra"]||"")||"";
      if(dt<start||dt>end) continue;
      if((r["Status da compra"]||"").trim()!=="Paga") continue;
      const key=getCanonical(r); if(!key) continue;
      const eventKey=key+"|"+dt;
      const val=parseBRL(r["Valor do produto"]||"0");
      eventTotalSpent.set(eventKey,(eventTotalSpent.get(eventKey)||0)+val);
    }

    const rows=[];
    for(const [advCode,meta] of Object.entries(dd.metaByAd)){
      const byDate=dd.metaByAdByDate[advCode]||{};
      let spend=0,clicks=0,impressions=0;
      let igUrl="";
      const adIdsInPeriod=new Set();
      for(const [d,vals] of Object.entries(byDate)){
        if(d>=start && d<=end){
          spend+=vals.spend; clicks+=vals.clicks; impressions+=vals.impressions;
          vals.adIds.forEach(id=>adIdsInPeriod.add(id));
          if(!igUrl && vals.igUrl) igUrl=vals.igUrl;
        }
      }
      if(spend===0) continue;
      let qtd=0,valor=0,taxa=0;
      const useIds=adIdsInPeriod.size>0?adIdsInPeriod:meta.adIds;
      for(const adId of useIds){
        const byD=dd.vendasByAdDate[adId]||{};
        for(const [vd,vvals] of Object.entries(byD)){
          if(vd>=start && vd<=end){ qtd+=vvals.qtd; valor+=vvals.valor; taxa+=vvals.taxa; }
        }
      }
      if(!igUrl) igUrl=meta.igUrl;

      // Ticket Médio Ascensões: soma gasto de cada evento de compra atribuído a este ad
      let totalAscensoes=0;
      for(const adId of useIds){
        for(const eventKey of (adBuyersMap.get(adId)||new Set())){
          totalAscensoes+=(eventTotalSpent.get(eventKey)||0);
        }
      }

      const cpc=clicks>0?spend/clicks:0;
      const ctr=impressions>0?(clicks/impressions)*100:0;
      const cpm=impressions>0?(spend/impressions)*1000:0;
      const cpv=qtd>0?spend/qtd:0;
      const ticket=qtd>0?valor/qtd:0;
      const ticketAsc=qtd>0?totalAscensoes/qtd:0;
      rows.push({advCode,spend,clicks,impressions,qtd,valor,cpc,ctr,cpm,cpv,ticket,ticketAsc,igUrl});
    }
    return rows.filter(r=>r.spend>0);
  }

  const rows=buildAdRows(S.aStartDate,S.aEndDate);

  // Totais do período (usa dados diários já calculados)
  const dailyA=[];
  const _da=D();
  const allDates=new Set([...Object.keys(_da.meta),...Object.keys(_da.vendas)]);
  for(const d of Array.from(allDates).sort()){
    if(d<S.aStartDate||d>S.aEndDate) continue;
    const m=_da.meta[d]||{spend:0,clicks:0,impressions:0};
    const v=_da.vendas[d]||{qtd:0,valor:0};
    dailyA.push({spend:m.spend,clicks:m.clicks,impressions:m.impressions,qtd:v.qtd,valor:v.valor});
  }
  const tot=dailyA.reduce((a,d)=>({
    spend:a.spend+d.spend,clicks:a.clicks+d.clicks,
    impressions:a.impressions+d.impressions,qtd:a.qtd+d.qtd,valor:a.valor+d.valor
  }),{spend:0,clicks:0,impressions:0,qtd:0,valor:0});
  const totCpc=tot.clicks>0?tot.spend/tot.clicks:0;
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;
  const totCpm=tot.impressions>0?(tot.spend/tot.impressions)*1000:0;
  const totCpv=tot.qtd>0?tot.spend/tot.qtd:0;
  const totTicket=tot.qtd>0?tot.valor/tot.qtd:0;
  const rowsQtd=rows.reduce((a,r)=>a+r.qtd,0);
  // totTicketAsc = LTV: gasto total / compradores únicos do produto principal (= buildFunilData.ltv)
  // Usa mesma lógica de dedup que buildFunilData (identity+data) para incluir todos os compradores,
  // mesmo os sem adId, e inclui planLucro/Curso comprados em dias diferentes
  {
    const _dd=D();
    const _pId=S.currentFunil==="mapa"?"mapa":"manual";
    const _bSpent=new Map(); // identity → total gasto no período
    const _bPrinc=new Set(); // identities que compraram o produto principal
    for(const r of _dd.funilRows){
      const dt=toISO(r["Data da compra"]||"")||"";
      if(dt<S.aStartDate||dt>S.aEndDate) continue;
      if((r["Status da compra"]||"").trim()!=="Paga") continue;
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const id=em||cpf||tel; if(!id) continue;
      const val=parseBRL(r["Valor do produto"]||"0");
      _bSpent.set(id,(_bSpent.get(id)||0)+val);
      if(classifyProduct(r["Nome do produto"]||"",_pId)===_pId) _bPrinc.add(id);
    }
    let _fat=0; for(const k of _bPrinc) _fat+=(_bSpent.get(k)||0);
    var totTicketAsc=_bPrinc.size>0?_fat/_bPrinc.size:0;
  }

  // Ordenação
  const {col,dir}=S.aSort;
  const sorted=[...rows].sort((a,b)=>{
    const av=a[col]??0, bv=b[col]??0;
    if(typeof av==="string") return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });

  function thSort(c,lbl){
    const active=col===c;
    const arrow=active?(dir==="asc"?" ↑":" ↓"):" ↕";
    return `<th onclick="sortAnuncios('${c}')" style="padding:10px 14px;text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${active?"var(--text-strong)":"#7a6c5e"};cursor:pointer;user-select:none;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap">${lbl}<span style="color:${active?"#e8621a":"#d8cfc3"};font-size:10px;margin-left:3px">${arrow}</span></th>`;
  }

  function sc(v,meta,hi){return statusColor(v,meta,hi);}

  function thRow(c,lbl){
    const active=col===c;
    const arrow=active?(dir==="asc"?" ↑":" ↓"):" ↕";
    return `<th onclick="sortAnuncios('${c}')" style="padding:10px 14px;text-align:right;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${active?"var(--text)":"var(--hint)"};cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};font-size:9px;margin-left:3px">${arrow}</span></th>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Anúncios</div>
        <div class="hdr-sub">atualizado em: ${D().updated||"—"} · ${sorted.length} anúncios</div>
      </div>
      <div>${statusLegend()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <div class="section-lbl">Resumo do período</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:13px;margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">Investimento</div><div class="kc-val" style="font-size:18px">${fBRL(tot.spend)}</div></div>
      <div class="kc"><div class="kc-lbl">Vendas</div><div class="kc-val" style="font-size:18px">${tot.qtd}</div></div>
      <div class="kc" style="border-color:${statusBorder(totCpv,META_CPV,false)}"><div class="kc-lbl">Custo por Venda</div><div class="kc-val" style="color:${sc(totCpv,META_CPV,false)};font-size:18px">${fBRL(totCpv)}</div><div class="kc-sub">meta ${fBRL(META_CPV)}</div></div>
      <div class="kc" style="border-color:${statusBorder(totTicket,META_TICKET,true)}"><div class="kc-lbl">Ticket Médio Front</div><div class="kc-val" style="color:${sc(totTicket,META_TICKET,true)};font-size:18px">${fBRL(totTicket)}</div><div class="kc-sub">meta ${fBRL(META_TICKET)}</div></div>
      <div class="kc"><div class="kc-lbl">Ticket Médio Ascensões</div><div class="kc-val" style="font-size:18px">${fBRL(totTicketAsc)}</div><div class="kc-sub">todos os produtos</div></div>
      <div class="kc" style="border-color:${statusBorder(totCtr,METAS_T.ctr.val,true)}"><div class="kc-lbl">CTR</div><div class="kc-val" style="color:${sc(totCtr,METAS_T.ctr.val,true)};font-size:18px">${fPct(totCtr)}</div><div class="kc-sub">meta ${fPct(METAS_T.ctr.val)}</div></div>
      <div class="kc" style="border-color:${statusBorder(totCpm,METAS_T.cpm.val,false)}"><div class="kc-lbl">CPM</div><div class="kc-val" style="color:${sc(totCpm,METAS_T.cpm.val,false)};font-size:18px">${fBRL(totCpm)}</div><div class="kc-sub">meta ${fBRL(METAS_T.cpm.val)}</div></div>
    </div>

    <div class="section-lbl">Anúncios com investimento no período</div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead>
          <tr>
            <th style="padding:10px 14px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);border-bottom:1px solid var(--border)">Anúncio</th>
            ${thRow("spend","Investimento")}
            ${thRow("qtd","Vendas")}
            ${thRow("cpv","Custo/Venda")}
            ${thRow("ticket","Ticket Médio Front")}
            ${thRow("ticketAsc","Ticket Médio Ascensões")}
            ${thRow("ctr","CTR")}
            ${thRow("cpm","CPM")}
            ${thRow("cpc","CPC")}
            <th style="padding:10px 12px;border-bottom:1px solid var(--border)"></th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map((r,i)=>`
          <tr style="border-bottom:1px solid var(--border);transition:background .1s" onmouseover="this.style.background='rgba(255,255,255,.025)'" onmouseout="this.style.background='transparent'">
            <td style="padding:10px 14px;text-align:left">
              <span style="background:var(--surf);border:1px solid var(--border-h);border-radius:6px;padding:2px 9px;font-size:10px;font-weight:600;color:var(--text);font-family:'JetBrains Mono',monospace">${r.advCode}</span>
            </td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${fBRL(r.spend)}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${r.qtd}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${sc(r.cpv,META_CPV,false)};font-weight:600">${r.qtd>0?fBRL(r.cpv):"—"}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${sc(r.ticket,META_TICKET,true)};font-weight:600">${r.qtd>0?fBRL(r.ticket):"—"}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${r.qtd>0?fBRL(r.ticketAsc):"—"}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${sc(r.ctr,METAS_T.ctr.val,true)};font-weight:600">${fPct(r.ctr)}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${sc(r.cpm,METAS_T.cpm.val,false)};font-weight:600">${fBRL(r.cpm)}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${sc(r.cpc,METAS_T.cpc.val,false)};font-weight:600">${fBRL(r.cpc)}</td>

              ${r.igUrl?`<a href="${r.igUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:3px;background:var(--surf);border:1px solid var(--border-h);color:var(--muted);padding:4px 9px;border-radius:7px;font-size:10px;text-decoration:none;white-space:nowrap;font-weight:500">Ver ↗</a>`:"—"}
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <p class="foot">Base Meta (Stract) + Base Vendas (Eduzz) · Google Sheets API v4</p>`;

// ── Helper: dados do funil ativo ──────────────────────────────────────────
// Retorna o namespace de dados correto (S ou S.mapa) dependendo do funil ativo
function D(){ return S.currentFunil==="mapa" ? S.mapa : S; }

// ── Funil helpers ──────────────────────────────────────────────────────────
function classifyProduct(name, funil){
  if(!name) return null;
  const n=name.toUpperCase();
  const f=funil||S.currentFunil;

  // Gratuitos → sempre ignorar
  if(n.includes("GRÁTIS") || n.includes("GRATIS")) return null;

  // OBs do PlanLucro — IDs próprios, verificar ANTES dos filtros genéricos
  if(n.includes("10 ERROS")) return "ob10Erros";
  if(n.includes("REDUZIR")) return "obReduzir";
  if(n.includes("REPROVADO")) return "obReprovado";
  if(n.includes("CUSTO POR M2")) return "obCustoM2";
  if(n.includes("APROVAÇÃO DO PROJETO") || n.includes("APROVACAO DO PROJETO")) return "obAprovacao";

  if(f==="mapa"){
    const IGNORAR_MAPA=["MANUAL DEFINITIVO","RAIO-X","RAIOX","IMPOSTO",
      "PILARES","DESCUBRA O CUSTO","QUAL O LUCRO",
      "OS 8 PILARES","MÉTODO ALAVANCA","METODO ALAVANCA","EBOOK - DESCUBRA"];
    if(IGNORAR_MAPA.some(x=>n.includes(x))) return null;
    if(n.includes("MAPA DA CASA")) return "mapa";
    if(n.includes("GUIA DEFINITIVO") || (n.includes("CAIXA") && n.includes("PASSO"))) return "guiaCaixa";
    if(n.includes("CHECKLIST")) return "checklist";
    if(n.includes("LUCRO")) return "planLucro";
    if(n.includes("CURSO COMPLETO") || n.includes("PASSO A PASSO")) return "curso";
    return null;
  }

  // funil manual
  const IGNORAR=["MAPA DA CASA","RAIO-X","RAIOX","GUIA DEFINITIVO","IMPOSTO",
    "PILARES","ZERO ENTRADA","CASA PRÓPRIA","CASA PROPRIA",
    "DESCUBRA O CUSTO","DOIS CHECKLISTS","QUAL O LUCRO","OS 8 PILARES",
    "MÉTODO ALAVANCA","METODO ALAVANCA","EBOOK - DESCUBRA"];
  if(IGNORAR.some(x=>n.includes(x))) return null;
  if(n.includes("MANUAL DEFINITIVO")) return "manual";
  if(n.includes("CHECKLIST")) return "checklist";
  if((n.includes("FINANCIAMENTO") || n.includes("CUSTOS DO FINANCIAMENTO")) && !n.includes("CAIXA")) return "planFin";
  if(n.includes("LUCRO")) return "planLucro";
  if(n.includes("CURSO COMPLETO") || n.includes("PASSO A PASSO")) return "curso";
  return null;
}

function getFunilSteps(funil){
  const f=funil||S.currentFunil;
  if(f==="mapa") return [
    {id:"mapa",         label:"Mapa da Casa",          step:"Entrada"},
    {id:"guiaCaixa",    label:"Guia Definitivo Caixa", step:"Order Bump 1"},
    {id:"checklist",    label:"Checklist",             step:"Order Bump 2"},
    {id:"planLucro",    label:"Planilha Lucro",         step:"Upsell"},
    {id:"curso",        label:"Curso",                  step:"Ascensão"},
  ];
  return [
    {id:"manual",    label:"Manual Definitivo",      step:"Entrada"},
    {id:"checklist", label:"Checklist",              step:"Order Bump 1"},
    {id:"planFin",   label:"Planilha Financiamento", step:"Order Bump 2"},
    {id:"planLucro", label:"Planilha Lucro",         step:"Upsell"},
    {id:"curso",     label:"Curso",                  step:"Ascensão"},
  ];
}


// Expande linhas da Base Vendas - Completo
// Formato antigo: 1 linha = 1 produto
// Formato novo: 1 linha pode ter produto principal + OB1 + OB2 na mesma linha
// Upsell e Curso continuam em linhas separadas em ambos os formatos
function expandFunilRows(rawRows, funil){
  // funil opcional: se informado, só expande linhas que pertencem a esse funil
  // (evita que linhas do Manual entrem no funil do Mapa e vice-versa)
  const f=funil||null;
  const out=[];
  for(const r of rawRows){
    if(!r["Nome do produto principal"] && !r["Data da compra"]) continue;
    const st=normalizeStatus(r["Status da compra"]);
    if(!st) continue;

    // Se funil informado, verifica se a transação pertence a ele
    if(f){
      const nomePrincipal=(r["Nome do produto principal"]||"").toUpperCase();
      const nOB1=(r["Nome do orderbump 01"]||"").toUpperCase();
      const nOB2=(r["Nome do orderbump 02"]||"").toUpperCase();
      // Compras standalone de ascensão (planLucro, curso) não têm o produto principal do funil
      // mas precisam ser incluídas para que buildFunilData possa contá-las no Passo 2
      const principalId=classifyProduct(r["Nome do produto principal"]||"",f);
      const STANDALONE_IDS=new Set(["planLucro","curso","ob10Erros","obReduzir","obReprovado","obCustoM2","obAprovacao"]);
      const isStandaloneAscension=STANDALONE_IDS.has(principalId);
      if(f==="mapa"){
        // Pertence ao Mapa se Mapa aparece em qualquer campo, OU se é ascensão standalone
        const ehMapa=nomePrincipal.includes("MAPA DA CASA")||nOB1.includes("MAPA DA CASA")||nOB2.includes("MAPA DA CASA");
        if(!ehMapa && !isStandaloneAscension) continue;
      } else {
        // Manual: produto principal deve ser o Manual, OU é ascensão standalone
        if(!nomePrincipal.includes("MANUAL DEFINITIVO") && !isStandaloneAscension) continue;
      }
    }

    const dataBruta=stripTime(r["Data da compra"]||"");
    const adIdRaw=r["Ad Id"]||r["Content"]||"";
    const base={
      "Email":r["Email"]||"",
      "CPF Comprador":r["CPF Comprador"]||"",
      "Telefone":r["Telefone"]||"",
      "Nome":r["Nome"]||"",
      "Status da compra":st,
      "Data da compra":dataBruta,
      "Ad Id":adIdRaw,
    };
    if(r["Nome do produto principal"]){
      out.push({...base,
        "Nome do produto":r["Nome do produto principal"],
        "Valor do produto":r["Valor do produto principal"]||r["Valor do produto"]||"0",
        "Taxa da plataforma":r["Taxa da plataforma"]||"0",
      });
    }
    if(r["Nome do orderbump 01"]){
      out.push({...base,
        "Nome do produto":r["Nome do orderbump 01"],
        "Valor do produto":r["Valor order bump 01"]||"0",
        "Taxa da plataforma":"0",
      });
    }
    if(r["Nome do orderbump 02"]){
      out.push({...base,
        "Nome do produto":r["Nome do orderbump 02"],
        "Valor do produto":r["Valor order bump 02"]||"0",
        "Taxa da plataforma":"0",
      });
    }
  }
  return out;
}

// Deduplicação de eventos webhook:
// Mesma pessoa + mesmo produto + dentro de 7 dias → mantém o mais recente por data/hora
// Se data/hora igual → hierarquia: Reembolsado > Aguardando Reembolso > Paga > Em Recuperacao > Expirado > outros
function deduplicateFunilRows(rows){
  const STATUS_PRIORITY={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
  function sp(st){ return STATUS_PRIORITY[st]||0; }

  // Chave: email+cpf+tel+produto+janela7dias
  // Agrupa por chave e mantém o de maior prioridade/data
  const groups=new Map();
  for(const r of rows){
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    const prod=(r["Nome do produto"]||"").trim().toUpperCase();
    const dataBruta=r["Data da compra"]||"";
    const dateStr=toISO(dataBruta)||"";
    const identity=em||cpf||tel;
    if(!identity||!prod||!dateStr) { /* sem chave — adiciona direto */ groups.set(Math.random().toString(),r); continue; }

    // Encontra grupo existente com mesma identidade + produto dentro de 7 dias
    let found=null;
    for(const [k,g] of groups){
      if(!g._identity||!g._prod) continue;
      if(g._prod!==prod) continue;
      // verifica identidade
      const gEm=(g["Email"]||"").toLowerCase().trim();
      const gCpf=(g["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const gTel=(g["Telefone"]||"").replace(/[^\d]/g,"");
      const identMatch=(em&&gEm&&em===gEm)||(cpf&&gCpf&&cpf===gCpf)||(tel&&gTel&&tel===gTel);
      if(!identMatch) continue;
      // verifica janela 7 dias
      const d1=new Date((g._dateStr||"")+"T12:00:00Z");
      const d2=new Date(dateStr+"T12:00:00Z");
      const diffDays=Math.abs((d2-d1)/(86400000));
      if(diffDays<=7){ found=k; break; }
    }

    const rWithMeta={...r,_identity:identity,_prod:prod,_dateStr:dateStr};
    if(found){
      const existing=groups.get(found);
      // Mantém o mais recente; se empate, maior prioridade de status
      const existDate=existing._dateStr||"";
      const newDate=dateStr;
      const existSP=sp(existing["Status da compra"]||"");
      const newSP=sp(r["Status da compra"]||"");
      if(newDate>existDate||(newDate===existDate&&newSP>existSP)){
        groups.set(found,rWithMeta);
      }
    } else {
      groups.set(Math.random().toString(),rWithMeta);
    }
  }
  return Array.from(groups.values());
}

function buildFunilData(rows, start, end, funil){
  const f=funil||S.currentFunil;
  const primaryId=f==="mapa"?"mapa":"manual"; // produto de entrada do funil
  // filtered: só para análise de status/perdas — respeita período
  const filtered = rows.filter(r=>{
    if(!start && !end) return true;
    const d = toISO(r["Data da compra"]||r["Data"]);
    if(!d) return true;
    if(start && d<start) return false;
    if(end   && d>end)   return false;
    return true;
  });

  // Para buyers: usa TODAS as linhas (sem filtro de período)
  // O período só controla se a compra entra nos totais, não quem é o comprador
  const allRows = rows;

  // Agrupa por comprador (e-mail + cpf + telefone)
  // Identifica o comprador único
  function buyerKey(r){
    // Retorna chaves únicas: cada campo é prefixado para evitar colisão entre email/cpf/tel
    const keys=[];
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(em)  keys.push("e:"+em);
    if(cpf) keys.push("c:"+cpf);
    if(tel) keys.push("t:"+tel);
    return keys;
  }

  // Mapeia comprador -> conjunto de produtos comprados com data
  // Estrutura: {keys: Set, products: [{id, date, valor, status}]}
  const buyers = new Map(); // normalizedKey -> buyer obj

  function getOrCreate(r){
    const keys = buyerKey(r);
    // procura buyer existente que compartilhe pelo menos 1 chave
    for(const [k,b] of buyers){
      for(const key of keys){
        if(key && b.keys.has(key)){
          // adiciona as novas keys a esse buyer
          keys.forEach(k2=>{ if(k2) b.keys.add(k2); });
          return b;
        }
      }
    }
    // novo buyer
    const b={keys:new Set(keys.filter(Boolean)), products:[]};
    const mapKey = keys[0] || Math.random().toString();
    buyers.set(mapKey, b);
    return b;
  }

  for(const r of allRows){
    const prodId = classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const buyer = getOrCreate(r);
    const d = toISO(r["Data da compra"]||r["Data"]) || "";
    const status = normalizeStatus((r["Status da compra"]||"").trim());
    const valor  = parseBRL(r["Valor do produto"]);
    const taxa   = parseBRLAbs(r["Taxa da plataforma"]);
    buyer.products.push({id:prodId, date:d, status, valor, taxa});
  }

  // Conta: só conta produtos comprados APÓS a primeira compra do manual (status Paga)
  const counts = {};
  const fat    = {};
  const taxa   = {};
  getFunilSteps(f).forEach(s=>{ counts[s.id]=0; fat[s.id]=0; taxa[s.id]=0; });

  // Status analysis
  const statusCounts = {};
  const statusVals   = {};
  const statusByProd = {};
  getFunilSteps(f).forEach(s=>{ statusByProd[s.id]={}; });

  // All rows for status analysis (sem filtro de funil)
  for(const r of filtered){
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    const val=parseBRL(r["Valor do produto"]);
    statusCounts[st]=(statusCounts[st]||0)+1;
    statusVals[st]=(statusVals[st]||0)+val;
    if(!statusByProd[prodId]) statusByProd[prodId]={};
    statusByProd[prodId][st]=(statusByProd[prodId][st]||0)+1;
  }

  // Funil: só Paga, dentro do período
  // OBs de faturamento (produto principal + OBs diretos)
  const OB_FAT_IDS = f==="mapa"
    ? new Set(["mapa","guiaCaixa","checklist"])
    : new Set(["manual","checklist","planFin"]);

  // Passo 1: agrupa por comprador+data para calcular faturamento do produto principal
  // (evita duplicatas entre webhook e histórica)
  {
    const ST_PRI={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
    const grupos=new Map();
    for(const r of filtered){
      const prodId=classifyProduct(r["Nome do produto"],f);
      if(!OB_FAT_IDS.has(prodId)) continue; // só produto principal + OBs diretos aqui
      const st=normalizeStatus((r["Status da compra"]||"").trim());
      if(!st) continue;
      const d=toISO(r["Data da compra"]||r["Data"])||"";
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const identity=em||cpf||tel; if(!identity) continue;
      const key=identity+"|"+d;
      if(!grupos.has(key)) grupos.set(key,{st,d,valor:0,taxa:0,hasPrimary:false,obCounts:{}});
      const g=grupos.get(key);
      if((ST_PRI[st]||0)>(ST_PRI[g.st]||0)) g.st=st;
      if(prodId===primaryId) g.hasPrimary=true;
      if(st==="Paga"){
        g.valor += parseBRL(r["Valor do produto"]);
        g.taxa  += parseBRLAbs(r["Taxa da plataforma"]);
        // Conta cada OB individualmente dentro do grupo
        if(prodId!==primaryId) g.obCounts[prodId]=(g.obCounts[prodId]||0)+1;
      }
    }
    for(const [,g] of grupos){
      if(!g.hasPrimary || g.st!=="Paga") continue;
      counts[primaryId]++;
      fat[primaryId] += g.valor;
      taxa[primaryId]+= g.taxa;
      // Contagem dos OBs desta transação
      for(const [obId, obQtd] of Object.entries(g.obCounts)){
        counts[obId]=(counts[obId]||0)+obQtd;
      }
    }
  }

  // Passo 2: upsell e ascensão (planLucro, curso) — por comprador, após produto principal
  for(const [,buyer] of buyers){
    const paid = buyer.products.filter(p=>p.status==="Paga");
    const mainPurchases = paid.filter(p=>p.id===primaryId).sort((a,b)=>a.date.localeCompare(b.date));
    if(!mainPurchases.length) continue;
    const mainDate = mainPurchases[0].date;
    const others = paid.filter(p=>{
      if(OB_FAT_IDS.has(p.id)) return false; // OBs já contados acima
      if(p.date < mainDate) return false;
      if(start && p.date < start) return false;
      if(end   && p.date > end)   return false;
      return true;
    });
    for(const p of others){
      counts[p.id]=(counts[p.id]||0)+1;
      fat[p.id]=(fat[p.id]||0)+p.valor;
      taxa[p.id]=(taxa[p.id]||0)+(p.taxa||0);
    }
  }

  const manualCount = counts[primaryId] || 1;
  const totalFat  = Object.values(fat).reduce((a,b)=>a+b,0);
  // Taxa Eduzz: inclui Paga + Reembolsado + Aguardando Reembolso
  // (Eduzz cobra taxa mesmo em reembolsos)
  const totalTaxaPaga = Object.values(taxa).reduce((a,b)=>a+b,0);
  let totalTaxaReemb = 0;
  for(const r of filtered){
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    if(st!=="Reembolsado" && st!=="Aguardando Reembolso") continue;
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    totalTaxaReemb += parseBRLAbs(r["Taxa da plataforma"]);
  }
  const totalTaxa = totalTaxaPaga + totalTaxaReemb;

  // Spend no período (da base Meta do funil ativo)
  let totalSpend=0;
  const _metaD=f==="mapa"?S.mapa.meta:S.meta;
  for(const d of Object.keys(_metaD)){
    if(start && d<start) continue;
    if(end   && d>end)   continue;
    totalSpend+=_metaD[d].spend||0;
  }

  return {
    counts, fat, manualCount, totalFat, totalSpend, buyers,
    roas: totalSpend>0 ? totalFat/totalSpend : 0,
    ltv:  totalFat/manualCount,
    lucro: totalFat - totalTaxa - (totalSpend*TAXA_IMPOSTO),
    // A compra do principal (mp) precisa cair dentro do período selecionado — mesma regra usada
    // pra contar manualCount — senão o numerador conta compradores de fora do período filtrado
    // enquanto o denominador (manualCount) só conta os de dentro, estourando >100%.
    taxaAscensao: (function(){
      if(!manualCount) return 0;
      let cnt=0;
      for(const [,buyer] of buyers){
        const paid=buyer.products.filter(p=>p.status==="Paga");
        const mp=paid.filter(p=>p.id===primaryId&&(!start||p.date>=start)&&(!end||p.date<=end))
                     .sort((a,b)=>a.date.localeCompare(b.date))[0];
        if(!mp) continue;
        const ascendeu=paid.some(p=>(p.id==="planLucro"||p.id==="curso")&&p.date>=mp.date);
        if(ascendeu) cnt++;
      }
      return (cnt/manualCount)*100;
    })(),
    // Tx de order bump: % de compradores do produto principal que também levaram pelo menos 1
    // order bump (Checklist e/ou Planilha Financiamento no Manual; Guia Caixa e/ou Checklist no
    // Mapa) — mesmo critério de "comprador distinto" já usado acima pra taxaAscensao.
    // A compra do principal (mp) precisa cair dentro do período selecionado — mesma regra usada
    // pra contar manualCount — senão o numerador conta compradores de fora do período filtrado
    // enquanto o denominador (manualCount) só conta os de dentro, estourando >100%.
    taxaOrderBump: (function(){
      if(!manualCount) return 0;
      const obIds=new Set([...OB_FAT_IDS]); obIds.delete(primaryId);
      let cnt=0;
      for(const [,buyer] of buyers){
        const paid=buyer.products.filter(p=>p.status==="Paga");
        const mp=paid.filter(p=>p.id===primaryId&&(!start||p.date>=start)&&(!end||p.date<=end))
                     .sort((a,b)=>a.date.localeCompare(b.date))[0];
        if(!mp) continue;
        const levouOB=paid.some(p=>obIds.has(p.id)&&p.date>=mp.date);
        if(levouOB) cnt++;
      }
      return (cnt/manualCount)*100;
    })(),
    statusCounts, statusVals, statusByProd, buyers,
  };
}

// ── buildGeralData — Funil Consolidado (Manual + Mapa) ────────────────────
function buildGeralData(rows, start, end){
  // Mapa de compradores: chave → {keys, firstManual, firstMapa, products}
  const buyersMap=new Map();

  function getOrCreateG(em,cpf,tel){
    const ids=[];
    if(em)  ids.push("e:"+em);
    if(cpf) ids.push("c:"+cpf);
    if(tel) ids.push("t:"+tel);
    if(!ids.length) return null;
    let found=null;
    for(const id of ids){ if(buyersMap.has(id)){found=buyersMap.get(id);break;} }
    if(!found){
      found={keys:new Set(ids),firstManual:null,firstMapa:null,products:[]};
      for(const id of ids) buyersMap.set(id,found);
    } else {
      for(const id of ids){ buyersMap.set(id,found); found.keys.add(id); }
    }
    return found;
  }

  // Passo 1: percorre TODAS as linhas (sem filtro de período)
  // → garante que firstManual/firstMapa reflitam histórico completo
  for(const r of rows){
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(!em&&!cpf&&!tel) continue;
    const st=(r["Status da compra"]||"").trim();
    if(st!=="Paga") continue;
    const name=(r["Nome do produto"]||"").toUpperCase();
    const gf=r._gf;
    let prodId=gf?classifyProduct(name,gf):null;
    if(!prodId) prodId=classifyProduct(name,"manual")||classifyProduct(name,"mapa");
    if(!prodId) continue;
    const b=getOrCreateG(em,cpf,tel); if(!b) continue;
    const dt=toISO(r["Data da compra"]||"")||"";
    if(prodId==="manual" && (!b.firstManual||dt<b.firstManual)) b.firstManual=dt;
    if(prodId==="mapa"   && (!b.firstMapa ||dt<b.firstMapa  )) b.firstMapa=dt;
    b.products.push({id:prodId,date:dt,status:st,val:parseBRL(r["Valor do produto"]||"0")});
  }

  // Passo 2: conta por produto no período
  const counts={manual:0,mapa:0,checklist:0,planFin:0,guiaCaixa:0,planLucro:0,ob10Erros:0,obReduzir:0,obReprovado:0,obCustoM2:0,obAprovacao:0,curso:0};
  const fat   ={manual:0,mapa:0,checklist:0,planFin:0,guiaCaixa:0,planLucro:0,ob10Erros:0,obReduzir:0,obReprovado:0,obCustoM2:0,obAprovacao:0,curso:0};
  const statusCounts={}, statusVals={};
  let totalFat=0, totalTaxa=0;
  const buyerCountedForProd=new Map(); // bKey → Set(prodId) — evita contar o mesmo comprador 2x por produto
  const entryBuyerKeys=new Set();
  const entryDateInPeriod=new Map(); // bKey → 1ª data de entrada (manual/mapa) DENTRO do período
  const ascensaoKeys=new Set();
  const ascensaoCandidates=[]; // {bKey,dt} — só vira ascensaoKeys depois, se a entrada também foi no período

  for(const r of rows){
    const dt=toISO(r["Data da compra"]||"")||"";
    if(start&&dt<start) continue;
    if(end  &&dt>end  ) continue;

    const st=(r["Status da compra"]||"").trim();
    statusCounts[st]=(statusCounts[st]||0)+1;
    const val=parseBRL(r["Valor do produto"]||"0");
    statusVals[st]=(statusVals[st]||0)+val;

    if(st!=="Paga") continue;

    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(!em&&!cpf&&!tel) continue;
    const b=getOrCreateG(em,cpf,tel); if(!b) continue;
    const bKey=[...b.keys][0];

    const name=(r["Nome do produto"]||"").toUpperCase();
    const gf=r._gf;
    let prodId=gf?classifyProduct(name,gf):null;
    if(!prodId) prodId=classifyProduct(name,"manual")||classifyProduct(name,"mapa");
    if(!prodId) continue;

    const taxa=parseBRL(r["Taxa da plataforma"]||"0");
    totalFat+=val;
    totalTaxa+=taxa;

    // Conta cada comprador uma vez por produto (dedup comprador-nível)
    if(!buyerCountedForProd.has(bKey)) buyerCountedForProd.set(bKey,new Set());
    if(!buyerCountedForProd.get(bKey).has(prodId)){
      buyerCountedForProd.get(bKey).add(prodId);
      counts[prodId]=(counts[prodId]||0)+1;
      fat[prodId]=(fat[prodId]||0)+val;
    }

    if(prodId==="manual"||prodId==="mapa"){
      entryBuyerKeys.add(bKey);
      if(!entryDateInPeriod.has(bKey)||dt<entryDateInPeriod.get(bKey)) entryDateInPeriod.set(bKey,dt);
    }

    if(prodId==="planLucro"||prodId==="curso"){
      ascensaoCandidates.push({bKey,dt});
    }
  }

  // Só conta como ascensão quem também entrou (comprou manual/mapa) DENTRO do período — senão
  // o numerador (ascensaoKeys) pode ficar maior que o denominador (entryCount), estourando
  // >100% quando o filtro de data é estreito (mesmo bug corrigido no taxaOrderBump/taxaAscensao
  // por-funil).
  for(const {bKey,dt} of ascensaoCandidates){
    const fe=entryDateInPeriod.get(bKey);
    if(fe&&dt>=fe) ascensaoKeys.add(bKey);
  }

  const entryCount=entryBuyerKeys.size;
  const ltv=entryCount>0?totalFat/entryCount:0;
  const taxaAscensao=entryCount>0?(ascensaoKeys.size/entryCount)*100:0;

  return {counts,fat,entryCount,totalFat,totalTaxa,ltv,taxaAscensao,
          ascensaoCount:ascensaoKeys.size,statusCounts,statusVals,buyers:buyersMap};
}

// ── Funil barras helper ────────────────────────────────────────────────────
function funilBarras(counts,fat,pct){

    planLucro:"#fbbf24",curso:"#f87171",

}

// ── Funil Pyramid ─────────────────────────────────────────────────────────
function funilPyramid(counts, manualCount, funil){
  const f=funil||S.currentFunil;
  const primaryKey=f==="mapa"?"mapa":"manual";
  const primaryCount=counts[primaryKey]||0;
  const obCount=(counts["checklist"]||0)+(f==="mapa"?(counts["guiaCaixa"]||0):(counts["planFin"]||0));
  const upsellCount=counts["planLucro"]||0;
  const ascCount=counts["curso"]||0;
  const N=manualCount||1;
  // Escala sqrt: comprime valores grandes, separa bem os pequenos entre si
  // MAX_H=120 para o principal (100%), min 10px para não sumir
  const MAX_H=120, MIN_H=10;
  function ph(pct){
    if(pct<=0) return MIN_H;
    return Math.max(MIN_H, Math.round(Math.sqrt(pct/100)*MAX_H));
  }
  const levels=[
    {label:"Produto principal",count:primaryCount,pct:100,
     grad:"linear-gradient(135deg,#2dd4bf,#14b8a6)",tc:"#06241f",clip:"0 0,100% 0,90% 100%,10% 100%"},
    {label:"Order bumps",count:obCount,pct:(obCount/N)*100,
     grad:"linear-gradient(135deg,#60a5fa,#2563eb)",tc:"#fff",clip:"10% 0,90% 0,77% 100%,23% 100%"},
    {label:"Upsell",count:upsellCount,pct:(upsellCount/N)*100,
     grad:"linear-gradient(135deg,#a78bfa,#7c3aed)",tc:"#fff",clip:"23% 0,77% 0,63% 100%,37% 100%"},
    {label:"Ascensão",count:ascCount,pct:(ascCount/N)*100,
     grad:"linear-gradient(135deg,#fbbf24,#f59e0b)",tc:"#1c0900",clip:"37% 0,63% 0,52% 100%,48% 100%"},
  ];
  return `<div style="display:flex;flex-direction:column;gap:3px">
    ${levels.map(l=>{
      const h=ph(l.pct);
      const small=h<28;
      return `
      <div style="position:relative;height:${h}px;clip-path:polygon(${l.clip});background:${l.grad};display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden">
        ${small
          ? `<div style="font-size:9px;font-weight:600;color:${l.tc};text-align:center;white-space:nowrap;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.4)">${l.label} · ${l.count.toLocaleString("pt-BR")} · ${l.pct.toFixed(1)}%</div>`
          : `<div style="font-size:10px;font-weight:600;color:${l.tc};text-align:center;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.3)">${l.label}</div>
             <div style="font-size:10px;color:${l.tc};opacity:.85;text-align:center;font-family:'JetBrains Mono',monospace">${l.count.toLocaleString("pt-BR")} · ${l.pct.toFixed(1)}%</div>`
        }
      </div>`;
    }).join("")}
  </div>`;
}

// ── buildAnaContent — Análise exploratória dentro do Funil ─────────────────
function buildAnaContent(fd, buyers){
  const ALL_STATUS=["Paga","Aberta","Aguardando Pagamento","Em Recuperacao","Reembolsado","Aguardando Reembolso"];

  // Produtos disponíveis detectados automaticamente
  const _anaD=D();
  const prodsFound=new Set();
  for(const r of _anaD.funilRows){ const id=classifyProduct(r["Nome do produto"]); if(id) prodsFound.add(id); }
  const prods=getFunilSteps().filter(s=>prodsFound.has(s.id));

  // Filtra rows por período desta aba
  const start=S.anaStartDate||"";
  const end=S.anaEndDate||"";
  const rows=(start||end)?_anaD.funilRows.filter(r=>{
    const d=toISO(r["Data da compra"]||r["Data"]);
    if(!d) return false;
    if(start&&d<start) return false;
    if(end&&d>end) return false;
    return true;
  }):_anaD.funilRows;

  // Re-constrói buyers para o período desta aba se diferente do funil
  let ana_buyers=buyers;
  if(start||end){
    ana_buyers=new Map();
    function getOrCreate2(r){
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const keys=[];
      if(em)  keys.push("e:"+em);
      if(cpf) keys.push("c:"+cpf);
      if(tel) keys.push("t:"+tel);
      if(!keys.length) return null;
      for(const [,b] of ana_buyers){
        for(const k of keys){ if(b.keys.has(k)){ keys.forEach(k2=>b.keys.add(k2)); return b; } }
      }
      const b={keys:new Set(keys),products:[]};
      ana_buyers.set(keys[0]||Math.random().toString(),b);
      return b;
    }
    for(const r of rows){
      const id=classifyProduct(r["Nome do produto"]);if(!id)continue;
      const b=getOrCreate2(r);
      if(!b)continue;
      const d=toISO(r["Data da compra"]||r["Data"])||"";
      const st=(r["Status da compra"]||"").trim();
      b.products.push({id,date:d,status:st});
    }
  }

  const totalBuyers=ana_buyers.size;

  // ── Tempo entre compras ───────────────────────────────────────────────────
  function calcTempo(p1,p2){
    const diffs=[];
    for(const [,b] of ana_buyers){
      const paid=b.products.filter(p=>p.status==="Paga");
      const p1s=paid.filter(p=>p.id===p1).sort((a,z)=>a.date.localeCompare(z.date));
      const p2s=paid.filter(p=>p.id===p2).sort((a,z)=>a.date.localeCompare(z.date));
      if(!p1s.length||!p2s.length) continue;
      const p2after=p2s.find(p=>p.date>=p1s[0].date); if(!p2after) continue;
      const days=Math.round((new Date(p2after.date+"T12:00:00Z")-new Date(p1s[0].date+"T12:00:00Z"))/(86400000));
      diffs.push(days);
    }
    if(!diffs.length) return null;
    const avg=Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);
    return{count:diffs.length,avg,
      sameDay:diffs.filter(d=>d===0).length,
      within30:diffs.filter(d=>d>0&&d<=30).length,
      after30:diffs.filter(d=>d>30).length};
  }

  // ── Jornadas ──────────────────────────────────────────────────────────────
  function calcJornadas(filter,sortBy){
    const jmap=new Map();
    for(const [,b] of ana_buyers){
      const paid=b.products.filter(p=>p.status==="Paga");
      const mp=paid.filter(p=>p.id==="manual").sort((a,z)=>a.date.localeCompare(z.date))[0]; if(!mp) continue;
      const after=paid.filter(p=>p.date>=mp.date);
      const seen=new Set(); const ids=[];
      for(const step of getFunilSteps()){ if(after.find(p=>p.id===step.id)&&!seen.has(step.id)){seen.add(step.id);ids.push(step.id);} }
      const key=ids.join("+");
      if(!jmap.has(key)) jmap.set(key,{ids,count:0});
      jmap.get(key).count++;
    }
    let arr=Array.from(jmap.values());
    if(filter==="with_curso") arr=arr.filter(j=>j.ids.includes("curso"));
    else if(filter==="both_obs") arr=arr.filter(j=>j.ids.includes("checklist")&&j.ids.includes("planFin"));
    else if(filter==="all_products") arr=arr.filter(j=>getFunilSteps().every(s=>j.ids.includes(s.id)));
    else if(filter==="manual_only") arr=arr.filter(j=>j.ids.length===1&&j.ids[0]==="manual");
    arr.sort((a,b)=>b.count-a.count);
    return arr.slice(0,8);
  }

  // ── Status de compra ──────────────────────────────────────────────────────
  function calcStatus(statusFilter,groupBy){
    const filtered=statusFilter==="all"?rows:rows.filter(r=>(r["Status da compra"]||"").trim()===statusFilter);
    const data={};const totals={};
    for(const r of filtered){
      const id=classifyProduct(r["Nome do produto"]);if(!id)continue;
      const st=(r["Status da compra"]||"").trim();
      const key=groupBy==="status"?st:groupBy==="mes"?(toISO(r["Data da compra"]||r["Data"])||"").slice(0,7):id;
      if(!data[key])data[key]={};
      data[key][st]=(data[key][st]||0)+1;
      totals[st]=(totals[st]||0)+1;
    }
    return{data,totals};
  }

  function prodLabel(id){return getFunilSteps().find(s=>s.id===id)?.label||id;}
  function jornadaLabel(ids){
    if(ids.length===1&&ids[0]==="manual") return "Manual apenas";
    return ids.map(id=>getFunilSteps().find(s=>s.id===id)?.label||id).join(" → ");
  }

  // Expõe funções para os botões
  window.setAnaTab=t=>{S.aTab=t;renderFunil();};
  window.applyAnaQuick=k=>{
    S.anaActiveQuick=k;const t=todayISO();
    if(k==="all"){S.anaStartDate="";S.anaEndDate="";}
    else if(k==="hoje"){S.anaStartDate=t;S.anaEndDate=t;}
    else if(k==="ontem"){const y=yesterdayISO();S.anaStartDate=y;S.anaEndDate=y;}
    else if(k==="7d"){S.anaStartDate=nDaysAgoISO(6);S.anaEndDate=t;}
    else if(k==="30d"){S.anaStartDate=nDaysAgoISO(29);S.anaEndDate=t;}
    else if(k==="mes"){S.anaStartDate=firstOfMonthISO();S.anaEndDate=t;}
    renderFunil();
  };
  window.onAnaDC=(w,v)=>{if(w==="s")S.anaStartDate=v;else S.anaEndDate=v;S.anaActiveQuick="";renderFunil();};
  window.runTempo=()=>{S.anaTempoProd1=document.getElementById("ana-p1")?.value||"manual";S.anaTempoProd2=document.getElementById("ana-p2")?.value||"curso";renderFunil();};
  window.runJornada=()=>{S.anaJornadaFiltro=document.getElementById("ana-jf")?.value||"all";S.anaJornadaSort=document.getElementById("ana-js")?.value||"freq";renderFunil();};
  window.runStatus=()=>{S.anaStatusFiltro=document.getElementById("ana-sf")?.value||"all";S.anaStatusGroup=document.getElementById("ana-sg")?.value||"produto";renderFunil();};

  // Calcula
  const tempoR=calcTempo(S.anaTempoProd1,S.anaTempoProd2);
  const jornadaR=calcJornadas(S.anaJornadaFiltro,S.anaJornadaSort);
  const {data:stData,totals:stTotals}=calcStatus(S.anaStatusFiltro,S.anaStatusGroup);
  const maxJ=jornadaR.length?jornadaR[0].count:1;
  const stKeys=Object.keys(stData).sort();
  const stCols=ALL_STATUS.filter(s=>_anaD.funilRows.some(r=>(r["Status da compra"]||"").trim()===s));

  const QS2=[{k:"all",l:"Todos"},{k:"hoje",l:"Hoje"},{k:"ontem",l:"Ontem"},{k:"7d",l:"7 dias"},{k:"30d",l:"30 dias"},{k:"mes",l:"Este mês"}];
  const TABS=[{k:"tempo",l:"⏱ Tempo entre compras"},{k:"jornada",l:"🛒 Jornadas de compra"},{k:"status",l:"📋 Status de compra"}];

  const sel=`style="background:var(--card);border:0.5px solid var(--border-h);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--text);min-width:180px"`;
  const btnRun=`style="background:var(--text);color:var(--bg);border:none;padding:7px 18px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer"`;
  const filterBox=`style="background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap"`;

  // Conteúdo aba Tempo
  const tempoHTML=`
    <div ${filterBox}>
      <div><div class="kc-lbl" style="margin-bottom:4px">Produto de referência</div>
        <select id="ana-p1" ${sel}>${prods.map(p=>`<option value="${p.id}"${p.id===S.anaTempoProd1?" selected":""}>${p.label}</option>`).join("")}</select></div>
      <div><div class="kc-lbl" style="margin-bottom:4px">Produto alvo</div>
        <select id="ana-p2" ${sel}>${prods.map(p=>`<option value="${p.id}"${p.id===S.anaTempoProd2?" selected":""}>${p.label}</option>`).join("")}</select></div>
      <button onclick="runTempo()" ${btnRun}>Analisar</button>
    </div>
    ${tempoR?`<div class="cc">
      <div class="ch"><span class="ct">${prodLabel(S.anaTempoProd1)} → ${prodLabel(S.anaTempoProd2)}</span><span class="kc-sub">${tempoR.count} compradores dos dois</span></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        <div class="kc"><div class="kc-lbl">Dias (média)</div><div class="kc-val" style="font-size:28px;color:var(--text)">${tempoR.avg}</div></div>
        <div class="kc"><div class="kc-lbl">Mesmo dia</div><div class="kc-val" style="font-size:22px;color:#34d399">${((tempoR.sameDay/tempoR.count)*100).toFixed(0)}%</div><div class="kc-sub">${tempoR.sameDay} pessoas</div></div>
        <div class="kc"><div class="kc-lbl">Até 30 dias</div><div class="kc-val" style="font-size:22px">${((tempoR.within30/tempoR.count)*100).toFixed(0)}%</div><div class="kc-sub">${tempoR.within30} pessoas</div></div>
        <div class="kc"><div class="kc-lbl">Após 30 dias</div><div class="kc-val" style="font-size:22px;color:var(--muted)">${((tempoR.after30/tempoR.count)*100).toFixed(0)}%</div><div class="kc-sub">${tempoR.after30} pessoas</div></div>
      </div></div>`:`<div class="cc"><p style="color:var(--hint);font-size:13px;padding:8px 0">Nenhum comprador encontrou os dois produtos no período.</p></div>`}`;

  // Conteúdo aba Jornadas
  const jornadaHTML=`
    <div ${filterBox}>
      <div><div class="kc-lbl" style="margin-bottom:4px">Filtrar jornadas</div>
        <select id="ana-jf" ${sel}>
          <option value="all"${S.anaJornadaFiltro==="all"?" selected":""}>Qualquer combinação</option>
          <option value="with_curso"${S.anaJornadaFiltro==="with_curso"?" selected":""}>Incluem o Curso</option>
          <option value="both_obs"${S.anaJornadaFiltro==="both_obs"?" selected":""}>Ambos os Order Bumps</option>
          <option value="all_products"${S.anaJornadaFiltro==="all_products"?" selected":""}>Todos os produtos</option>
          <option value="manual_only"${S.anaJornadaFiltro==="manual_only"?" selected":""}>Manual apenas</option>
        </select></div>
      <div><div class="kc-lbl" style="margin-bottom:4px">Ordenar por</div>
        <select id="ana-js" ${sel}><option value="freq" selected>Mais frequente</option></select></div>
      <button onclick="runJornada()" ${btnRun}>Analisar</button>
    </div>
    <div class="cc">
      <div class="ch"><span class="ct">Combinações mais comuns</span><span class="kc-sub">${totalBuyers} compradores do Manual</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${jornadaR.map(j=>{
          const pct=(j.count/totalBuyers*100).toFixed(1);
          const w=Math.round(j.count/maxJ*100);
          return `<div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:11px;color:var(--muted);width:260px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${jornadaLabel(j.ids)}</span>
            <div style="flex:1;height:22px;background:var(--bg);border-radius:3px;overflow:hidden;position:relative;border:1px solid var(--border)">
              <div style="height:100%;width:${w}%;background:#2d7d9a;opacity:.7;border-radius:3px"></div>
              <span style="position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:500;color:var(--text)">${pct}%</span>
            </div>
            <span style="font-size:11px;color:var(--muted);width:72px;text-align:right;flex-shrink:0">${j.count} pessoas</span>
          </div>`;
        }).join("")}
      </div>
    </div>`;

  // Conteúdo aba Status
  const statusHTML=`
    <div ${filterBox}>
      <div><div class="kc-lbl" style="margin-bottom:4px">Status</div>
        <select id="ana-sf" ${sel}>
          <option value="all"${S.anaStatusFiltro==="all"?" selected":""}>Todos os status</option>
          ${stCols.map(s=>`<option value="${s}"${S.anaStatusFiltro===s?" selected":""}>${s}</option>`).join("")}
        </select></div>
      <div><div class="kc-lbl" style="margin-bottom:4px">Agrupar por</div>
        <select id="ana-sg" ${sel}>
          <option value="produto"${S.anaStatusGroup==="produto"?" selected":""}>Produto</option>
          <option value="mes"${S.anaStatusGroup==="mes"?" selected":""}>Mês</option>
          <option value="status"${S.anaStatusGroup==="status"?" selected":""}>Status</option>
        </select></div>
      <button onclick="runStatus()" ${btnRun}>Analisar</button>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr style="background:var(--bg);border-bottom:1px solid var(--border)">
          <th style="padding:9px 12px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-right:1px solid var(--border)">${S.anaStatusGroup==="mes"?"Mês":S.anaStatusGroup==="status"?"Status":"Produto"}</th>
          ${stCols.map(s=>`<th style="padding:9px 12px;text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-right:1px solid var(--border);white-space:nowrap">${s}</th>`).join("")}
          <th style="padding:9px 12px;text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)">Total</th>
        </tr></thead>
        <tbody>
          ${stKeys.map((key,i)=>{
            const row=stData[key]||{};
            const tot=stCols.reduce((a,s)=>a+(row[s]||0),0);
            const lbl=S.anaStatusGroup==="produto"?(getFunilSteps().find(s=>s.id===key)?.label||key):key;
            return `<tr style="border-bottom:1px solid var(--border);background:${i%2===0?"var(--card)":"var(--bg)"}">
              <td style="padding:9px 12px;font-weight:500;border-right:1px solid var(--border)">${lbl}</td>
              ${stCols.map(s=>`<td style="padding:9px 12px;text-align:center;border-right:1px solid var(--border);color:${s==="Paga"?"#34d399":["Reembolsado","Aguardando Reembolso"].includes(s)?"#f87171":s==="Em Recuperacao"?"#fbbf24":"var(--text)"}">${row[s]||0}</td>`).join("")}
              <td style="padding:9px 12px;text-align:center;font-weight:500">${tot}</td>
            </tr>`;
          }).join("")}
          <tr style="border-top:2px solid var(--border-h);background:var(--bg)">
            <td style="padding:9px 12px;font-weight:700;border-right:1px solid var(--border)">Total</td>
            ${stCols.map(s=>`<td style="padding:9px 12px;text-align:center;font-weight:600;border-right:1px solid var(--border)">${stTotals[s]||0}</td>`).join("")}
            <td style="padding:9px 12px;text-align:center;font-weight:700">${stCols.reduce((a,s)=>a+(stTotals[s]||0),0)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;

  const tabContent={tempo:tempoHTML,jornada:jornadaHTML,status:statusHTML};

  return `
    <div class="period-wrap">
      <div class="period-top">
        <span class="period-lbl">Período</span>
        <div class="drbox"><span class="drbox-icon">📅</span>
          <input type="date" value="${S.anaStartDate}" onchange="onAnaDC('s',this.value)"/>
          <span class="drbox-sep">—</span>
          <input type="date" value="${S.anaEndDate}" onchange="onAnaDC('e',this.value)"/>
        </div>
      </div>
      <div class="period-quick">${QS2.map(q=>`<button class="btn-q${(S.anaActiveQuick||"all")===q.k?" on":""}" onclick="applyAnaQuick('${q.k}')">${q.l}</button>`).join("")}</div>
    </div>
    <div style="display:flex;gap:0;margin-bottom:18px;border-bottom:1px solid var(--border)">
      ${TABS.map(t=>`<button onclick="setAnaTab('${t.k}')" style="padding:9px 18px;font-size:12px;font-weight:500;background:transparent;border:none;border-bottom:2px solid ${S.aTab===t.k?"var(--text)":"transparent"};color:${S.aTab===t.k?"var(--text)":"var(--muted)"};cursor:pointer;margin-bottom:-1px;white-space:nowrap">${t.l}</button>`).join("")}
    </div>
    ${tabContent[S.aTab]||""}`;
}

// ── Render Geral Funil ─────────────────────────────────────────────────────
function renderGeralFunil(){
  const el=document.getElementById("page-geral-funil");if(!el)return;

  // Recalcula com filtro de período do funil geral
  const fd=buildGeralData(S.geral.funilRows, S.gfStartDate||"", S.gfEndDate||"");
  const {counts,fat,entryCount,totalFat,totalTaxa,ltv,taxaAscensao,ascensaoCount,statusCounts,statusVals}=fd;

  // Investimento e lucro no período do funil
  const gfStart=S.gfStartDate||"";
  const gfEnd=S.gfEndDate||"";
  let totalSpend=0;
  for(const [dt,m] of Object.entries(S.geral.meta)){
    if(gfStart&&dt<gfStart) continue;
    if(gfEnd  &&dt>gfEnd  ) continue;
    totalSpend+=m.spend||0;
  }
  const roas=totalSpend>0?totalFat/totalSpend:0;
  const lucro=totalFat-totalTaxa-(totalSpend*TAXA_IMPOSTO);
  const roasC=statusColor(roas,META_ROAS,true);
  const lucroC=lucro>=0?"#34d399":"#f87171";

  // Barras do funil geral (8 passos)
  const GERAL_STEPS=[
    {id:"manual",       label:"Manual Definitivo",           step:"Produto de entrada"},
    {id:"mapa",         label:"Mapa da Casa",                step:"Produto de entrada"},
    {id:"checklist",    label:"Checklist",                   step:"Order Bump (Manual + Mapa)"},
    {id:"planFin",      label:"Planilha Financiamento",      step:"Order Bump (Manual)"},
    {id:"guiaCaixa",    label:"Guia Definitivo Caixa",       step:"Order Bump (Mapa)"},
    {id:"planLucro",    label:"Planilha Lucro",              step:"Upsell"},
    {id:"ob10Erros",    label:"10 Erros na Construção",      step:"OB Planilha Lucro"},
    {id:"obReprovado",  label:"Imóvel Reprovado Caixa",      step:"OB Planilha Lucro"},
    {id:"obReduzir",    label:"Reduzir Imposto",             step:"OB Planilha Lucro"},
    {id:"obCustoM2",    label:"Custo por M²",                step:"OB Planilha Lucro"},
    {id:"obAprovacao",  label:"Checklist Aprovação Projeto", step:"OB Planilha Lucro"},
    {id:"curso",        label:"Curso Completo",              step:"Ascensão"},
  ];
  const GERAL_CORES={
    manual:"#185FA5",mapa:"#1F7A8C",checklist:"#3B6D11",planFin:"#0F6E56",
    guiaCaixa:"#0F6E56",planLucro:"#854F0B",
    ob10Erros:"#A0622A",obReprovado:"#A0622A",obReduzir:"#A0622A",obCustoM2:"#A0622A",obAprovacao:"#A0622A",
    curso:"#993C1D"
  };

  function pctG(id){
    return entryCount>0?((counts[id]||0)/entryCount)*100:0;
  }

  const funilBarsHtml=GERAL_STEPS.map(s=>{
    const p=pctG(s.id);
    const barW=Math.max(p,0.5);
    const col=GERAL_CORES[s.id]||"#555";
    const innerLabel=barW>8?`<span style="font-size:11px;font-weight:500;color:#fff;white-space:nowrap">${p.toFixed(1)}%</span>`:'';
    const outerLabel=barW<=8?`<span style="position:absolute;left:calc(${barW}% + 6px);top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;color:var(--text);white-space:nowrap">${p.toFixed(1)}%</span>`:'';
    return `<div style="display:flex;align-items:center;gap:12px">
      <div style="width:175px;flex-shrink:0">
        <div style="font-size:11px;font-weight:600;color:var(--text)">${s.label}</div>
        <div style="font-size:9px;color:var(--hint);margin-top:1px">${s.step}</div>
      </div>
      <div style="flex:1;height:30px;background:var(--bg);border-radius:5px;overflow:hidden;position:relative;border:1px solid var(--border)">
        <div style="height:100%;width:${barW}%;background:${col};border-radius:5px;display:flex;align-items:center;padding-left:8px;min-width:2px">${innerLabel}</div>
        ${outerLabel}
      </div>
      <div style="width:90px;flex-shrink:0;text-align:right">
        <div style="font-size:13px;font-weight:500;color:var(--text)">${(counts[s.id]||0).toLocaleString("pt-BR")}</div>
        <div style="font-size:10px;color:var(--hint)">${fBRLShort(fat[s.id]||0)}</div>
      </div>
    </div>`;
  }).join("");

  // Perdas
  const qtdReemb=(statusCounts["Reembolsado"]||0)+(statusCounts["Aguardando Reembolso"]||0);
  const valReemb=(statusVals["Reembolsado"]||0)+(statusVals["Aguardando Reembolso"]||0);
  const qtdRec  =statusCounts["Em Recuperacao"]||0;
  const valRec  =statusVals["Em Recuperacao"]||0;
  const qtdAbrt =(statusCounts["Aberta"]||0)+(statusCounts["Aguardando Pagamento"]||0);
  const valAbrt =(statusVals["Aberta"]||0)+(statusVals["Aguardando Pagamento"]||0);
  const pctReemb=totalFat>0?(valReemb/totalFat)*100:0;
  const pctRec  =totalFat>0?(valRec/totalFat)*100:0;
  const pctAbrt =totalFat>0?(valAbrt/totalFat)*100:0;

  el.innerHTML=`
    <div class="hdr">
      <div>
        <div class="hdr-title">Métricas do funil — Consolidado</div>
        <div class="hdr-sub">base: ${entryCount} compradores únicos (Manual + Mapa)</div>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <!-- KPIs -->
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">Investimento</div><div class="kc-val" style="color:var(--text-strong);font-size:17px">${fBRL(totalSpend)}</div><div class="kc-sub">Meta Ads</div></div>
      <div class="kc"><div class="kc-lbl">Faturamento total</div><div class="kc-val" style="color:var(--text-strong);font-size:17px">${fBRL(totalFat)}</div><div class="kc-sub">todos os produtos</div></div>
      <div class="kc"><div class="kc-lbl">ROAS funil</div><div class="kc-val" style="color:${roasC};font-size:17px">${roas.toFixed(2)}x</div></div>
      <div class="kc"><div class="kc-lbl">Lucro bruto</div><div class="kc-val" style="color:${lucroC};font-size:17px">${fBRL(lucro)}</div></div>
      <div class="kc"><div class="kc-lbl">LTV médio</div><div class="kc-val" style="color:var(--text-strong);font-size:17px">${fBRL(ltv)}</div><div class="kc-sub">por comprador único</div></div>
      <div class="kc"><div class="kc-lbl">Taxa de ascensão</div><div class="kc-val" style="color:var(--text-strong);font-size:17px">${taxaAscensao.toFixed(1)}%</div><div class="kc-sub">${ascensaoCount} compradores</div></div>
    </div>

    <!-- Funil + Perdas -->
    <div style="display:grid;grid-template-columns:1fr 300px;gap:14px;margin-bottom:20px;align-items:start">
      <div class="cc" style="padding:16px">
        <div class="section-lbl" style="margin-top:0;margin-bottom:16px">Funil de conversão consolidado</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${funilBarsHtml}
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="section-lbl" style="margin-top:0;margin-bottom:2px">Análise de perdas</div>
        <div class="kc" style="border-color:rgba(248,113,113,.22)">
          <div class="kc-lbl" style="color:#f87171">Reembolsos</div>
          <div class="kc-val" style="color:#f87171;font-size:19px">${fBRL(valReemb)}</div>
          <div class="kc-sub">${qtdReemb} pedidos · ${pctReemb.toFixed(1)}% do fat.</div>
          <div style="margin-top:8px;display:flex;gap:6px">
            <div style="flex:1;background:var(--surf);border-radius:5px;padding:5px 7px">
              <div style="font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px">Reembolsado</div>
              <div style="font-size:13px;font-weight:500;color:#f87171">${statusCounts["Reembolsado"]||0}</div>
            </div>
            <div style="flex:1;background:var(--surf);border-radius:5px;padding:5px 7px">
              <div style="font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px">Ag. reembolso</div>
              <div style="font-size:13px;font-weight:500;color:#fbbf24">${statusCounts["Aguardando Reembolso"]||0}</div>
            </div>
          </div>
        </div>
        <div class="kc" style="border-color:rgba(251,191,36,.22)">
          <div class="kc-lbl" style="color:#fbbf24">Em recuperação</div>
          <div class="kc-val" style="color:#fbbf24;font-size:19px">${fBRL(valRec)}</div>
          <div class="kc-sub">${qtdRec} pedidos · ${pctRec.toFixed(1)}% do fat.</div>
        </div>
        <div class="kc" style="border-color:var(--border)">
          <div class="kc-lbl">Faturas em aberto</div>
          <div class="kc-val" style="color:var(--text-strong);font-size:19px">${fBRL(valAbrt)}</div>
          <div class="kc-sub">${qtdAbrt} pedidos · ${pctAbrt.toFixed(1)}% do fat.</div>
        </div>
      </div>
    </div>
    <p class="foot">Manual Definitivo + Mapa da Casa · Base Vendas (Eduzz) + Base Meta (Stract)</p>`;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  renderHeader();
  const ld=document.getElementById("loading");
  if(S.firstLoad&&S.loading){ld.style.display="flex";return;}
  ld.style.display="none";
  if(IS_FILE){
    document.getElementById("page-principal").innerHTML=`
      <div class="hdr"><div><div class="hdr-title">Manual Definitivo</div></div></div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px 36px;max-width:520px;margin:40px auto">

      </div>`;
    return;
  }
  const isSessao=S.currentFunil==="sessao";
  const isDist=S.currentFunil==="dist";
  if(S.currentPage==="principal") isDist?renderPrincipalDist():(isSessao?renderPrincipalSessao():renderPrincipal());
  else if(S.currentPage==="trafego") isDist?renderTrafegoDist():(isSessao?renderTrafegoSessao():renderTrafego());
  else if(S.currentPage==="anuncios") isDist?renderAnunciosDist():(isSessao?renderAnunciosSessao():renderAnuncios());

  else if(S.currentPage==="geral-principal") renderGeralPrincipal();
  else if(S.currentPage==="geral-funil") renderGeralFunil();
}
