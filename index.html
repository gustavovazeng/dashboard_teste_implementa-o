function renderFunil(){
  const el=document.getElementById("page-funil");if(!el)return;
  const allDates=Object.keys(S.meta).sort().filter(d=>(!S.startDate||d>=S.startDate)&&(!S.endDate||d<=S.endDate));
  let totalSpend=0;
  for(const d of allDates){ totalSpend+=(S.meta[d]?.spend||0); }
  let trafficLeads=0,organicLeads=0;
  const allLeadDates=Object.keys(S.leadsD).sort().filter(d=>(!S.startDate||d>=S.startDate)&&(!S.endDate||d<=S.endDate));
  for(const d of allLeadDates){
    trafficLeads+=(S.leadsD[d]?.traffic||0);
    organicLeads+=(S.leadsD[d]?.organic||0);
  }

  // Todos os blocos abaixo usam o período TOTAL disponível (visão all-time dos formulários)
  const RENDA_ORDER=["Até R$5.000","De R$5.001 a R$10.000","De R$10.001 a R$15.000","De R$15.001 a R$20.000","De R$20.001 a R$30.000","De R$30.001 a R$50.000","Mais de R$50.000"];
  const CENARIO_ORDER=["Ainda não iniciei o primeiro projeto","Ainda pensando se esse é o mercado ideal","Estou nos primeiros projetos","Já possuo experiência nesse mercado"];
  const CONSTRUIU_ORDER=["Ainda nem comecei","Estou em fase de planejamento","Estou construindo","Já construi, mas ainda não vendi","Já construi e vendi"];
  const GUARDADO_ORDER=["Não tenho nada para investir no momento","Até R$10.000","De R$10.001 a R$20.000","De R$20.001 a R$50.000","De R$50.001 a R$100.000","De R$100.001 a R$200.000","De R$200.001 a R$500.000","Mais de R$500.000"];
  const CLASSIFICACAO_ORDER=["Qualificado","Desqualificado"];

  function totalOf(data){ return Object.values(data).reduce((a,b)=>a+b,0)||0; }

  function breakdownRows(entries,total){
    const t=total||1;
    return entries.map(([label,n])=>{
      const pct=(n/t*100).toFixed(1);
      const w=Math.max(4,(n/t*100));
      return `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:12px;color:var(--text)">${label}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${n} <span style="color:var(--muted);font-size:10px">(${pct}%)</span></span>
        </div>
        <div style="height:4px;background:var(--surf);border-radius:2px">
          <div style="height:4px;width:${w}%;background:var(--accent);border-radius:2px"></div>
        </div>
      </div>`;
    }).join("")||`<p style="color:var(--muted);font-size:12px;padding:12px 0">Sem dados</p>`;
  }
  // Ordem fixa (categorias conhecidas) — mostra na ordem dada, só as que têm dados.
  function breakdown(data,order){
    const total=totalOf(data);
    const keys=order?order.filter(k=>data[k]>0).concat(Object.keys(data).filter(k=>!order.includes(k))):Object.keys(data).sort((a,b)=>(data[b]||0)-(data[a]||0));
    return breakdownRows(keys.map(k=>[k||"—",data[k]||0]),total);
  }
  // Alta cardinalidade (texto livre / muitas origens distintas) — top N + "Outros".
  function breakdownTopN(data,topN){
    const total=totalOf(data);
    const sorted=Object.entries(data).sort((a,b)=>b[1]-a[1]);
    const top=sorted.slice(0,topN);
    const restTotal=sorted.slice(topN).reduce((a,[,n])=>a+n,0);
    const entries=top.map(([k,n])=>[k||"—",n]);
    if(restTotal>0)entries.push([`Outros (${sorted.length-topN} valores diferentes)`,restTotal]);
    return breakdownRows(entries,total);
  }

  const fatTotal=totalOf(S.leadsFat), espTotal=totalOf(S.leadsEsp);
  const construiuTotal=totalOf(S.leadsConstruiu), guardadoTotal=totalOf(S.leadsGuardado);
  const dificuldadeTotal=totalOf(S.leadsDificuldade), classificacaoTotal=totalOf(S.leadsClassificacao);
  const sourceTotal=totalOf(S.leadsSource);

  function block(title,html,total,noun){
    return `<div class="cc">
      <div class="section-lbl" style="margin-top:0">${title}</div>
      ${html}
      <div style="margin-top:8px;font-size:10px;color:var(--hint)">${total} ${noun||"formulário(s)"}</div>
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Métricas do Funil</div>
        <div class="hdr-sub">período: ${fDateBR(S.startDate)} a ${fDateBR(S.endDate)} · atualizado em: ${S.updated||"—"}</div>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:20px">
      ${kpiCard("Investimento",fBRL(totalSpend),"Meta Ads","var(--text-strong)")}
      ${kpiCard("Formulários Tráfego",trafficLeads.toLocaleString("pt-BR"),"utm_source com FBAds","var(--text-strong)")}
      ${kpiCard("Formulários Orgânico",organicLeads.toLocaleString("pt-BR"),"todo o resto (bio, wpp, ytb...)","#34d399")}
    </div>

    <div class="section-lbl" style="margin-top:0">Origem (UTM)</div>
    <div class="cc" style="margin-bottom:20px">
      ${breakdownTopN(S.leadsSource,14)}
      <div style="margin-top:8px;font-size:10px;color:var(--hint)">${sourceTotal} formulário(s) no total (pago + orgânico)</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      ${block("Renda mensal",breakdown(S.leadsFat,RENDA_ORDER),fatTotal,"com dado de renda mensal")}
      ${block("Cenário atual",breakdown(S.leadsEsp,CENARIO_ORDER),espTotal,"com dado de cenário")}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      ${block("Já construiu para vender?",breakdown(S.leadsConstruiu,CONSTRUIU_ORDER),construiuTotal,"responderam")}
      ${block("Quanto tem guardado para investir",breakdown(S.leadsGuardado,GUARDADO_ORDER),guardadoTotal,"responderam")}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      ${block("Classificação",breakdown(S.leadsClassificacao,CLASSIFICACAO_ORDER),classificacaoTotal,"classificados")}
      ${block("Maior dificuldade / desafio",breakdownTopN(S.leadsDificuldade,12),dificuldadeTotal,"responderam (texto livre)")}
    </div>`;
}

// ── Render Tráfego ────────────────────────────────────────────────────────
function renderTrafego(){
  const el=document.getElementById("page-trafego");if(!el)return;
  const today=todayISO();
  const todayM=getDayMetrics(today);
  const p3Start=subDays(today,3);
  const p3End=subDays(today,1);
  const p3Daily=getDailyT(p3Start,p3End);
  const p3Tot=getTotalsT(p3Daily);
  const daily=getDailyT(S.startDate,S.endDate);

  const METRICS=[
    {key:"spend",    lbl:"Investimento",       fmt:fBRL,  meta:null,              higher:null},
    {key:"cpf",      lbl:"Custo por Formulário",fmt:fBRL,  meta:METAS_T.cpf.val,  higher:false},
    {key:"cpc",      lbl:"CPC",                 fmt:fBRL,  meta:METAS_T.cpc.val,  higher:false},
    {key:"ctr",      lbl:"CTR",                 fmt:fPct,  meta:METAS_T.ctr.val,  higher:true},
    {key:"cpm",      lbl:"CPM",                 fmt:fBRL,  meta:METAS_T.cpm.val,  higher:false},
    {key:"connect",  lbl:"Connect Rate",        fmt:fPct,  meta:METAS_T.connect.val,  higher:true},
    {key:"txConvPg", lbl:"Conv. Pg. Formulário",fmt:fPct,  meta:METAS_T.txConvPg.val, higher:true},
  ];

  function metricsRow(dataObj){
    return METRICS.map(m=>{
      const rawVal=dataObj[m.key]||0;
      const color=m.meta?statusColor(rawVal,m.meta,m.higher):"var(--text-strong)";
      const bord=m.meta?statusBorder(rawVal,m.meta,m.higher):"var(--border)";
      return `<div class="kc" style="padding:12px 14px;border-color:${bord}">
        <div class="kc-lbl">${m.lbl}</div>
        <div class="kc-val" style="color:${color};font-size:17px">${m.fmt(rawVal)}</div>
        ${m.meta?`<div class="kc-sub">Meta: ${m.fmt(m.meta)}</div>`:""}
      </div>`;
    }).join("");
  }

  function overlayBtn(key){
    const on=S.overlays[key]?.inv;
    return `<button class="btn-overlay${on?" on":""}"
      style="${on?`border-color:${CHART_INV};color:${CHART_INV};background:${CHART_INV}18`:""}"
      onclick="toggleOverlay('${key}','inv')">+ Invest.</button>`;
  }

  const CHART_CONFIGS=[
    {key:"ctr",     lbl:"CTR",                 fmt:fPct, meta:METAS_T.ctr.val,     metaLbl:`Meta ${METAS_T.ctr.val}%`},
    {key:"cpm",     lbl:"CPM",                 fmt:fBRL, meta:METAS_T.cpm.val,     metaLbl:`Meta R$${METAS_T.cpm.val}`},
    {key:"cpc",     lbl:"CPC",                 fmt:fBRL, meta:METAS_T.cpc.val,     metaLbl:`Meta R$${METAS_T.cpc.val}`},
    {key:"txConvPg",lbl:"Conv. Pg. Formulário",fmt:fPct, meta:METAS_T.txConvPg.val,metaLbl:METAS_T.txConvPg.val!=null?`Meta ${METAS_T.txConvPg.val}%`:"Sem meta"},
    {key:"connect", lbl:"Connect Rate",        fmt:fPct, meta:METAS_T.connect.val, metaLbl:`Meta ${METAS_T.connect.val}%`},
  ];

  function tChart(c){
    return `<div class="cc" style="position:relative">
      <div class="ch">
        <span class="ct">${c.lbl}</span>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:10px;color:var(--hint)">${c.metaLbl}</span>
          <div class="overlay-btns">${overlayBtn(c.key)}</div>
        </div>
      </div>
      <div style="position:relative">
        <canvas id="tc-${c.key}"></canvas>
        <div class="tip" id="tt-${c.key}"></div>
      </div>
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Métricas de Tráfego</div>
        <div class="hdr-sub">atualizado em: ${S.updated||"—"}</div>
      </div>
      <div>${statusLegend()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div class="section-lbl">Hoje — ${fDateBR(today)}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:16px">
      ${metricsRow(todayM)}
    </div>
    <div class="section-lbl">Últimos 3 dias — ${fDateBR(p3Start)} a ${fDateBR(p3End)}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:20px">
      ${metricsRow(p3Tot)}
    </div>
    <div class="charts-2x3">
      ${CHART_CONFIGS.map(c=>tChart(c)).join("")}
    </div>`;

  requestAnimationFrame(()=>{
    const sW=document.getElementById(`tc-${CHART_CONFIGS[0].key}`)?.parentElement?.offsetWidth||500;
    CHART_CONFIGS.forEach(c=>{
      const ov=S.overlays[c.key]?.inv||false;
      drawChartWithOverlay(`tc-${c.key}`,daily,c.key,c.fmt,c.meta,c.metaLbl,ov,sW,170);
      const tipLines=[{key:c.key,color:CHART_COLOR,name:c.lbl,fmt:c.fmt}];
      if(ov)tipLines.push({key:"spend",color:CHART_INV,name:"Investimento",fmt:fBRL});
      setupTip(`tc-${c.key}`,`tt-${c.key}`,daily,tipLines,52,ov?52:12);
    });
  });
}

// ── Render Anúncios ─────────────────────────────────────────────────────────
function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;
  const start=S.startDate,end=S.endDate;

  function sumLeads(map,key){ let t=0;for(const[d,n]of Object.entries(map[key]||{})){if(d>=start&&d<=end)t+=n;}return t; }
  function fDM(iso){if(!iso)return"—";const[,m,d]=iso.split("-");return`${d}/${m}`;}
  const dateLabel=start===end?fDM(start):`${fDM(start)} a ${fDM(end)}`;

  // Campaign rows
  const campRows=[];
  for(const [campName,byDate] of Object.entries(S.metaByCampByDate)){
    let cSpend=0,cClicks=0,cImpr=0;
    for(const[d,vals] of Object.entries(byDate)){if(d>=start&&d<=end){cSpend+=vals.spend;cClicks+=vals.clicks;cImpr+=vals.impressions;}}
    if(cSpend===0)continue;
    const cLeads=sumLeads(S.leadsByCamp,campName);
    campRows.push({campName,spend:cSpend,clicks:cClicks,impressions:cImpr,leads:cLeads,
      cpc:cClicks>0?cSpend/cClicks:0, ctr:cImpr>0?(cClicks/cImpr)*100:0,
      cpm:cImpr>0?(cSpend/cImpr)*1000:0, cpf:cLeads>0?cSpend/cLeads:0});
  }
  const {col:cCol,dir:cDir}=S.cSort;
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol]??"",bv=b[cCol]??"";
    if(typeof av==="string")return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });

  const _cq=S.campSearch.trim().toLowerCase();
  const filteredCamps=_cq?sortedCamps.filter(c=>c.campName.toLowerCase().includes(_cq)):sortedCamps;

  const hasCampSel=S.selectedCamps.size>0;
  const adRows=[];
  for(const[adName,metaAd] of Object.entries(S.metaByAd)){
    if(hasCampSel){
      const adCamps=metaAd.camps||new Set();
      if(![...S.selectedCamps].some(c=>adCamps.has(c)))continue;
    }
    const byDate=S.metaByAdByDate[adName]||{};
    let spend=0,clicks=0,impressions=0,igUrl="";
    for(const[d,vals] of Object.entries(byDate)){if(d>=start&&d<=end){spend+=vals.spend;clicks+=vals.clicks;impressions+=vals.impressions;if(!igUrl&&vals.igUrl)igUrl=vals.igUrl;}}
    if(spend===0)continue;
    if(!igUrl)igUrl=metaAd.igUrl||"";
    let leads=0;
    for(const adId of(metaAd.adIds||[])){
      const byDate2=S.leadsByAdId[adId]||{};
      for(const[d,n] of Object.entries(byDate2)){if(d>=start&&d<=end)leads+=n;}
    }
    adRows.push({adName,spend,clicks,impressions,leads,igUrl,
      cpc:clicks>0?spend/clicks:0, ctr:impressions>0?(clicks/impressions)*100:0,
      cpm:impressions>0?(spend/impressions)*1000:0, cpf:leads>0?spend/leads:0});
  }

  const tot=campRows.reduce((a,c)=>({spend:a.spend+c.spend,clicks:a.clicks+c.clicks,impressions:a.impressions+c.impressions,leads:a.leads+c.leads}),{spend:0,clicks:0,impressions:0,leads:0});
  const totCpf=tot.leads>0?tot.spend/tot.leads:0;
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;

  const _aq=S.adSearch.trim().toLowerCase();
  const filteredAds=_aq?adRows.filter(a=>a.adName.toLowerCase().includes(_aq)):adRows;

  const {col,dir}=S.aSort;
  const sorted=[...filteredAds].sort((a,b)=>{
    const av=a[col]??0,bv=b[col]??0;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });

  const selAds=sorted.filter(a=>S.selectedAds.has(a.adName));
  const hasSelAds=selAds.length>0;
  let adResumoText="";
  if(hasSelAds){
    const lines=["*Melhores ads - Sessão Estratégica*","",`_${dateLabel}_`,""];
    for(const a of selAds){
      lines.push(`Nome do ad ⤵️`);
      lines.push(a.adName);
      if(a.igUrl)lines.push(a.igUrl);
      lines.push(`Investimento:\t${fBRL(a.spend)}`);
      lines.push(`Formulários:\t${a.leads}`);
      lines.push(`Custo por Formulário:\t${a.leads>0?fBRL(a.cpf):"—"}`);
      lines.push(``);
      lines.push(`CPC:\t${fBRL(a.cpc)}`);
      lines.push(`CPM:\t${fBRL(a.cpm)}`);
      lines.push(`CTR:\t${fPct(a.ctr)}`);
      lines.push(``);
    }
    adResumoText=lines.join("\n");
  }
  el._adResumoText=adResumoText;

  function sc(v,m,hi){return statusColor(v,m,hi);}
  const _fid=document.activeElement?.id;
  const TH="padding:10px 14px;text-align:right;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap";
  const THL="padding:10px 14px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);border-bottom:1px solid var(--border);white-space:nowrap";
  const THCK="width:36px;padding:10px 8px;text-align:center;border-bottom:1px solid var(--border)";

  function thC(col_,lbl,isCamp){
    const aC=isCamp?cCol:col,aD=isCamp?cDir:dir,active=aC===col_;
    const arrow=active?(aD==="asc"?" ↑":" ↓"):" ↕";
    const fn=isCamp?`sortCampanhas('${col_}')`:`sortAnuncios('${col_}')`;
    return `<th onclick="${fn}" style="${TH};color:${active?"var(--text)":"var(--hint)"}">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};font-size:9px;margin-left:3px">${arrow}</span></th>`;
  }

  function chkBox(checked){
    return `<div style="width:16px;height:16px;border-radius:4px;border:2px solid ${checked?"#10b981":"rgba(255,255,255,.2)"};background:${checked?"#10b981":"transparent"};display:flex;align-items:center;justify-content:center;margin:auto;transition:all .15s">
      ${checked?`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L4 7L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Campanhas / Anúncios</div>
        <div class="hdr-sub">atualizado em: ${S.updated||"—"} · ${sortedCamps.length} campanhas · ${sorted.length} anúncios${S.selectedAds.size>0?" · "+S.selectedAds.size+" anúncio"+(S.selectedAds.size>1?"s":"")+" selecionado"+(S.selectedAds.size>1?"s":""):""}</div>
      </div>
      <div>${statusLegend()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px">
      ${kpiCard("Investimento",fBRL(tot.spend),"Meta Ads","var(--text-strong)")}
      ${kpiCard("Formulários",tot.leads.toLocaleString("pt-BR"),"tráfego","var(--text-strong)")}
      ${kpiCard("Custo por Formulário",totCpf>0?fBRL(totCpf):"—",`meta ${fBRL(META_CPF)}`,totCpf>0?sc(totCpf,META_CPF,false):"var(--text-strong)",false,totCpf,META_CPF,false)}
      ${kpiCard("CTR",fPct(totCtr),`meta ${METAS_T.ctr.val}%`,sc(totCtr,METAS_T.ctr.val,true),false,totCtr,METAS_T.ctr.val,true)}
    </div>

    <!-- Campanhas -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin-bottom:0">Campanhas</div>
      ${S.selectedCamps.size>0?`<button onclick="clearCamps()" style="font-size:10px;padding:3px 9px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#f87171;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">✕ Limpar seleção (${S.selectedCamps.size})</button>`:""}
      <span style="font-size:10px;color:var(--hint)">Clique para filtrar anúncios por campanha</span>
    </div>
    <div style="position:relative;margin-bottom:10px">
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:12px;pointer-events:none">🔍</span>
      <input id="camp-search-input" oninput="setCampSearch(this.value)" value="${S.campSearch}" placeholder="Buscar campanha…" style="width:100%;padding:8px 12px 8px 34px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box" onfocus="this.style.borderColor='rgba(96,165,250,.4)'" onblur="this.style.borderColor='var(--border)'"/>
    </div>
    <div style="overflow-x:auto;margin-bottom:22px">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:var(--card)">
          <th style="${THCK}"></th>
          <th onclick="sortCampanhas('campName')" style="${THL};cursor:pointer;user-select:none">Campanha ${cCol==="campName"?(cDir==="asc"?"↑":"↓"):"↕"}</th>
          ${thC("spend","Investimento",true)}
          ${thC("leads","Formulários",true)}
          ${thC("cpf","Custo por Formulário",true)}
          ${thC("ctr","CTR",true)}
          ${thC("cpm","CPM",true)}
          ${thC("cpc","CPC",true)}
        </tr></thead>
        <tbody>
          ${filteredCamps.map(c=>{
            const sel=S.selectedCamps.has(c.campName);
            return `<tr onclick="toggleCamp('${c.campName.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}' )" style="cursor:pointer;border-top:1px solid var(--border);background:${sel?"rgba(16,185,129,.1)":"transparent"}" onmouseover="if(!this.dataset.sel||this.dataset.sel==='0')this.style.background='rgba(255,255,255,.03)'" onmouseout="if(!this.dataset.sel||this.dataset.sel==='0')this.style.background='transparent'" data-sel="${sel?'1':'0'}">
              <td style="padding:8px;text-align:center;border-top:1px solid var(--border)">${chkBox(sel)}</td>
              <td style="padding:9px 14px;color:${sel?"#10b981":"var(--text)"};font-size:11px;font-weight:${sel?600:400};max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span title="${c.campName}">${c.campName}</span></td>
              <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-strong)">${fBRL(c.spend)}</td>
              <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace">${c.leads}</td>
              <td style="padding:9px 14px;text-align:right;color:${c.cpf>0?sc(c.cpf,META_CPF,false):"var(--muted)"}">${c.cpf>0?fBRL(c.cpf):"—"}</td>
              <td style="padding:9px 14px;text-align:right;color:${sc(c.ctr,METAS_T.ctr.val,true)}">${fPct(c.ctr)}</td>
              <td style="padding:9px 14px;text-align:right;color:${sc(c.cpm,METAS_T.cpm.val,false)}">${fBRL(c.cpm)}</td>
              <td style="padding:9px 14px;text-align:right;color:${sc(c.cpc,METAS_T.cpc.val,false)}">${fBRL(c.cpc)}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>

        <!-- Anúncios -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin-bottom:0">Anúncios</div>
      ${S.selectedAds.size>0?`<button onclick="clearAds()" style="font-size:10px;padding:3px 9px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#f87171;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">✕ Limpar seleção (${S.selectedAds.size})</button>`:""}
      <span style="font-size:10px;color:var(--hint)">Clique para selecionar e gerar resumo</span>
    </div>
    <div style="position:relative;margin-bottom:10px">
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:12px;pointer-events:none">🔍</span>
      <input id="ad-search-input" oninput="setAdSearch(this.value)" value="${S.adSearch}" placeholder="Buscar anúncio…" style="width:100%;padding:8px 12px 8px 34px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box" onfocus="this.style.borderColor='rgba(96,165,250,.4)'" onblur="this.style.borderColor='var(--border)'"/>
    </div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:var(--card)">
          <th style="${THCK}"></th>
          <th onclick="sortAnuncios('adName')" style="${THL};cursor:pointer;user-select:none">Anúncio ${col==="adName"?(dir==="asc"?"↑":"↓"):"↕"}</th>
          ${thC("spend","Investimento",false)}
          ${thC("leads","Formulários",false)}
          ${thC("cpf","Custo por Formulário",false)}
          ${thC("ctr","CTR",false)}
          ${thC("cpm","CPM",false)}
          ${thC("cpc","CPC",false)}
          <th style="${THCK}"></th>
        </tr></thead>
        <tbody>
          ${sorted.map(a=>{
            const sel=S.selectedAds.has(a.adName);
            return `<tr onclick="toggleAd('${a.adName.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}')" style="cursor:pointer;border-top:1px solid var(--border);background:${sel?"rgba(16,185,129,.1)":"transparent"}" onmouseover="if(!this.dataset.sel||this.dataset.sel==='0')this.style.background='rgba(255,255,255,.03)'" onmouseout="if(!this.dataset.sel||this.dataset.sel==='0')this.style.background='transparent'" data-sel="${sel?'1':'0'}">
              <td style="padding:8px;text-align:center;border-top:1px solid var(--border)">${chkBox(sel)}</td>
              <td style="padding:9px 14px;color:${sel?"#10b981":"var(--text)"};font-size:11px;font-weight:${sel?600:400};max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${a.adName}">${a.adName}</td>
              <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-strong)">${fBRL(a.spend)}</td>
              <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace">${a.leads}</td>
              <td style="padding:9px 14px;text-align:right;color:${a.cpf>0?sc(a.cpf,META_CPF,false):"var(--muted)"}">${a.cpf>0?fBRL(a.cpf):"—"}</td>
              <td style="padding:9px 14px;text-align:right;color:${sc(a.ctr,METAS_T.ctr.val,true)}">${fPct(a.ctr)}</td>
              <td style="padding:9px 14px;text-align:right;color:${sc(a.cpm,METAS_T.cpm.val,false)}">${fBRL(a.cpm)}</td>
              <td style="padding:9px 14px;text-align:right;color:${sc(a.cpc,METAS_T.cpc.val,false)}">${fBRL(a.cpc)}</td>
              <td style="padding:9px 14px;text-align:center" onclick="event.stopPropagation()">${a.igUrl?`<a href="${a.igUrl}" target="_blank" rel="noopener" style="display:inline-block;padding:3px 8px;border:1px solid rgba(99,179,237,.35);border-radius:5px;color:#63b3ed;text-decoration:none;font-size:10px;font-weight:600;letter-spacing:.03em" title="Ver anúncio">Ver ↗</a>`:"—"}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>

    ${hasSelAds?`
    <div style="margin-top:22px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div class="section-lbl" style="margin-bottom:2px">Resumo de Anúncios</div>
          <div style="font-size:10px;color:var(--hint)">${selAds.length} ad(s): ${dateLabel}</div>
        </div>
        <button id="btn-copy-ads" onclick="copyAdResumo()" style="padding:6px 16px;background:rgba(59,130,246,.15);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copiar resumo
        </button>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px">
        <pre style="font-family:'JetBrains Mono','DM Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.9;margin:0;user-select:all">${adResumoText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
      </div>
    </div>`:""}
  `;
  if(_fid==="camp-search-input"||_fid==="ad-search-input"){
    requestAnimationFrame(()=>{
      const _inp=document.getElementById(_fid);
      if(_inp){_inp.focus();const _l=_inp.value.length;_inp.setSelectionRange(_l,_l);}
    });
  }
}

// ── Render Resumo ─────────────────────────────────────────────────────────
function renderResumo(){
  const el=document.getElementById("page-resumo");if(!el)return;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  const tot  =periodMetrics(start,end);
  const ontem=periodMetrics(yest,yest);
  const hojeBase=periodMetrics(today,today);
  const hoje={...hojeBase};
  if(S.manualSpendHoje!==null){
    hoje.spend=S.manualSpendHoje;
    hoje.cpf=hoje.trafficLeads>0?hoje.spend/hoje.trafficLeads:0;
  }
  // Se "hoje" está dentro do período do bloco Total e o investimento de hoje foi editado
  // manualmente, propaga a diferença pro Total (resumo consolidado) e recalcula o custo por
  // formulário/ficha do período inteiro.
  if(S.manualSpendHoje!==null && today>=start && today<=end){
    const delta=S.manualSpendHoje-hojeBase.spend;
    tot.spend+=delta;
    tot.cpf=tot.trafficLeads>0?tot.spend/tot.trafficLeads:0;
  }

  function fDM(iso){if(!iso)return"—";const[,m,d]=iso.split("-");return`${d}/${m}`;}
  const dateLabel=start===end?fDM(start):`${fDM(start)} a ${fDM(end)}`;

  function fBRLR(n){ return "R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }

  function blockText(label,m){
    const cpfE=em(m.cpf,     META_CPF,              false);
    const cnE =em(m.connect, METAS_T.connect.val,   true);
    const pcE =em(m.txConvPg,METAS_T.txConvPg.val,  true);
    const cpcE=em(m.cpc,     METAS_T.cpc.val,       false);
    const ctrE=em(m.ctr,     METAS_T.ctr.val,       true);
    const cpmE=em(m.cpm,     METAS_T.cpm.val,       false);
    const lines=[
`*${label}*`,
``,
`Investimento:\t${fBRLR(m.spend)}`,
`Formulários preenchidos:\t${m.trafficLeads}`,
`Custo por formulário:\t${fBRLR(m.cpf)}\t${cpfE} Meta: R$ ${fN(META_CPF)}`,
``,
`Custo por formulário quente:\t${m.leadsQuente>0?fBRLR(m.cpfQuente):"—"}`,
`Custo por formulário frio:\t${m.leadsFrio>0?fBRLR(m.cpfFrio):"—"}`,
``,
`Connect Rate:\t${(m.connect||0).toFixed(0)}%\t${cnE} Meta: ${METAS_T.connect.val}%`,
`Tx conv pg formulário:\t${(m.txConvPg||0).toFixed(2)}%\t${pcE}`,
``,
`CPC:\t${fBRLR(m.cpc)}\t${cpcE} Meta: R$ ${fN(METAS_T.cpc.val)}`,
`CTR:\t${(m.ctr||0).toFixed(2)}%\t${ctrE} Meta: ${METAS_T.ctr.val}%`,
`CPM:\t${fBRLR(m.cpm)}\t${cpmE} Meta: R$ ${fN(METAS_T.cpm.val)}`,
    ];
    return lines.join("\n");
  }

  const resumoText=
`*Resumo consolidado - Sessão Estratégica - ${monthLabel(end)}*\t\t

_${dateLabel}_\t\t

📶 ${blockText("Total",tot)}

⬅️ ${blockText("Ontem",ontem)}

⬇️ ${blockText("Hoje",hoje)}`;

  // Visual blocks
  function row(lbl,val,metaStr,emoji){
    return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${val||"—"}</span>
      <span style="font-size:13px;min-width:28px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaStr||""}</span></span>
    </div>`;
  }
  function section(label,m,isHoje=false){
    const cpfE=em(m.cpf,     META_CPF,              false);
    const cnE =em(m.connect, METAS_T.connect.val,   true);
    const pcE =em(m.txConvPg,METAS_T.txConvPg.val,  true);
    const cpcE=em(m.cpc,     METAS_T.cpc.val,       false);
    const ctrE=em(m.ctr,     METAS_T.ctr.val,       true);
    const cpmE=em(m.cpm,     METAS_T.cpm.val,       false);
    const isManual=isHoje&&S.manualSpendHoje!==null;
    const investRow=isHoje?`
      <div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
        <span style="color:var(--muted);font-size:12px">Investimento</span>
        <input id="manual-spend-input"
          value="${isManual?(m.spend||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''}"
          placeholder="${fBRLR(hojeBase.spend)}"
          oninput="setManualSpendHoje(this.value)"
          onkeydown="if(event.key==='Enter')this.blur()"
          style="font-family:'JetBrains Mono',monospace;font-size:12px;color:${isManual?'#fbbf24':'var(--text-strong)'};background:transparent;border:none;border-bottom:1px solid ${isManual?'rgba(251,191,36,.4)':'rgba(255,255,255,.1)'};outline:none;padding:2px 0;width:100%"/>
        <span style="font-size:13px;min-width:80px;text-align:right">
          ${isManual?`<button onclick="clearManualSpend()" style="font-size:10px;padding:2px 8px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fbbf24;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">↩ Restaurar</button>`:""}
        </span>
      </div>`:row("Investimento",fBRLR(m.spend),"","");
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">${label}</div>
      ${investRow}
      ${row("Formulários preenchidos",m.trafficLeads,"","")}
      ${row("Custo por Formulário",fBRLR(m.cpf),`meta R$ ${fN(META_CPF)}`,cpfE)}
      ${row("Custo por Formulário quente",m.leadsQuente>0?fBRLR(m.cpfQuente):"—","","")}
      ${row("Custo por Formulário frio",m.leadsFrio>0?fBRLR(m.cpfFrio):"—","","")}
      <div style="height:10px"></div>
      ${row("Connect Rate",(m.connect||0).toFixed(2)+"%",`meta ${METAS_T.connect.val}%`,cnE)}
      ${row("Tx conv pg formulário",(m.txConvPg||0).toFixed(2)+"%","",pcE)}
      <div style="height:10px"></div>
      ${row("CPC",fBRLR(m.cpc),`meta R$ ${fN(METAS_T.cpc.val)}`,cpcE)}
      ${row("CTR",(m.ctr||0).toFixed(2)+"%",`meta ${METAS_T.ctr.val}%`,ctrE)}
      ${row("CPM",fBRLR(m.cpm),`meta R$ ${fN(METAS_T.cpm.val)}`,cpmE)}
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)}</div>
      </div>
      <button onclick="copyResumo()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all .15s">
        📋 Copiar resumo
      </button>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div style="display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start">
      <div>
        ${section("📶 Total",tot)}
        ${section("⬅️ Ontem",ontem)}
        ${section("⬇️ Hoje",hoje,true)}
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;position:sticky;top:70px">
        <pre id="resumo-preview" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.8;margin:0;user-select:all">${resumoText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
      </div>
    </div>`;
  el._resumoText=resumoText;
  requestAnimationFrame(()=>{
    const fid=document.activeElement?.id;
    if(fid==="manual-spend-input"||fid==="plan-invest-input"||fid==="plan-form-input"){
      const _s=document.getElementById(fid);
      if(_s){const _l=_s.value.length;_s.setSelectionRange(_l,_l);}
    }
  });
}

function setManualSpendHoje(v){
  const n=parseFloat(v.replace(/[R$\s.]/g,"").replace(",","."));
  S.manualSpendHoje=(isNaN(n)||n<=0)?null:n;
  renderResumo();
}
function clearManualSpend(){S.manualSpendHoje=null;renderResumo();}
function copyResumo(){
  const el=document.getElementById("page-resumo");
  const text=el?._resumoText||"";if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    const btns=document.querySelectorAll("button");
    btns.forEach(b=>{if(b.textContent.includes("Copiar resumo")){const orig=b.innerHTML;b.innerHTML="✓ Copiado!";setTimeout(()=>{b.innerHTML=orig;},1800);}});
  }).catch(()=>alert("Selecione o texto manualmente."));
}

function render(){
  renderHeader();
  const ld=document.getElementById("loading");
  if(S.firstLoad&&S.loading){if(ld)ld.style.display="flex";return;}
  if(ld)ld.style.display="none";
  const errEl=document.getElementById("err-panel");
  if(errEl){
    if(S.error){
      errEl.style.display="flex";
      errEl.innerHTML=`<div style="background:#1e1014;border:1px solid #f87171;border-radius:12px;padding:24px 28px;max-width:700px;width:100%">
        <div style="color:#f87171;font-weight:700;font-size:15px;margin-bottom:12px">⚠️ Erro ao carregar dados</div>
        <code style="display:block;color:#fca5a5;font-size:12px;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-all;line-height:1.6">${S.error}</code>
        <button onclick="loadData(true)" style="margin-top:16px;padding:8px 18px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px">↻ Tentar novamente</button>
      </div>`;
      return;
    } else { errEl.style.display="none"; }
  }
  if(S.currentPage==="principal")    renderPrincipal();
  else if(S.currentPage==="funil")   renderFunil();
  else if(S.currentPage==="trafego") renderTrafego();
  else if(S.currentPage==="anuncios")renderAnuncios();
  else if(S.currentPage==="resumo")  renderResumo();
}

// ── Init ─────────────────────────────────────────────────────────────────
render();
loadData();

</script>
</body>
</html>
